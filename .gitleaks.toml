title = "gitleaks config for petry-projects/.github-private"

[allowlist]
description = "Suppress false positives in git-subtree framework imports and test fixtures"
# frameworks/ is managed via `git subtree` from upstream repos; test fixtures in
# those trees use placeholder keys that match gitleaks rules but are not real secrets.
# tests/dev-lead/unit/test_engine_writer.bats contains a heredoc stub that matches
# the private-key rule in a historical commit; the content is fabricated test data.
paths = [
  '''frameworks/''',
  '''tests/dev-lead/unit/test_engine_writer\.bats''',
]
