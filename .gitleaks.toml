title = "gitleaks config for petry-projects/.github-private"

[extend]
useDefault = true

# condition="AND" requires BOTH path AND regex to match before suppressing a finding;
# without it gitleaks defaults to OR, which would suppress real secrets in other files
# that happen to match the regexes, or any finding in the test file regardless of type.
# - Commit cd4b367: literal PEM block in the PEM-redaction test fixture.
# - Current HEAD: GEMINI_API_KEY="dummy-test-key" engine-setup stub.
[[allowlists]]
description = "Suppress test-fixture false positives in test_engine_writer.bats"
condition = "AND"
paths = ['''^tests/dev-lead/unit/test_engine_writer\.bats$''']
regexes = [
  '''MIIEowIBAAKCAQEAuVERYSENSITIVEKEYBODY''',
  '''dummy-test-key''',
]

# Historical git-subtree framework files (removed in d42bfe7) contain specific placeholder
# credentials. Each entry uses condition="AND" to bind the known dummy pattern to its file
# path so only those exact values are suppressed; a real secret at these paths in a future
# commit would not match and would be reported by gitleaks.
[[allowlists]]
description = "Suppress BSA dummy key in historical gsd SDK test files"
condition = "AND"
paths = [
  '''^frameworks/gsd/sdk/src/query/config-query\.test\.ts$''',
  '''^frameworks/gsd/sdk/src/query/config-mutation\.test\.ts$''',
]
regexes = ['''BSA-1234567890abcdef''']

[[allowlists]]
description = "Suppress example credentials in historical bmad-method adversarial test fixture"
condition = "AND"
paths = ['''^frameworks/bmad-method/test/adversarial-review-tests/sample-content\.md$''']
regexes = [
  '''password123''',
  '''eyJhbGciOiJIUzI1NiIs''',
]

[[allowlists]]
# test-key: BRAVE_API_KEY = 'test-key' stub at lines 1335-1405
# 03-VERIFICATION.md: path.join(..., '03-api', '03-VERIFICATION.md') at line 759 triggers
#   generic-api-key because '03-api' contains the keyword 'api' followed by the 19-char
#   filename which has sufficient entropy — all three historical commits where this appeared.
description = "Suppress test API key value in historical gsd commands test"
condition = "AND"
paths = ['''^frameworks/gsd/tests/commands\.test\.cjs$''']
regexes = [
  '''test-key''',
  '''03-VERIFICATION\.md''',
]

# Skills knowledge files (added in commit bda766be) include api-testing-patterns.md which
# contains an example expired JWT at line 681:
#   const expiredToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'; // Expired token
# The variable name and comment confirm this is documentation, not a real credential.
[[allowlists]]
# commit bda766be added bmad skill knowledge files and config manifests containing
# example API key patterns used in tutorial/documentation content — not real credentials.
# All generic-api-key findings in this commit are false positives.
description = "Suppress generic-api-key false positives in historical bmad skill/config additions"
targetRules = ["generic-api-key"]
condition = "AND"
commits = ["bda766be1f1156327d54bc7497da74225ee853bf"]
regexes = [
  '''eyJhbGciOiJIUzI1NiIs''',
  '''[0-9a-f]{64}''',
]

# Vendored BMAD Method skill trees under frameworks/ (src/ from upstream tags;
# see frameworks/*/VENDOR.md, linguist-vendored). The Test Architect knowledge
# base ships ILLUSTRATIVE auth/test patterns (example JWTs, "password=" snippets)
# that trip gitleaks' default rules — documentation examples, not real creds.
# Historical commits placed the same vendored content under .claude/skills/ before
# it was reorganised into frameworks/bmad-test-architecture/.
[[allowlists]]
description = "Vendored BMAD skills — example creds in framework docs"
targetRules = ["generic-api-key"]
condition = "AND"
paths = [
  '''^frameworks/bmad-method/''',
  '''^frameworks/bmad-test-architecture/''',
  '''^\.claude/skills/''',
]
regexes = [
  '''eyJhbGciOiJIUzI1NiIs''',
  '''(?i)(password123|dummy|example|placeholder|test-key)''',
]

[[allowlists]]
description = "Suppress truncated example JWT in bmad skill api-testing-patterns.md knowledge files"
condition = "AND"
paths = ['''^\.claude/skills/[^/]+/resources/knowledge/api-testing-patterns\.md$''']
regexTarget = "line"
regexes = ['''expiredToken''']

# Historical commit bda766be introduced a BMAD files-manifest under _bmad/_config/.
# The CSV lists file paths (including *api-request.md) followed by SHA-256 checksums;
# the "api" keyword + high-entropy checksum trips the generic-api-key rule.
# Rows whose slug contains keywords like "api", "auth", or "key" trigger generic-api-key
# because the 64-char hex digest that follows has high entropy. These are content-integrity
# checksums, not credentials; every entry in the last column is a SHA256 of file content.
[[allowlists]]
description = "BMAD files-manifest CSV — file paths + checksums, not credentials"
condition = "AND"
paths = ['''^_bmad/_config/files-manifest\.csv$''']
regexes = [
  '''api-request''',
  '''[0-9a-f]{64}''',
]

# Issue #697 / PR #705 added a regression-guard test that embeds the example expired
# JWT (the same dummy token used in .claude/skills/**/api-testing-patterns.md) directly
# in this self-test as `EXPIRED_JWT='eyJ...'`. The full-history secret scan flags that
# literal like any other occurrence. condition="AND" binds the dummy value to this one
# path, so a real secret committed here in future would still be reported.
[[allowlists]]
description = "Suppress the example expired-JWT fixture in the gitleaks-config self-test (issue #697 / PR #705)"
condition = "AND"
paths = ['''^tests/test_gitleaks_config\.bats$''']
regexes = ['''eyJhbGciOiJIUzI1NiIs''']

# Engine fallback and fix-issue unit tests originally used a 40-char classic-PAT-length
# placeholder "ghp_classicPATplaceholder0000000000000000" in commit eb7fd4c to trigger
# the copilot-skip path in engine.sh (ghp_* prefix → copilot fallback skipped). Commit
# 7cbe053 replaced it with the shorter "ghp_stub" (below entropy threshold).
# gitleaks v8.24.3 does not honour condition="AND" when both `commits` and `regexes`
# are specified together, so the commit-scoped entry below is inert. The path-based
# entries that follow cover both the historical placeholder (eb7fd4c) and the current
# stub; .gitleaksignore fingerprints are retained as a belt-and-suspenders fallback.
[[allowlists]]
description = "Suppress classic-PAT-length placeholder in Phase 1 engine-failure tests (commit eb7fd4c)"
targetRules = ["github-pat"]
condition = "AND"
commits = ["eb7fd4c955378d274794e38ee9b942912ce79c6f"]
regexes = ['''ghp_classicPATplaceholder0000000000000000''']

# Path-based entries suppress both the historical 40-char placeholder (commit eb7fd4c)
# and the current shorter stub (ghp_stub, below entropy threshold) in these test files.
# Each allowlist uses a single regex so that gitleaks' condition="AND" logic (which ANDs
# across condition types AND within the regexes array) can satisfy the regex condition
# with one match.
[[allowlists]]
description = "Suppress ghp_stub placeholder in test_engine_fallback.bats (current commits)"
targetRules = ["github-pat"]
condition = "AND"
paths = ['''^tests/dev-lead/unit/test_engine_fallback\.bats$''']
regexes = ['''ghp_stub''']

[[allowlists]]
description = "Suppress historical classic-PAT placeholder in test_engine_fallback.bats (commit eb7fd4c)"
targetRules = ["github-pat"]
condition = "AND"
paths = ['''^tests/dev-lead/unit/test_engine_fallback\.bats$''']
regexes = ['''ghp_classicPATplaceholder0000000000000000''']

[[allowlists]]
description = "Suppress ghp_stub placeholder in test_fix_issue.bats (current commits)"
targetRules = ["github-pat"]
condition = "AND"
paths = ['''^tests/dev-lead/unit/test_fix_issue\.bats$''']
regexes = ['''ghp_stub''']

[[allowlists]]
description = "Suppress historical classic-PAT placeholder in test_fix_issue.bats (commit eb7fd4c)"
targetRules = ["github-pat"]
condition = "AND"
paths = ['''^tests/dev-lead/unit/test_fix_issue\.bats$''']
regexes = ['''ghp_classicPATplaceholder0000000000000000''']
