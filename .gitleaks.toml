title = "gitleaks config for petry-projects/.github-private"

[extend]
useDefault = true

[allowlist]
description = "Suppress false positives in test fixtures"
# tests/dev-lead/unit/test_engine_writer.bats contains a heredoc stub that matches
# the private-key rule in a historical commit; the content is fabricated test data.
# If frameworks/ is re-added via `git subtree`, add the specific fixture paths that
# produce false positives here — do not add a broad ^frameworks/ directory allowlist.
paths = [
  '''^tests/dev-lead/unit/test_engine_writer\.bats$''',
]
