# Persona manifest — SRE Lead (Site Reliability & Operations Advisor).
# Worked example for standards/persona-standards.md (in petry-projects/.github):
# the wrap-a-vendored-framework-agent, advisory-everywhere path.
#
# Naming: this persona is `sre-lead` — the ROLE (persona-standards.md §1.6).
# The vendored agent it wraps carries a person-name upstream; that stays
# upstream. We point at it only by its technical skill id (`framework.skill`).
#
# Validate against: petry-projects/.github standards/personas/persona.schema.json

schema_version: 1

id: sre-lead
name: SRE Lead
title: Site Reliability & Operations Advisor
summary: >-
  Advises on observability strategy, incident response, SLO/SLI and error
  budgets, disaster recovery, and reliability patterns — asking "what happens
  when this fails?" and treating toil and unmonitored critical paths as risk.

# Draft: the manifest and evals exist, but sre-lead is not yet cut as a fleet
# reusable and is not yet in canary-rings.json (see README). Promote once a
# dedicated advisory workflow + release are added.
status: draft

owner: petry-projects/org-leads

# --- How humans address this persona (§4.1) --------------------------------
# An org TEAM handle, never a user account: '@sre-lead' is a real, live GitHub
# account owned by a stranger, so keying on the bare role would silently
# notify them on every mention. The team slug equals `id`, so the router
# resolves a mention by stripping the org prefix.
#
# Team requirements (verified by CI, not by the schema — they need the network):
#   privacy: closed                               (secret teams are unmentionable)
#   notification_setting: notifications_disabled  (routes a webhook, not a page)
address:
  handle: petry-projects/sre-lead

definition:
  layers:
    # A vendored BMAD B-Great ops agent, consumed by path (vendor-neutral
    # markdown). We track upstream and contribute back rather than fork — so
    # there are no local hand-edits to frameworks/.
    - kind: framework-agent
      path: frameworks/bmad-bgreat-suite/src/agents/bgr-agent-morgan-sre
      framework:
        name: bmad-bgreat-suite
        upstream_repo: petry-projects/bmad-bgreat-suite
        vendor_pin: ae8914e84b87    # matches frameworks/bmad-bgreat-suite/VENDOR.md
        skill: bgr-agent-morgan-sre
      # No local_overrides today. When sre-lead gains an org-specific advisory
      # wrapper, add it here and set upstream_candidate honestly.

skills:
  - name: bgr-agent-morgan-sre
    path: frameworks/bmad-bgreat-suite/src/agents/bgr-agent-morgan-sre/SKILL.md
    source: vendored

# sre-lead is a reliability ADVISOR — advisory on every surface, write nowhere.
triggers:
  default_mode: advisory
  opt_out_label: sre-lead:hands-off
  surfaces:
    - surface: mention
      events: [created]
      enabled: true
      mode: advisory
      notes: "Direct invocation: '@petry-projects/sre-lead assess reliability risk on this change'."

    - surface: issues
      events: [labeled, commented]
      enabled: true
      mode: advisory
      notes: "Observability / SLO / incident-response / DR strategy input on issues/epics."

    - surface: discussion
      events: [labeled, commented]
      enabled: true
      mode: advisory
      bridge: repository_dispatch
      notes: "Discussions can't run the agent inline — must bridge (issue #571)."

trust:
  author_association_floor: [OWNER, MEMBER, COLLABORATOR]

# --- Runtime identity (§5.1) ------------------------------------------------
# Advisory-only: sre-lead ships no dedicated reusable/stub in this pilot.
# It is consumed by path and is human-invocable. On the comment path it posts
# as `don-petry` (the persona runner authenticates with that account's PAT).
runtime:
  identity:
    account: don-petry
    credential: GH_PAT_DON_PETRY

evals:
  required_before: stable
  path: evals/sre-lead/     # under the repo eval tree so validate-cases.py + holdout-guard.yml cover it
  judge: evals/judge.md
  min_cases: 5              # seed cases are placeholders; reach 5 held-out before stable

canary:
  registry: petry-projects/.github/standards/canary-rings.json
  agent: sre-lead          # entry added at first release cut (not present while status: draft)

references:
  - "frameworks/bmad-bgreat-suite/VENDOR.md"
  - "petry-projects/.github standards/persona-standards.md"
