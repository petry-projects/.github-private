# Persona manifest — QA Lead (Master Test Architect & Quality Advisor).
# Worked example for standards/persona-standards.md (in petry-projects/.github):
# the wrap-a-vendored-framework-agent, advisory-everywhere path.
#
# Naming: this persona is `qa-lead` — the ROLE (persona-standards.md §1.6).
# The vendored agent it wraps carries a person-name upstream; that stays
# upstream. We point at it only by its technical skill id (`framework.skill`).
#
# Validate against: petry-projects/.github standards/personas/persona.schema.json

schema_version: 1

id: qa-lead
name: QA Lead
title: Master Test Architect & Quality Advisor
summary: >-
  Advises on risk-based test strategy, fixture architecture, quality gates, and
  test review across the test and deliver phases — calculating risk vs value and
  treating flakiness as critical tech debt.

# Draft: the manifest and evals exist, but qa-lead is not yet cut as a fleet
# reusable and is not yet in canary-rings.json (see README). Promote once a
# dedicated advisory workflow + release are added.
status: draft

owner: petry-projects/org-leads

# --- How humans address this persona (§4.1) --------------------------------
# An org TEAM handle, never a user account: '@qa-lead' is a real, live GitHub
# account owned by a stranger, so keying on the bare role would silently
# notify them on every mention. The team slug equals `id`, so the router
# resolves a mention by stripping the org prefix.
#
# Team requirements (verified by CI, not by the schema — they need the network):
#   privacy: closed                               (secret teams are unmentionable)
#   notification_setting: notifications_disabled  (routes a webhook, not a page)
address:
  handle: petry-projects/qa-lead

definition:
  layers:
    # A vendored BMAD Test Architecture agent, consumed by path (vendor-neutral
    # markdown). We track upstream and contribute back rather than fork — so
    # there are no local hand-edits to frameworks/.
    - kind: framework-agent
      path: frameworks/bmad-test-architecture/src/agents/bmad-tea
      framework:
        name: bmad-test-architecture
        upstream_repo: bmad-code-org/bmad-method-test-architecture-enterprise
        vendor_pin: v1.19.0            # matches frameworks/bmad-test-architecture/VENDOR.md
        skill: bmad-tea
      # No local_overrides today. When qa-lead gains an org-specific advisory
      # wrapper (like prompts/bmad/scrum-master.md does for the Scrum Master
      # role), add it here and set upstream_candidate honestly.

skills:
  - name: bmad-testarch-test-design
    path: frameworks/bmad-test-architecture/src/agents/bmad-tea/SKILL.md
    source: vendored
  - name: bmad-testarch-test-review
    path: frameworks/bmad-test-architecture/src/workflows/testarch/bmad-testarch-test-review/SKILL.md
    source: vendored
  - name: bmad-testarch-ci
    path: frameworks/bmad-test-architecture/src/workflows/testarch/bmad-testarch-ci/SKILL.md
    source: vendored
  - name: bmad-testarch-nfr
    path: frameworks/bmad-test-architecture/src/workflows/testarch/bmad-testarch-nfr/SKILL.md
    source: vendored
  - name: bmad-testarch-trace
    path: frameworks/bmad-test-architecture/src/workflows/testarch/bmad-testarch-trace/SKILL.md
    source: vendored

# qa-lead is a quality ADVISOR — advisory on every surface, write nowhere.
# (Test authoring, a future `write` opt-in, would add its own gate_label.)
triggers:
  default_mode: advisory
  opt_out_label: qa-lead:hands-off
  surfaces:
    - surface: pull_request
      events: [opened, ready_for_review, synchronize]
      enabled: true
      mode: advisory
      notes: "Risk assessment + test-coverage review comments on PRs with test surface."

    - surface: pull_request_review
      events: [submitted, created]
      enabled: true
      mode: advisory
      notes: "Weighs in on review threads about test quality / flakiness."

    - surface: issues
      events: [labeled, commented]
      enabled: true
      mode: advisory
      notes: "Test-design and NFR strategy input on issues/epics."

    - surface: discussion
      events: [labeled, commented]
      enabled: true
      mode: advisory
      bridge: repository_dispatch
      notes: "Discussions can't run the agent inline — must bridge (issue #571)."

    - surface: mention
      events: [created]
      enabled: true
      mode: advisory
      notes: "Direct invocation: '@petry-projects/qa-lead design tests for this epic'."

    - surface: check_run
      events: [completed]
      enabled: true
      mode: advisory
      notes: "On CI failure, flags flakiness / weak coverage as test tech-debt (advisory only)."

    - surface: schedule
      events: []
      enabled: false
      mode: advisory
      notes: "Future: periodic test-health / flakiness sweep."

trust:
  author_association_floor: [OWNER, MEMBER, COLLABORATOR]

# No `runtime:` block yet — qa-lead ships no dedicated reusable/stub in this
# pilot. It is consumed by path (e.g. by the initiative-planner during
# planning) and is human-invocable. Add `runtime` + a canary-rings.json entry
# when a dedicated advisory workflow is wired.

evals:
  required_before: stable
  path: evals/qa-lead/    # under the repo eval tree so validate-cases.py + holdout-guard.yml cover it
  judge: evals/judge.md
  min_cases: 5            # seed cases are placeholders; reach 5 held-out before stable

canary:
  registry: petry-projects/.github/standards/canary-rings.json
  agent: qa-lead         # entry added at first release cut (not present while status: draft)

references:
  - "frameworks/bmad-test-architecture/VENDOR.md"
  - "prompts/bmad/scrum-master.md (qa-lead consulted during planning)"
  - "petry-projects/.github standards/persona-standards.md"
