name: Agent Ingress
# FIXTURE (ADR-0010) — the dev-lead job's caller-side group is role-prefixed and
# does NOT reuse any group its pinned reusable declares. The guard must PASS.
on:
  pull_request:
    types: [opened]

permissions: {}

jobs:
  dev-lead:
    if: github.event_name == 'pull_request'
    concurrency:
      group: "dev-lead-ingress-pr-${{ github.event.pull_request.number }}"
      cancel-in-progress: false
    uses: petry-projects/.github-private/.github/workflows/dev-lead-reusable.yml@dev-lead/v1-test
    with:
      agent_ref: dev-lead/v1-test
    permissions:
      contents: write
