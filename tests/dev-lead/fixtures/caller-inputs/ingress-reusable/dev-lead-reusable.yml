name: Fixture Reusable — dev-lead
# Declares the dev-lead ingress job's inputs: an optional agent_ref and a
# required mode. Secrets are intentionally NOT inputs.
on:
  workflow_call:
    inputs:
      agent_ref:
        description: "Optional pinned ref"
        type: string
        required: false
        default: ""
      mode:
        description: "Required run mode"
        type: string
        required: true
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

permissions: {}

jobs:
  noop:
    runs-on: ubuntu-latest
    steps:
      - run: echo "fixture dev-lead"
