name: Agent Ingress
# FIXTURE — a multi-job ingress where ONE job has drifted: the pr-review-mention
# job forwards `bogus_input`, which its pinned reusable does NOT declare (the
# #1034 channel-skew class, now per-surface). The dev-lead job stays valid. The
# guard must FAIL loud and name the drifted input, catching a single drifted job
# in an otherwise-valid ingress.
on:
  pull_request:
    types: [opened, reopened, synchronize, review_requested]
  issue_comment:
    types: [created]

permissions: {}

jobs:
  dev-lead:
    if: github.event_name != 'issue_comment'
    uses: petry-projects/.github-private/.github/workflows/dev-lead-reusable.yml@dev-lead/v1-test
    with:
      agent_ref: dev-lead/v1-test
      mode: apply
    secrets: inherit
    permissions:
      contents: write

  pr-review-mention:
    if: github.event.action == 'review_requested'
    permissions:
      pull-requests: write
    uses: petry-projects/.github/.github/workflows/pr-review-mention-reusable.yml@pr-review-mention/v1-test
    with:
      agent_ref: pr-review-mention/v1-test
      bogus_input: "true"
    secrets:
      GH_PAT_WORKFLOWS: ${{ secrets.GH_PAT_DON_PETRY }}
