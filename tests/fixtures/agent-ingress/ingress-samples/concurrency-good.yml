name: Agent Ingress
# FIXTURE (ADR-0010) — every job-level concurrency: block is bounded: the group
# reads only the event-payload surface a job-level if: may read, every group
# literal carries the job's role name as a prefix, and cancel-in-progress is a
# literal boolean. The ingress guard must PASS.
on:
  pull_request:
    types: [opened, reopened, synchronize]
  pull_request_review:
    types: [submitted]
  check_run:
    types: [completed]

permissions: {}

jobs:
  # Literal role prefix ahead of the expression.
  ci-failure-analyst:
    if: github.event_name == 'check_run' && github.event.check_run.conclusion == 'failure'
    concurrency:
      group: "ci-failure-analyst-${{ github.event.check_run.head_sha }}"
      cancel-in-progress: false
    uses: petry-projects/.github-private/.github/workflows/ci-failure-analyst-reusable.yml@ci-failure-analyst/v1-stable
    permissions:
      checks: read

  # Whole-expression group: the role prefix rides in each result-position
  # format() template; the 'pull_request' comparison operands are not group names.
  pr-auto-review:
    if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review'
    concurrency:
      group: >-
        ${{
        (github.event_name == 'pull_request' && format('pr-auto-review-ready-check-pr-{0}', github.event.pull_request.number))
        || format('pr-auto-review-ready-check-review-{0}', github.event.pull_request.number)
        }}
      cancel-in-progress: true
    uses: petry-projects/.github/.github/workflows/pr-auto-review-reusable.yml@pr-auto-review/v1-stable
    permissions:
      pull-requests: read
