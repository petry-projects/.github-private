schema_version: 1
role: alpha
kind: persona
workflows:
  - .github/workflows/alpha.yml
interaction:
  triggers:
    events:
      - issue_comment
      - pull_request
    timers:
  emits:
    - "comment:<!-- alpha done -->"
  idempotency_key: "pull_request number, else issue number"
  concurrency_lane: "alpha-pr-<pr>"
  stop_markers:
    - alpha:hands-off
    - needs-human-review
    - dev-lead:needs-human
  budget: none
