schema_version: 1
role: alpha
kind: runtime
workflows:
  - .github/workflows/alpha.yml
interaction:
  triggers:
    events:
      - issue_comment
      - pull_request
    timers:
  emits:
    - "comment:<!-- alpha done -->"
  concurrency_lane: "alpha-pr-<pr>"
  stop_markers:
    - alpha:hands-off
  budget: none
