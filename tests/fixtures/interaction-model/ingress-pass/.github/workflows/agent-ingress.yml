name: Agent Ingress
# FIXTURE — a collapsed multi-role agent-ingress.yml (ADR-0007, epic #1723).
# One shared on: union (no schedule), one job per collapsed Class-1 role. The
# §4 table must carry ONE row per role-job (dev-lead, pr-review-mention), each
# classified against this same shared on: block.
on:
  pull_request:
    types: [opened, reopened, synchronize, review_requested]
  issue_comment:
    types: [created]

permissions: {}

jobs:
  dev-lead:
    if: >-
      github.event_name == 'pull_request' || github.event_name == 'issue_comment'
    uses: petry-projects/.github-private/.github/workflows/dev-lead-reusable.yml@dev-lead/v1-stable
    secrets: inherit

  pr-review-mention:
    if: >-
      (github.event_name == 'pull_request' && github.event.action == 'review_requested')
      || github.event_name == 'issue_comment'
    uses: petry-projects/.github/.github/workflows/pr-review-mention-reusable.yml@pr-review-mention/v2-stable
    secrets: inherit
