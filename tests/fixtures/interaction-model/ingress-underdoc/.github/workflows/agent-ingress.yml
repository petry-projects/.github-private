name: Agent Ingress
# FIXTURE — an UNDER-DOCUMENTED ingress: two role-jobs (dev-lead,
# pr-review-mention) but the §4 table declares only one. Completeness must FAIL
# (a job with no classification row), proving the check cannot pass an
# under-documented ingress (QA AC #6 / backward-compat proven by failure).
on:
  pull_request:
    types: [opened, reopened, synchronize, review_requested]
  issue_comment:
    types: [created]

permissions: {}

jobs:
  dev-lead:
    if: github.event_name == 'pull_request'
    uses: petry-projects/.github-private/.github/workflows/dev-lead-reusable.yml@dev-lead/v1-stable
    secrets: inherit

  pr-review-mention:
    if: github.event_name == 'issue_comment'
    uses: petry-projects/.github/.github/workflows/pr-review-mention-reusable.yml@pr-review-mention/v2-stable
    secrets: inherit
