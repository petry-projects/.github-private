name: PR Review Agent — Stuck-Review Sweep

# Repo-specific scheduled remediator for the event-driven re-trigger gap (#573).
#
# The pr-review cascade SKIPS PRs whose CI is pending/failing and waits for a
# later `check_suite:completed` to re-evaluate them. When CI settles green AFTER
# the last trigger fired (common while dev-lead is pushing fixes), no event
# re-fires and the PR sits at REVIEW_REQUIRED with green CI, never re-reviewed.
#
# This sweep periodically enumerates open PRs and re-dispatches a review for any
# that are REVIEW_REQUIRED + CI green + not already reviewed at head. The heavy
# lifting (CI gating, idempotency) still lives in review-one-pr.sh; the sweep
# only decides WHAT to re-trigger via pr-review-trigger.yml.
#
# Latency (#898): the scheduled sweep is the GUARANTEED backstop (≤15 min). On
# top of it, a `workflow_run: completed` trigger gives a near-instant fast path —
# when a core CI workflow finishes, the sweep runs SCOPED to just that run's PR(s)
# (scripts/sweep-stuck-reviews.sh derives them from the event payload), so a PR
# that just went green is re-reviewed in seconds instead of waiting for the next
# cron tick. The fast path can never strand a PR: if it matches nothing (fork PR,
# push to a branch, or CI still pending) the scheduled sweep still catches it.
#
# NOTE: the re-dispatch runs as GH_PAT_WORKFLOWS (a PAT with workflow /
# actions:write scope), NOT the default GITHUB_TOKEN — GitHub will not start a
# new run from a workflow_dispatch fired with GITHUB_TOKEN (loop prevention).
# It also must NOT use DON_PETRY_BOT_GH_PAT (the bot's comment-posting PAT lacks
# actions:write and returns HTTP 403 on the dispatch). This matches every other
# dispatching workflow in the repo (initiative-planner.yml, auto-rebase-retry.yml,
# scripts/initiative-planner/redispatch.sh). See scripts/sweep-stuck-reviews.sh.
#
# This workflow has no corresponding org template in standards/workflows/ and is
# documented as a repo-specific exception in AGENTS.md; template syncs must not
# remove it.

on:
  schedule:
    # Every 15 min (offset to avoid contending with other crons) — the guaranteed
    # backstop bounding worst-case re-review latency when the fast path misses.
    - cron: '2,17,32,47 * * * *'
  workflow_run:
    # Event-driven fast path (#898): a core CI workflow finishing is the signal
    # that a PR may have just gone green. The sweep run is scoped to that PR by the
    # script, so firing on several workflows is cheap and idempotent — and the
    # per-branch `cancel-in-progress` concurrency below collapses the burst so the
    # sweep effectively runs ONCE, after the last-finishing keyed workflow (the one
    # most likely to observe green). Keyed on broadly-run, stable workflow names
    # (must match each workflow's `name:`); the scheduled sweep backstops any
    # rename/miss, so this list is best-effort, not load-bearing.
    workflows: ["CI", "Tests", "Holdout Guard", "SonarCloud Analysis", "Lint"]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "If true, log selections but do not dispatch reviews"
        required: false
        default: "false"
        type: string
      max_dispatch:
        description: "Cap on review dispatches this sweep"
        required: false
        default: "20"
        type: string

permissions:
  contents: read

concurrency:
  # Per-trigger/branch grouping so an event-driven sweep for one branch never
  # cancels the scheduled full sweep (or another branch's sweep); cancel-in-progress
  # still collapses a burst of CI completions on the SAME branch into one run.
  group: pr-review-sweep-${{ github.event.workflow_run.head_branch || github.event_name }}
  cancel-in-progress: true

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout agent repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Guard — workflow-dispatch PAT present
        # Without a workflow/actions:write PAT every dispatch returns HTTP 403 and
        # the sweep "succeeds" while re-triggering nothing (the original #573 gap
        # regression). Fail loudly instead of silently no-op'ing.
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_DON_PETRY || secrets.GH_PAT_WORKFLOWS }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::GH_PAT_WORKFLOWS is required — GITHUB_TOKEN cannot start a dispatched run and the bot comment PAT lacks actions:write."
            exit 1
          fi

      - name: Guard — workflow-dispatch PAT present
        # Without a workflow/actions:write PAT every dispatch returns HTTP 403 and
        # the sweep "succeeds" while re-triggering nothing (the original #573 gap
        # regression). Fail loudly instead of silently no-op'ing.
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_DON_PETRY || secrets.GH_PAT_WORKFLOWS }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::GH_PAT_WORKFLOWS is required — GITHUB_TOKEN cannot start a dispatched run and the bot comment PAT lacks actions:write."
            exit 1
          fi

      - name: Guard — workflow-dispatch PAT present
        # Without a workflow/actions:write PAT every dispatch returns HTTP 403 and
        # the sweep "succeeds" while re-triggering nothing (the original #573 gap
        # regression). Fail loudly instead of silently no-op'ing.
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_DON_PETRY || secrets.GH_PAT_WORKFLOWS }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::GH_PAT_WORKFLOWS is required — GITHUB_TOKEN cannot start a dispatched run and the bot comment PAT lacks actions:write."
            exit 1
          fi

      - name: Run stuck-review sweep
        env:
          # PAT with workflow/actions:write scope required: GITHUB_TOKEN cannot
          # start dispatched workflow runs, and the bot comment PAT lacks the
          # actions:write scope (HTTP 403 on the dispatch).
          GH_TOKEN: ${{ secrets.GH_PAT_DON_PETRY || secrets.GH_PAT_WORKFLOWS }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          MAX_DISPATCH: ${{ inputs.max_dispatch || '20' }}
        run: bash scripts/sweep-stuck-reviews.sh
