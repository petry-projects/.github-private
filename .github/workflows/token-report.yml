# ─────────────────────────────────────────────────────────────────────────────
# SOURCE OF TRUTH: petry-projects/.github-private/.github/workflows/token-report.yml
#
# AGENTS — READ BEFORE EDITING:
#   • Weekly Token Cost Observatory report. The org-wide collection + aggregation
#     logic lives in scripts/token_report.sh (unit-tested in tests/token_report.bats).
#   • The script reads token-usage artifacts from EVERY non-archived repo in the org,
#     so it needs GH_PAT_WORKFLOWS (cross-org actions:read) — github.token cannot read
#     other repos' artifacts.
#   • The report is posted as a comment on a single pinned tracking issue
#     (label: token-report) in .github-private, so github.token suffices for the
#     comment step.
#   • Do NOT change checkout ref from 'main'.
# ─────────────────────────────────────────────────────────────────────────────
name: Token Cost Report
# readme-report: LLM token-cost report (per workflow-run summary) for maintainers.

on:
  schedule:
    # Mondays at 08:34 UTC — weekly cost rollup before the work week
    - cron: '34 8 * * 1'
  workflow_dispatch:
    inputs:
      org:
        description: "GitHub org to scan"
        required: false
        default: "petry-projects"
        type: string
      lookback_days:
        description: "Days of token-usage history to include"
        required: false
        default: "7"
        type: string
      run_canary:
        description: "Also run the canary go/no-go report (candidate vs incumbent)"
        required: false
        default: false
        type: boolean
      canary_since:
        description: "Canary window start (ISO 8601 UTC, e.g. YYYY-MM-DDTHH:MMZ) — latency scored from here"
        required: false
        default: ""
        type: string
      candidate_model:
        description: "Candidate model ID (required when run_canary is true)"
        required: false
        default: ""
        type: string
      incumbent_model:
        description: "Incumbent model ID (required when run_canary is true)"
        required: false
        default: ""
        type: string
      baseline_days:
        description: "Baseline window length in days, ending at canary_since (blank = script default)"
        required: false
        default: ""
        type: string
      cost_bar:
        description: "Cost reduction bar as a fraction (blank = script default)"
        required: false
        default: ""
        type: string
      cache_bar:
        description: "Cache-read cost reduction bar as a fraction (blank = script default)"
        required: false
        default: ""
        type: string
      latency_bar:
        description: "Latency improvement bar as a fraction (blank = script default)"
        required: false
        default: ""
        type: string
      min_prs:
        description: "Minimum distinct candidate PRs (blank = script default)"
        required: false
        default: ""
        type: string
      min_invocations:
        description: "Minimum invocations per arm (blank = script default)"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: token-report-${{ inputs.org || 'petry-projects' }}
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    # 60m (was 30m, #954) is a safety margin; the real fix is the bounded-parallel,
    # per-download-timeout collection in scripts/token_report.sh.
    timeout-minutes: 60
    env:
      ORG: ${{ inputs.org || 'petry-projects' }}
      LOOKBACK_DAYS: ${{ inputs.lookback_days || '7' }}

    steps:
      - name: Checkout agent repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: petry-projects/.github-private
          ref: main
          token: ${{ secrets.GH_PAT_DON_PETRY || secrets.GH_PAT_WORKFLOWS }}

      - name: Generate org-wide token report
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_DON_PETRY || secrets.GH_PAT_WORKFLOWS }}
          TOKEN_REPORT_OUT: token_report.md
        run: |
          bash scripts/token_report.sh >> "$GITHUB_STEP_SUMMARY"

      - name: Post report to tracking issue
        # Only on a successful generation that actually wrote the report file.
        if: ${{ success() && hashFiles('token_report.md') != '' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const MAX = 65000;
            let report = fs.readFileSync('token_report.md', 'utf8');
            if (!report.trim()) { core.setFailed('Report file is empty'); return; }

            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            if (report.length > MAX) {
              report = report.slice(0, MAX) +
                `\n\n---\n_Report truncated — full output in the [workflow run summary](${runUrl})._`;
            }

            const LABEL = 'token-report';
            const TITLE = '📊 Token Cost Observatory — Weekly Report';

            // Ensure the tracking label exists.
            try {
              await github.rest.issues.getLabel({ owner: context.repo.owner, repo: context.repo.repo, name: LABEL });
            } catch (e) {
              await github.rest.issues.createLabel({
                owner: context.repo.owner, repo: context.repo.repo,
                name: LABEL, color: '5319e7',
                description: 'Weekly Token Cost Observatory report',
              });
            }

            // Find-or-create the single pinned tracking issue.
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo,
              labels: LABEL, state: 'open', per_page: 100,
            });

            let issue = existing.find(i => i.title === TITLE);
            if (!issue) {
              const created = await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: TITLE, labels: [LABEL],
                body: 'Tracking issue for the weekly Token Cost Observatory report. ' +
                      'Each run posts a new comment below with org-wide Effective Tokens (ET) usage.\n\n' +
                      'Source: `scripts/token_report.sh` · `.github/workflows/token-report.yml`',
              });
              issue = created.data;
              core.notice(`Created tracking issue #${issue.number}: ${issue.html_url}`);
            }

            const comment = await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: issue.number, body: report,
            });
            core.notice(`Posted weekly token report: ${comment.data.html_url}`);

      - name: Alert tracking issue on failed/timed-out generation
        # Fail loudly (#954): a timed-out (job-cancelled) or failed report run used to
        # silently skip the post step, leaving a quiet gap in the tracking issue.
        # Post a visible alert instead so a regression is noticed.
        if: ${{ failure() || cancelled() }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const LABEL = 'token-report';
            const TITLE = '📊 Token Cost Observatory — Weekly Report';

            // Locate the existing tracking issue — don't create one just to alert.
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo,
              labels: LABEL, state: 'open', per_page: 100,
            });
            const issue = existing.find(i => i.title === TITLE);
            if (!issue) {
              core.warning(`Token report generation failed and no tracking issue was found to alert. Run: ${runUrl}`);
              return;
            }

            const body = [
              '⚠️ **Token Cost Observatory — report generation failed.**',
              '',
              'This weekly run did not produce a report (collection timed out or the job failed), ' +
              'so no fresh report was posted. ' +
              `See the [workflow run](${runUrl}) for details.`,
              '',
              '_Posted automatically so a failed run is visible rather than a silent gap (#954)._',
            ].join('\n');

            const comment = await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: issue.number, body,
            });
            core.notice(`Posted token report failure alert: ${comment.data.html_url}`);

  # Canary go/no-go — only on an explicit workflow_dispatch that opts in. Scores
  # the candidate model against the incumbent over the canary window and writes a
  # mechanical PASS/FAIL/INSUFFICIENT table to the run summary. Logic + defaults
  # live in scripts/canary_report.sh (unit-tested in tests/canary_report.bats).
  canary:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_canary }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout agent repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: petry-projects/.github-private
          ref: main
          token: ${{ secrets.GH_PAT_DON_PETRY || secrets.GH_PAT_WORKFLOWS }}

      - name: Generate canary go/no-go report
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_DON_PETRY || secrets.GH_PAT_WORKFLOWS }}
          CANARY_SINCE_INPUT: ${{ inputs.canary_since }}
          CANDIDATE_MODEL_INPUT: ${{ inputs.candidate_model }}
          INCUMBENT_MODEL_INPUT: ${{ inputs.incumbent_model }}
          BASELINE_DAYS_INPUT: ${{ inputs.baseline_days }}
          COST_BAR_INPUT: ${{ inputs.cost_bar }}
          CACHE_BAR_INPUT: ${{ inputs.cache_bar }}
          LATENCY_BAR_INPUT: ${{ inputs.latency_bar }}
          MIN_PRS_INPUT: ${{ inputs.min_prs }}
          MIN_INVOCATIONS_INPUT: ${{ inputs.min_invocations }}
        run: |
          if [ -z "$CANDIDATE_MODEL_INPUT" ] || [ -z "$INCUMBENT_MODEL_INPUT" ]; then
            echo "run_canary requires both candidate_model and incumbent_model inputs." >&2
            exit 64
          fi
          args=(--candidate "$CANDIDATE_MODEL_INPUT" --incumbent "$INCUMBENT_MODEL_INPUT")
          [ -n "$CANARY_SINCE_INPUT" ] && args+=(--since "$CANARY_SINCE_INPUT")
          [ -n "$BASELINE_DAYS_INPUT" ] && args+=(--baseline-days "$BASELINE_DAYS_INPUT")
          [ -n "$COST_BAR_INPUT" ] && args+=(--cost-bar "$COST_BAR_INPUT")
          [ -n "$CACHE_BAR_INPUT" ] && args+=(--cache-bar "$CACHE_BAR_INPUT")
          [ -n "$LATENCY_BAR_INPUT" ] && args+=(--latency-bar "$LATENCY_BAR_INPUT")
          [ -n "$MIN_PRS_INPUT" ] && args+=(--min-prs "$MIN_PRS_INPUT")
          [ -n "$MIN_INVOCATIONS_INPUT" ] && args+=(--min-invocations "$MIN_INVOCATIONS_INPUT")
          # Exit 1 (FAIL) / 2 (INSUFFICIENT) are valid go/no-go verdicts, not step
          # failures — the rendered table already carries the signal. Any OTHER
          # non-zero exit (bad args, missing tool, failed artifact collection) is a
          # real error and must fail the step rather than be masked by `|| true`.
          rc=0
          bash scripts/canary_report.sh "${args[@]}" >> "$GITHUB_STEP_SUMMARY" || rc=$?
          if [ "$rc" -gt 2 ]; then
            echo "canary_report.sh failed with exit ${rc}." >&2
            exit "$rc"
          fi
