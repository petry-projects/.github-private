name: Release Notes Generator

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      before_sha:
        description: "Base commit SHA to compare against (default: HEAD^)"
        required: false
        type: string
      dry_run:
        description: "If true, generate content but do not open a PR"
        required: false
        default: "true"
        type: string

# Staged: read-only permissions until DRY_RUN=false is set and permissions are updated.
# Live mode requires: contents: write, pull-requests: write
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release-notes-${{ github.sha }}
  cancel-in-progress: false

jobs:
  release-notes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.DON_PETRY_BOT_GH_PAT }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_SHA: ${{ github.sha }}
      BEFORE_SHA: ${{ inputs.before_sha || github.event.before || '' }}
      CHANGELOG_FILE: ${{ vars.CHANGELOG_FILE || 'CHANGELOG.md' }}
      CHANGELOG_LABELS: ${{ vars.CHANGELOG_LABELS || 'feat,fix' }}
      # Staged by default: set LIVE_MODE=true repo variable to enable PR creation.
      # LIVE_MODE is the authoritative gate — dispatch input cannot bypass it.
      DRY_RUN: ${{ vars.LIVE_MODE == 'true' && 'false' || 'true' }}
      REVIEW_ENGINE: ${{ vars.REVIEW_ENGINE || 'claude' }}
      ACTION_TIMEOUT_SEC: ${{ vars.ACTION_TIMEOUT_SEC || '120' }}
      CLAUDE_CODE_VERSION: ${{ vars.CLAUDE_CODE_VERSION || '2.1.138' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          token: ${{ secrets.DON_PETRY_BOT_GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Cache claude-code CLI
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.npm-global
          key: claude-code-${{ env.CLAUDE_CODE_VERSION }}-${{ runner.os }}

      - name: Install claude-code CLI
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.npm-global"
          npm config set prefix "$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.npm-global/bin:$PATH"
          if ! command -v claude >/dev/null 2>&1; then
            npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          fi

      - name: Configure git identity
        if: env.DRY_RUN != 'true'
        run: |
          git config --global user.email "donpetry-bot@users.noreply.github.com"
          git config --global user.name "donpetry-bot"

      - name: Generate release notes
        run: bash scripts/release-notes.sh
