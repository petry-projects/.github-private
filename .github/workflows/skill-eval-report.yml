name: Skill Eval Report
# readme-report: Skill-eval results report — agent skill pass/fail trends (self-improving-skills pipeline).

# Phase 1 of the self-improving-skills pipeline (epic #581, story #584).
#
# Runs the deterministic eval scorer (scripts/evals/run-eval.sh) against a
# skill's HELD-OUT set on a cron schedule (and on demand) and publishes a
# NON-BLOCKING score report. This makes skill quality continuously visible
# WITHOUT gating any merge — a regression never fails this workflow and never
# blocks a PR.
#
# Why model-backed eval lives here and NOT on pull_request: each case is a real
# model invocation (run_triage, Haiku-tier) that costs tokens, so the live eval
# is reserved for the scheduled/dispatch path. PR-time coverage is the offline
# bats tests (tests/test_skill_evals.bats), which drive the scorer against a
# stub engine with no network — see story #583.
#
# Class: org-private-automation (like initiative-driver.yml), not a thin caller
# stub. Modeled on daily-pr-review-health.yml (the closest scheduled health
# report). Third-party actions are SHA-pinned per AGENTS.md.

on:
  schedule:
    # Daily at 07:51 UTC — offset from daily-pr-review-health (06:13) so the two
    # scheduled health reports do not contend for the same runner window. This
    # cron scores the Haiku-tier `triage` holdout ONLY (see the `discover` job):
    # cheap, unattended, and unchanged by #1702.
    - cron: '51 7 * * *'
    # Weekly persona-parity tripwire (#1702) — Sunday 09:23 UTC. Off-peak and
    # distinct from the daily 07:51 run and from apply-repo-settings (Mon 06:17),
    # so the schedules do not contend (AGENTS.md "Scheduled workflows"). This
    # cron scores every skill whose evals/<skill>/scorer.json declares
    # `"engine": "persona"` — DISCOVERED, not hardcoded — at the parity tier.
    - cron: '23 9 * * 0'
  workflow_dispatch:
    inputs:
      skill:
        description: "Skill whose held-out eval set to score (evals/<skill>/holdout)"
        required: false
        default: "triage"
        type: string

# Least-privilege: reset the default write-all grant to nothing at the top
# level; each job re-grants only the scope it needs.
permissions: {}

jobs:
  # Resolve the matrix of skills to score for THIS trigger (AC #3). The weekly
  # persona-parity cron discovers the parity set from scorer.json; every other
  # trigger (the daily triage cron and manual dispatch) scores exactly one skill
  # — the dispatched `skill` input, or `triage` by default — so the daily path
  # is behaviourally unchanged (AC #2).
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: read  # actions/checkout
    outputs:
      skills: ${{ steps.pick.outputs.skills }}
    steps:
      - name: Checkout agent repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve skill matrix
        id: pick
        env:
          # inputs.skill is set only on workflow_dispatch; 'triage' otherwise.
          SKILL_DEFAULT: ${{ inputs.skill || 'triage' }}
        run: |
          set -o pipefail
          if [ "${{ github.event.schedule }}" = '23 9 * * 0' ]; then
            # Weekly parity cadence: derive the persona set from scorer.json.
            skills="$(bash scripts/evals/discover-parity-skills.sh)"
          else
            # Daily cron / dispatch: a single skill, JSON-encoded for the matrix.
            skills="$(jq -cn --arg s "$SKILL_DEFAULT" '[$s]')"
          fi
          echo "skills=$skills" >> "$GITHUB_OUTPUT"
          echo "resolved skill matrix: $skills"

  eval-report:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 20  # per-job: with the matrix this applies per skill
    strategy:
      # One skill's infra error or regression must NOT abort scoring of the
      # others — each skill is an independent report row (AC #5, #1702 hazard 2).
      fail-fast: false
      matrix:
        skill: ${{ fromJson(needs.discover.outputs.skills) }}
    # Key the concurrency group by event AND skill so the daily triage run and
    # the weekly per-skill runs never cancel each other, and matrix siblings do
    # not cancel themselves (#1702 hazard 1; AC #2). Job-level because the group
    # references matrix.skill, which is unavailable at workflow level.
    concurrency:
      group: skill-eval-report-${{ github.event_name }}-${{ matrix.skill }}
      cancel-in-progress: true
    permissions:
      contents: read  # actions/checkout
      issues: write   # notify step opens/updates/closes the single eval-health tracking issue (#747)
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      SKILL: ${{ matrix.skill }}
      # Pin via vars.CLAUDE_CODE_VERSION for reproducible caching; default
      # 'latest' caches an install indefinitely — flush via the Actions cache
      # UI or bump the variable to pick up new releases. Mirrors pr-review.yml.
      CLAUDE_CODE_VERSION: ${{ vars.CLAUDE_CODE_VERSION || 'latest' }}

    steps:
      - name: Checkout agent repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '20'

      - name: Cache claude-code CLI
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.npm-global
          key: claude-code-${{ env.CLAUDE_CODE_VERSION }}-${{ runner.os }}

      - name: Install Claude Code CLI
        run: |
          mkdir -p "$HOME/.npm-global"
          npm config set prefix "$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.npm-global/bin:$PATH"
          if command -v claude >/dev/null 2>&1; then
            echo "claude-code cache hit: $(claude --version)"
          else
            npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}" # NOSONAR — install scripts required for native binary setup; version intentionally uses CLAUDE_CODE_VERSION var (same pattern as pr-review.yml)
          fi

      - name: Run eval scorer (report-only, non-blocking)
        id: eval
        # NON-BLOCKING is the entire point of Phase 1: the scorer exits 1 when a
        # held-out case regresses. continue-on-error keeps that regression from
        # failing the workflow or gating any merge — it is a report, not a gate.
        continue-on-error: true
        run: |
          set -o pipefail
          status=0
          bash scripts/evals/run-eval.sh "$SKILL" > eval-report.json || status=$?
          {
            echo "status=$status"
            if [ "$status" -eq 0 ]; then
              echo "outcome=pass"
            elif [ "$status" -eq 1 ]; then
              echo "outcome=regression"   # at least one held-out case failed — reported, NOT fatal
            else
              echo "outcome=error"        # hard error (bad usage / missing tooling)
            fi
          } >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Score promotion gate verdict (report-only)
        id: gate
        # Give the scored promotion gate (scripts/evals/score-gate.sh, #1630) a
        # real repository caller: it consumes the artifact this workflow just
        # produced (`--report eval-report.json`) — the "CI scores once, gate on
        # the artifact" path the gate was built for — and emits the machine-
        # readable {role,score,threshold,verdict} against the role's documented
        # threshold. Report-only here (continue-on-error), consistent with this
        # workflow's Phase-1 non-blocking contract; the HARD promotion bar
        # (draft -> stable) is enforced at release-cut time, not on this cron.
        if: always() && hashFiles('eval-report.json') != ''
        continue-on-error: true
        run: |
          set -o pipefail
          gate_status=0
          bash scripts/evals/score-gate.sh "$SKILL" --report eval-report.json > gate-verdict.json || gate_status=$?
          echo "status=$gate_status" >> "$GITHUB_OUTPUT"

      - name: Render report to step summary
        if: always() && hashFiles('eval-report.json') != ''
        run: |
          {
            echo "## Skill Eval Report — \`${SKILL}\` (holdout)"
            echo ""
            echo "_Report-only (Phase 1): a regression does not fail CI or block any merge._"
            echo ""
            if jq -e . eval-report.json >/dev/null 2>&1; then
              score=$(jq -r '.score'  eval-report.json)
              passed=$(jq -r '.passed' eval-report.json)
              total=$(jq -r '.total'  eval-report.json)
              failed=$(jq -r '.failed' eval-report.json)
              # Record WHICH tier scored this skill so a number is never
              # ambiguous about what produced it (#1702 AC #6, #1686 AC #1).
              tier=$(jq -r '.engine_tier // "triage"' eval-report.json)
              model=$(jq -r '.engine_model_observed // .engine_model // "unknown"' eval-report.json)
              echo "| skill | tier | model | score | passed | failed | total |"
              echo "|-------|------|-------|-------|--------|--------|-------|"
              echo "| \`${SKILL}\` | \`${tier}\` | \`${model}\` | ${score} | ${passed} | ${failed} | ${total} |"
              if [ "${failed}" != "0" ]; then
                echo ""
                echo "### Regressed cases"
                jq -r '.cases[] | select(.pass | not) | "- `\(.id)` — expected \(.expected|tojson), got \(.actual|tojson)"' eval-report.json
              fi
              if [ -f gate-verdict.json ] && jq -e . gate-verdict.json >/dev/null 2>&1; then
                echo ""
                echo "### Promotion gate verdict (informational)"
                verdict=$(jq -r '.verdict'   gate-verdict.json)
                threshold=$(jq -r '.threshold' gate-verdict.json)
                echo "- \`${SKILL}\`: **${verdict}** (score ${score} vs threshold ${threshold})"
              fi
            else
              echo "Scorer produced no parseable JSON report (outcome: ${{ steps.eval.outputs.outcome }})."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload eval report artifact
        if: always() && hashFiles('eval-report.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: skill-eval-report-${{ env.SKILL }}
          path: eval-report.json
          if-no-files-found: warn

      - name: Annotate outcome
        if: always()
        run: |
          case "${{ steps.eval.outputs.outcome }}" in
            pass)       echo "::notice::Skill eval '${SKILL}': all held-out cases passed." ;;
            regression) echo "::warning::Skill eval '${SKILL}': held-out regression detected (report-only — not blocking)." ;;
            *)          echo "::warning::Skill eval '${SKILL}': scorer hard-errored (report-only — not blocking)." ;;
          esac

      - name: Notify eval health (open/update/close tracking issue)
        # Visibility, not gating (#747): on regression/error open-or-update a
        # single de-duplicated eval-health tracking issue; on a pass that follows
        # a prior open issue, comment + close it; a healthy run with no open
        # issue makes zero noise. Runs always() so a recovery still closes the
        # issue even though the eval step exits 0.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.eval.outputs.outcome }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/evals/notify-eval-health.sh
