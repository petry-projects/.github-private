# ─────────────────────────────────────────────────────────────────────────────
# Initiative Planner — BMAD Scrum Master (Bob)
#
# Turns ONE curated & approved idea (an Ideas Discussion) into a well-defined
# initiative: a GitHub epic + a sub-issue DAG (native sub-issues + blocked_by),
# each story prepared to dev-lead's "ready" bar. The epic is created INERT
# (labelled `initiative`, NOT `initiative:auto`). A maintainer reviews the real
# epic/DAG and adds `initiative:auto` to hand it to initiative-driver.yml for
# auto-implementation.
#
# Pipeline position:
#   feature-ideation (Discussions) -> idea-triage (shortlist) -> ★ human approves
#   -> THIS (epic + story DAG, inert) -> ★ human adds initiative:auto
#   -> initiative-driver -> dev-lead
#
# This is org-private automation (like initiative-driver.yml), not a thin caller.
# All tooling + the vendored Bob persona live in this repo and are unit-tested
# (scripts/initiative-planner/, prompts/bmad/scrum-master.md).
# ─────────────────────────────────────────────────────────────────────────────
name: Initiative Planner (BMAD Scrum Master)
# readme-agent: Initiative planner (BMAD Scrum Master) — breaks an approved initiative into an epic + sub-issues.

on:
  workflow_dispatch:
    inputs:
      discussion:
        description: 'Ideas Discussion number to plan into an initiative'
        required: true
        type: string
      target_repo:
        description: 'Target repo (owner/repo) to plan FOR — read the Discussion, create the epic + DAG, post the reply there. Empty => this repo (the dogfood/self path).'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Plan only — log intended issue/DAG mutations to an artifact instead of creating them'
        required: false
        default: true
        type: boolean
      force_replan:
        description: 'Supersede an existing epic for this discussion: build the fresh DAG, then close (not delete) the old epic + stories. Off => idempotent no-op if already planned.'
        required: false
        default: false
        type: boolean
      reconcile:
        description: 'Reconcile in place (#708): bind to this discussion existing epic and ADD only newly-surfaced, accepted work as sub-issues — never rewrite in-flight stories. Mutually exclusive with force_replan.'
        required: false
        default: false
        type: boolean
      plan_artifact_run_id:
        description: 'Apply a REVIEWED plan from a prior dry-run: the run ID whose initiative-plan-dry-run artifact (plan.json) to download and apply WITHOUT re-planning. Empty => the default plan-then-apply flow (Bob plans).'
        required: false
        default: ''
        type: string
      model:
        description: 'Anthropic model id for the planner'
        required: false
        default: 'claude-opus-4-8'
        type: string
  # Approve an idea by labelling its Discussion `idea:approved`; that fires here.
  discussion:
    types: [labeled]

permissions: {}

concurrency:
  # One plan per (target repo, discussion) at a time; never cancel an in-flight
  # planning run. Keying on the target repo as well as the discussion number stops
  # two fleet repos that happen to share a discussion number from colliding.
  group: initiative-planner-${{ github.event.inputs.target_repo || github.repository }}-${{ github.event.inputs.discussion || github.event.discussion.number }}
  cancel-in-progress: false

jobs:
  # ── discussion [labeled] bridge ───────────────────────────────────────────────
  # claude-code-action aborts on `discussion` event contexts ("Unsupported event
  # type: discussion"), so we never plan inline on a discussion event. Two labels
  # fire this bridge job, which resolves the discussion number and re-invokes THIS
  # workflow via workflow_dispatch — under which the action runs:
  #   - `idea:approved`      → plan the idea (default; idempotent no-op if already planned)
  #   - `initiative:replan`  → re-plan: force_replan=true so apply-plan SUPERSEDES
  #                            the discussion's existing epic (close old, build fresh)
  #   - `initiative:reconcile` → reconcile in place (#708): reconcile=true so apply-plan
  #                            binds the existing epic and ADDS only newly-surfaced
  #                            accepted work; in-flight stories are never rewritten
  # The label stays the human gate; the re-dispatch is an invisible bridge.
  redispatch:
    if: github.event_name == 'discussion' && (github.event.label.name == 'idea:approved' || github.event.label.name == 'initiative:replan' || github.event.label.name == 'initiative:reconcile')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read  # actions/checkout; the workflow_dispatch is fired with the PAT
    steps:
      - name: Checkout agent repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Guard — PAT present
        # PAT required: a workflow_dispatch fired with GITHUB_TOKEN is accepted but
        # NEVER starts a run (loop prevention) — the planner would silently no-op.
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_DON_PETRY || secrets.GH_PAT_WORKFLOWS }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::GH_PAT_WORKFLOWS is required — a workflow_dispatch fired with GITHUB_TOKEN will not start a run."
            exit 1
          fi

      - name: Re-dispatch under workflow_dispatch
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_DON_PETRY || secrets.GH_PAT_WORKFLOWS }}
          REPO: ${{ github.repository }}
          # Dogfood path: this repo plans its own discussions, so the target is
          # self. Fleet callers (#820) live in their own repos and set their host.
          TARGET_REPO: ${{ github.repository }}
          DISCUSSION_NUMBER: ${{ github.event.discussion.number }}
          # The `initiative:replan` label supersedes an existing epic; `idea:approved`
          # uses the default idempotent plan path.
          FORCE_REPLAN: ${{ github.event.label.name == 'initiative:replan' && '1' || '0' }}
          # The `initiative:reconcile` label re-triggers the planner against the
          # existing epic to ADD newly-surfaced work in place (#708).
          RECONCILE: ${{ github.event.label.name == 'initiative:reconcile' && '1' || '0' }}
        run: bash scripts/initiative-planner/redispatch.sh

  plan:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read       # checkout, read AGENTS.md/scripts/docs
      actions: read        # gh run download — fetch a prior run's reviewed plan.json artifact
      issues: write        # create epic + story sub-issues, link DAG, set blocked_by
      discussions: write   # post the plan summary back to the idea
      id-token: write       # claude-code-action OIDC
    env:
      # This job only runs on workflow_dispatch (the discussion path re-dispatches
      # here via the `redispatch` job), so inputs are always present.
      # REPO is the TARGET repo to plan for; empty target_repo => this repo (self).
      REPO: ${{ github.event.inputs.target_repo || github.repository }}
      # Token for every WRITE to the TARGET repo (gather-context, the Bob
      # materialization, apply-reviewed-plan, and the plan reply). GITHUB_TOKEN is
      # scoped only to .github-private, so it is valid for the self path only;
      # Cross-repo runs use GH_PAT_WORKFLOWS (same pattern as actions-fleet-monitor.yml);
      # S1 (#818) will replace this with a minted GitHub App token for tighter scoping.
      # The workflow_dispatch re-invoke keeps GH_PAT_WORKFLOWS (redispatch job) — that
      # role is loop-prevention, not content writes, and is unaffected.
      TARGET_GH_TOKEN: ${{ (github.event.inputs.target_repo == '' || github.event.inputs.target_repo == github.repository) && secrets.GITHUB_TOKEN || secrets.GH_PAT_DON_PETRY || secrets.GH_PAT_WORKFLOWS }}
      DISCUSSION_NUMBER: ${{ github.event.inputs.discussion }}
      DRY_RUN: ${{ inputs.dry_run == true && '1' || '0' }}
      FORCE_REPLAN: ${{ inputs.force_replan == true && '1' || '0' }}
      # Reconcile-in-place (#708): bind the existing epic and ADD newly-surfaced
      # accepted work. gather-context harvests the epic's sub-issue comments and
      # apply-plan runs the additive reconcile path. Mutually exclusive with
      # force_replan (apply-plan.sh hard-errors if both are set).
      RECONCILE: ${{ inputs.reconcile == true && '1' || '0' }}
      # When set, the apply run loads this prior run's reviewed plan.json instead
      # of re-planning (the plan/apply split, #604). Empty => Bob plans as before.
      PLAN_ARTIFACT_RUN_ID: ${{ github.event.inputs.plan_artifact_run_id }}
      TOOLING_DIR: ${{ github.workspace }}/scripts/initiative-planner
    steps:
      - name: Checkout agent repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set temp paths
        run: |
          echo "DRY_RUN_LOG=${{ runner.temp }}/dry-run.jsonl" >> "$GITHUB_ENV"
          echo "CONTEXT_PATH=${{ runner.temp }}/planning-context.json" >> "$GITHUB_ENV"
          echo "PLAN_PATH=${{ runner.temp }}/plan.json" >> "$GITHUB_ENV"

      - name: Install Python jsonschema
        run: pip install --quiet 'jsonschema>=4'

      # ── reviewed-plan handoff (#604) ────────────────────────────────────────
      # When a maintainer supplies a prior dry-run's run ID, load THAT run's
      # authoritative plan.json (the one they reviewed) into $PLAN_PATH. The
      # dry-run uploads it as the `initiative-plan-dry-run` artifact below. This
      # is what lets the apply run skip the LLM re-plan (the Bob step is gated
      # off when PLAN_ARTIFACT_RUN_ID is set).
      - name: Download reviewed plan artifact
        if: ${{ env.PLAN_ARTIFACT_RUN_ID != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dest="${{ runner.temp }}/reviewed-plan"
          mkdir -p "$dest"
          # The dry-run artifact is produced by a planner run, which always runs
          # in THIS (central) repo — not the target repo. Download from self with
          # GITHUB_TOKEN's actions:read, regardless of the plan's target_repo.
          gh run download "$PLAN_ARTIFACT_RUN_ID" \
            --repo "${{ github.repository }}" \
            --name initiative-plan-dry-run \
            --dir "$dest"
          if [ ! -s "$dest/plan.json" ]; then
            echo "::error::run $PLAN_ARTIFACT_RUN_ID has no plan.json in its initiative-plan-dry-run artifact" >&2
            exit 1
          fi
          cp "$dest/plan.json" "$PLAN_PATH"
          echo "loaded reviewed plan from run $PLAN_ARTIFACT_RUN_ID -> $PLAN_PATH"

      - name: Gather planning context
        env:
          # Reads the TARGET repo's Discussion + open epics.
          GH_TOKEN: ${{ env.TARGET_GH_TOKEN }}
        run: bash scripts/initiative-planner/gather-context.sh

      - name: Plan the initiative (BMAD Scrum Master)
        id: bob
        # Skipped on the reviewed-plan handoff (#604): when a prior plan.json is
        # supplied, we apply it verbatim and never re-plan.
        if: ${{ env.PLAN_ARTIFACT_RUN_ID == '' }}
        env:
          # Bob materializes the epic + DAG in the TARGET repo via apply-plan.sh.
          GH_TOKEN: ${{ env.TARGET_GH_TOKEN }}
        uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1.0.183
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # CRITICAL (same gotcha as feature-ideation): pass the target-repo write
          # token explicitly so the issues/discussions writes apply on the TARGET
          # repo. The action's own app token lacks them and mutations would fail
          # silently.
          github_token: ${{ env.TARGET_GH_TOKEN }}
          claude_args: |
            --model ${{ github.event.inputs.model || 'claude-opus-4-8' }}
            --allowedTools Bash,Read,Glob,Grep
          prompt: |
            You are **Bob**, the BMAD Scrum Master, running as an automated,
            non-interactive initiative planner for the ${{ env.REPO }} repo.

            ## Method — follow the vendored BMAD skills (by path)

            This repo vendors the real BMAD Method skills agent-agnostically under
            `frameworks/` (v6.8.0 + Test Architect v1.19.0). Read the orchestration
            wrapper and follow every step — it points you at the exact skill files
            (`frameworks/bmad-method/src/bmm-skills/4-implementation/` for
            sprint-planning + create-story, and `frameworks/bmad-test-architecture/`
            for the Test Architect) and how to adapt them to this repo's
            non-interactive, GitHub-issues output:

            ```bash
            cat prompts/bmad/scrum-master.md
            ```

            Use the BMAD skills for their real method, templates, and checklists —
            do not paraphrase them. The create-story template is the required story
            shape; its checklist is the readiness bar each story clears.

            ## Your input

            The approved idea + repo context is at `$CONTEXT_PATH` (JSON): the
            Discussion title/body/comments, the open `initiative` epics, and the
            issues the idea references (likely prerequisites). Read it, then ground
            stories in the checked-out repo with Read/Grep/Glob (`AGENTS.md`,
            `CLAUDE.md`, `scripts/`, `.github/workflows/`, `docs/initiatives/`):

            ```bash
            cat "$CONTEXT_PATH" | jq .
            ```

            ## Your output

            Emit a single **initiative plan** JSON to `$PLAN_PATH` conforming to
            `scripts/initiative-planner/plan.schema.json`. Top-level keys:
            `epic` (`title`, `body`, and optionally `untracked_prerequisites` —
            a string array of non-issue prerequisites rendered as a checklist on
            the epic body), `stories` (BMAD create-story shape: `user_story`,
            `acceptance_criteria`, `tasks` with `ac_refs`, `dev_notes`,
            `project_structure_notes`, `references`, plus `id`/`title`/`size`/
            `blocked_by`/`blocked_by_existing_issues`/`hands_off`), and
            optionally `open_questions`. Typically 3–8 stories. `[Phase N]`
            title prefixes when ordered.

            Before emitting the plan, run the **Quality rubric** self-check from
            `prompts/bmad/scrum-master.md` in a thinking block as an internal
            self-check (do not output prose about your answers). Route any item you
            cannot answer with "yes" or "yes — N/A" to `open_questions` rather
            than guessing.

            ## Validate the draft

            ```bash
            python3 scripts/initiative-planner/validate-plan.py "$PLAN_PATH"
            ```

            Fix and re-validate until it passes (unique ids, acyclic DAG, an entry
            point, no dangling edges).

            ## Bounded plan-critic pass — single review + ONE revise (NO loop)

            Once the draft passes validate-plan.py, run ONE adversarial critic
            pass over it, then revise EXACTLY ONCE. This is a single bounded turn
            in this same step — there is NO self-reflection loop (per discussion
            #593) and it adds at most one extra reasoning pass. Wiring choice
            (documented per the story): a second turn in Bob's prompt, NOT a
            second claude-code-action step — it keeps the critic to one extra pass
            in this existing single LLM invocation and needs no extra engine wiring.

            1. **Critique.** Read the critic instructions and output shape in
               `prompts/plan-review.md`; they tell you to score `$PLAN_PATH`
               against the FIXED rubric defined ONCE in
               `prompts/bmad/scrum-master.md` (consume the rubric verbatim — do
               NOT fork a second copy). Write your structured findings
               `{check, story_id?, severity, finding}` as JSON to a findings file:

               ```bash
               cat prompts/plan-review.md   # critic instructions + output shape
               FINDINGS="${{ runner.temp }}/plan-findings.json"
               # ... write your findings JSON to "$FINDINGS" ...
               ```

            2. **Revise once.** Fold every finding you CAN resolve directly back
               into `$PLAN_PATH` (tighten the AC, add the missing success metric /
               cost cap, split the oversized story, add the untracked prerequisite,
               add the eval safeguard). Write just the findings you CANNOT resolve
               from context to a second file and route them into `open_questions`
               (carrying `affected_story_ids`) so they gate per #682 — do NOT
               guess:

               ```bash
               UNRESOLVED="${{ runner.temp }}/unresolved-findings.json"
               # ... write the unresolved subset (same {check,story_id,severity,finding}
               #     shape, wrapped as {"findings":[...]}) to "$UNRESOLVED" ...
               bash scripts/initiative-planner/route-findings.sh \
                 "$PLAN_PATH" "$UNRESOLVED" > "$PLAN_PATH.routed" \
                 && mv "$PLAN_PATH.routed" "$PLAN_PATH"
               ```

            3. **Re-validate** the revised plan. This is the end of the critic
               pass — do not critique again.

               ```bash
               python3 scripts/initiative-planner/validate-plan.py "$PLAN_PATH"
               ```

            ## Materialize

            THEN materialize the epic + sub-issue DAG — this honors `$DRY_RUN`
            (when `DRY_RUN=1` it logs intended mutations to `$DRY_RUN_LOG` instead
            of writing to GitHub):

            ```bash
            REPO="$REPO" \
            PLAN_PATH="$PLAN_PATH" \
            DISCUSSION_NUMBER="$DISCUSSION_NUMBER" \
            DISCUSSION_NODE_ID="$DISCUSSION_NODE_ID" \
            FORCE_REPLAN="$FORCE_REPLAN" \
            RECONCILE="$RECONCILE" \
            bash scripts/initiative-planner/apply-plan.sh
            ```

            ## Reconcile mode (`RECONCILE=1`, #708)

            When `RECONCILE=1`, this is a re-trigger against a LIVE epic — NOT a
            fresh plan. `$CONTEXT_PATH` carries a `reconcile` block with the bound
            epic and its sub-issues (state, labels, comments). Your job is to
            surface ONLY newly-flagged follow-ups from those sub-issue/review
            comments and add them as `proposed_story` findings on `open_questions`
            (each `{question:"<summary>",blocking:true,proposed_story:{title,
            acceptance_criteria},proposed_blocked_by:<existing issue #>}`). Do NOT
            set `accepted:true` — that is a maintainer-only gate per
            plan.schema.json; a human reviews the findings and sets `accepted:true`
            before re-triggering reconcile to materialize them. These route through
            the SAME plan-critic + acceptance path as plan-time (#706). apply-plan.sh
            binds
            the existing epic, skips epic/base-story/base-DAG creation, and
            materializes only the accepted findings that are not already present
            (deduped by reconcile-key). Do NOT recreate, edit, or close any
            base/in-flight story. A sub-issue carrying a `dev-lead` label is
            in-flight — never touch it. If nothing new has surfaced, still emit a
            valid plan and run apply-plan.sh; it is a clean no-op.

            ## Hard constraints

            - NEVER apply the `initiative:auto` label. The epic must be created
              inert; activation is a human decision. apply-plan.sh enforces this —
              do not work around it with direct `gh` calls.
            - Go through apply-plan.sh for all issue/DAG mutations; do not call
              `gh issue create` or the sub_issues/dependencies APIs directly.
            - ALWAYS produce a valid plan and ALWAYS run apply-plan.sh. Do NOT
              decide for yourself that the idea is "already planned" and skip
              materialization — apply-plan.sh owns idempotency: it no-ops (and
              points back at the existing epic) when one already exists, and
              supersedes it when `force_replan` is set. Your job is to plan and
              invoke the script; the script decides whether to create, skip, or
              supersede.
            - Keep the plan grounded. No invented acceptance criteria.

            Finish with a 3–5 line summary: the epic, the story count, the
            dependency shape, and any open questions.

      # ── reviewed-plan handoff (#604) ────────────────────────────────────────
      # The mirror of Bob's in-prompt materialization for the supplied-plan path:
      # validate the reviewed plan.json, then run apply-plan.sh on it. No LLM
      # ran. FORCE_REPLAN and the blocking-open-questions / idempotency gates are
      # honored by apply-plan.sh. Require explicit dry_run=false to prevent
      # unexpected mutations — dry-run mode would create no epic or stories despite
      # the intent to apply.
      - name: Guard — reviewed-plan apply requires dry_run=false
        if: ${{ env.PLAN_ARTIFACT_RUN_ID != '' && env.DRY_RUN == '1' }}
        run: |
          echo "::error::plan_artifact_run_id is set, but dry_run=true. Re-dispatch with dry_run=false to materialize the reviewed plan."
          exit 1

      - name: Apply the reviewed plan (no re-plan)
        if: ${{ env.PLAN_ARTIFACT_RUN_ID != '' }}
        env:
          # Materializes the reviewed plan in the TARGET repo.
          GH_TOKEN: ${{ env.TARGET_GH_TOKEN }}
        run: bash scripts/initiative-planner/apply-reviewed-plan.sh

      - name: Upload dry-run plan log
        if: ${{ env.DRY_RUN == '1' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: initiative-plan-dry-run
          path: |
            ${{ runner.temp }}/dry-run.jsonl
            ${{ runner.temp }}/plan.json
          if-no-files-found: warn
