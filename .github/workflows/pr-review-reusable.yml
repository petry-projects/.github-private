name: PR Review Reusable

on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      GOOGLE_API_KEY:
        required: false
      COPILOT_GITHUB_TOKEN:
        required: false

permissions: {}

jobs:
  review:
    uses: petry-projects/.github-private/.github/workflows/pr-review.yml@main
    secrets: inherit
