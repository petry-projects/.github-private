# Persona Runtime — caller (receives the router's dispatch).
# SOURCE OF TRUTH: petry-projects/.github-private/.github/workflows/persona-runner-reusable.yml
# Standard: https://github.com/petry-projects/.github/blob/main/standards/persona-standards.md (§4.1)
#
# The mention router (in petry-projects/.github) fires `persona-mention` at this
# repo with client_payload {persona, mode, source_repo, item_number, comment_url,
# requested_by, surface, event_action}. This stub hands that payload to the
# reusable, which runs the addressed persona's advisory prompt.
#
# `surface` selects which suppressors the reusable applies before the engine:
# it defaults to `mention` (existing mention dispatches unchanged), and a
# router-served `pull_request` dispatch (surface=pull_request) triggers the
# persona's event pre-gate — test-surface / budget / already-advised for qa-lead
# (#1905). This reusable is referenced by a LOCAL `./` path (same commit), so the
# new inputs are declared in the same change — no channel-skew concern.
#
# Thin caller: no logic here beyond mapping the payload to inputs. All behaviour
# lives in the reusable. This repo is the `next` ring — the first, smallest
# blast-radius soak for the persona runtime.
name: Persona Runtime

on:
  repository_dispatch:
    types: [persona-mention]

permissions: {}

jobs:
  run:
    permissions:
      # A reusable is granted no more than its calling job, so the read scopes the
      # reusable's event pre-gate needs (#1905) must be granted HERE too. Without
      # pull-requests/issues:read the shared qa-lead gate 403s on a private source
      # repo's PR files/labels/reviews/comments and every routed pull_request
      # advisory fails closed (skips).
      contents: read
      pull-requests: read
      issues: read
    uses: ./.github/workflows/persona-runner-reusable.yml
    with:
      persona: ${{ github.event.client_payload.persona }}
      source_repo: ${{ github.event.client_payload.source_repo }}
      item_number: ${{ github.event.client_payload.item_number }}
      comment_url: ${{ github.event.client_payload.comment_url }}
      requested_by: ${{ github.event.client_payload.requested_by }}
      mode: ${{ github.event.client_payload.mode }}
      # Absent surface -> 'mention' so existing dispatches are unchanged (#1905).
      surface: ${{ github.event.client_payload.surface || 'mention' }}
      event_action: ${{ github.event.client_payload.event_action || '' }}
    secrets: inherit
