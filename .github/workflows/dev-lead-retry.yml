name: Dev-Lead Retry (rate-limited)
# timer_role: safety-net (docs/agentic-interaction-model.md §6.1). Scans open PRs
# across the org for status=rate-limited markers and re-dispatches the appropriate
# dev-lead event once the rate limit clears.
#
# THIS IS A BACKSTOP, NOT THE CONVERGENCE CLOCK. Since #1407, a blocked/
# rate-limited dev-lead state is resumed EVENT-FIRST — the moment a clearing event
# arrives (a review submitted or a check_run success) the resume job in
# dev-lead-reusable.yml fires scripts/dev-lead-resume.sh via a PAT-backed
# repository_dispatch. This 2 h cron is retained ONLY for the rare, genuinely
# un-eventable rate-limit recovery where no such clearing event ever fires (e.g. a
# stalled issue with no PR, or a rate limit that clears with no subsequent PR
# activity). It is no longer the de-facto convergence clock the #860 postmortem
# named the "amplifier".
#
# Stop-condition-before-acting (§6.2.1): scripts/dev-lead-retry.sh re-checks,
# BEFORE any dispatch, that the PR is still open, not human-gated
# (needs-human-review), has not exhausted its per-PR automation budget
# (pr_resume_suppressed — the SAME gate the event path uses), and that the
# rate-limit reset window has elapsed with no terminal marker already posted.
#
# Runs every 2 hours (single schedule, no staggered offsets needed since the
# concurrency group serialises any overlap from GitHub scheduler jitter).
# Each repo is staggered by 30s during the scan to avoid dispatching all
# repos simultaneously and hitting the same org-level rate limit again.
#
# Phase 2 (fix-ci retry) and Phase 3 (fix-reviews/human-pr/rebase retry) are
# both handled here since the retry logic is the same for all retryable intents.
#
# It also re-dispatches a lost fix-bot-comment pass (#2017): an open dev-lead PR
# whose registered reviewer-bot issue comment has no covering disposition (and no
# info_status_pattern match) gets one deduplicated fix-bot-comment retry per scan,
# addressed by the comment's node id (scan_pr_for_undispositioned_bot_comments).
#
# Each target repo parses a payload at its OWN dev-lead.yml pin, so the sweep
# holds back (with a ::warning::) any payload carrying a client_payload field the
# target's pinned parser does not read (#2086, scripts/lib/dispatch-channel-gate.sh).

on:
  schedule:
    - cron: "15 */2 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "If true, log retries but do not dispatch"
        required: false
        default: "false"
        type: string
      dispatch_delay_sec:
        description: "Seconds between repo dispatches (default: 30)"
        required: false
        default: "30"
        type: string

# contents: write is required to create repository_dispatch events.
permissions:
  contents: write

concurrency:
  group: dev-lead-retry
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ secrets.GH_PAT_DON_PETRY || secrets.GH_PAT_WORKFLOWS || secrets.GITHUB_TOKEN }}
  TARGET_ORG: ${{ vars.TARGET_ORG || 'petry-projects' }}
  DRY_RUN: ${{ inputs.dry_run || 'false' }}
  DISPATCH_DELAY_SEC: ${{ inputs.dispatch_delay_sec || '30' }}

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Run the sweep at the SAME release as the harness it dispatches to (#2050).
      # The dispatched runs execute scripts/ at the channel dev-lead.yml pins via
      # `agent_ref`; running the sweep from main let it send payload fields that
      # channel could not read yet (#2017). Read the pin from the default branch
      # and check scripts/ out at it. Never hard-code the major here.
      # Target repos pinned to another channel are covered per payload by the
      # gate the run step turns on with SWEEP_AGENT_REF (#2086).
      - name: Fetch dev-lead caller stub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .channel-pin
          sparse-checkout: .github/workflows/dev-lead.yml
          sparse-checkout-cone-mode: false
          token: ${{ secrets.GH_PAT_DON_PETRY || secrets.GH_PAT_WORKFLOWS || secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: Resolve pinned dev-lead channel
        id: channel
        env:
          STUB_FILE: .channel-pin/.github/workflows/dev-lead.yml
        run: |
          set -euo pipefail
          ref="$(sed -nE "s/^[[:space:]]*agent_ref:[[:space:]]*[\"']?([^\"'[:space:]#]*).*/\1/p" "$STUB_FILE" | head -n 1)"
          if [[ ! "$ref" =~ ^dev-lead/v[0-9]+-(next|ring0|ring1|stable)$ ]]; then
            echo "::error::dev-lead.yml agent_ref '${ref}' is empty or not a dev-lead channel tag (dev-lead/v<N>-next|ring0|ring1|stable)"
            exit 1
          fi
          echo "Sweep runs scripts/ at pinned channel: ${ref}"
          echo "agent_ref=${ref}" >>"$GITHUB_OUTPUT"

      - name: Checkout agent repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.channel.outputs.agent_ref }}
          token: ${{ secrets.GH_PAT_DON_PETRY || secrets.GH_PAT_WORKFLOWS || secrets.GITHUB_TOKEN }}
          persist-credentials: false

      # Public reader for the Claude usage windows (#2139): the sweep sources
      # its arl_token_* helpers to hold quota retries until the real reset.
      - name: Checkout agent-rate-limit library
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: petry-projects/.github
          ref: 2e3d523b4c986a0319f1e96f2ae83ee13178f5a2
          path: .public-lib
          sparse-checkout: scripts/lib/agent-rate-limit.sh
          sparse-checkout-cone-mode: false
          token: ${{ secrets.GH_PAT_DON_PETRY || secrets.GH_PAT_WORKFLOWS || secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: Scan and retry rate-limited PRs
        env:
          AGENT_RATE_LIMIT_LIB: ${{ github.workspace }}/.public-lib/scripts/lib/agent-rate-limit.sh
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Turns on the per-target payload-field gate (#2086).
          SWEEP_AGENT_REF: ${{ steps.channel.outputs.agent_ref }}
        run: bash scripts/dev-lead-retry.sh
