# ─────────────────────────────────────────────────────────────────────────────
# Dev-Lead Agent — thin caller stub
# Standard:  petry-projects/.github/standards/ci-standards.md#5-dev-lead-agent
# Reusable:  petry-projects/.github-private/.github/workflows/dev-lead-reusable.yml
#
# ADOPTING THIS WORKFLOW:
#   1. Copy this file verbatim to .github/workflows/dev-lead.yml in your repo.
#   2. Ensure CLAUDE_CODE_OAUTH_TOKEN is set as an org or repo secret.
#   3. Optionally set GH_PAT_WORKFLOWS (required if Claude pushes workflow files).
#   4. Optionally set vars.DEV_LEAD_ENGINE = "claude" | "gemini" | "copilot".
#
# UNLIKE claude.yml, this file has NO OIDC byte-for-byte constraint and may be
# freely modified on PR branches to adjust triggers for repo-specific needs.
#
# REQUIRED secrets: CLAUDE_CODE_OAUTH_TOKEN
# OPTIONAL secrets: GH_PAT_WORKFLOWS, GOOGLE_API_KEY, GH_PAT
# ─────────────────────────────────────────────────────────────────────────────

name: Dev-Lead Agent

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  issue_comment:
    types: [created]
  issues:
    types: [labeled]
  check_run:
    types: [completed]
  repository_dispatch:
    types: [dev-lead-ci-failure, dev-lead-reviews-retry]

permissions: {}

concurrency:
  # Per-PR/per-issue lanes mirror the routing in dev-lead-reusable.yml so that
  # unrelated PRs/issues are never blocked or cancelled by each other at the
  # workflow level (the outer gate) before the reusable's inner concurrency applies.
  group: >-
    ${{
      (github.event_name == 'check_run' && format('dev-lead-ci-relay-{0}', github.event.check_run.head_sha))
      || (github.event.pull_request.number && format('dev-lead-pr-{0}', github.event.pull_request.number))
      || (github.event.issue.pull_request && format('dev-lead-pr-{0}', github.event.issue.number))
      || (github.event.issue.number && format('dev-lead-issue-{0}', github.event.issue.number))
      || (github.event.client_payload.pr_number && format('dev-lead-pr-{0}', github.event.client_payload.pr_number))
      || format('dev-lead-run-{0}', github.run_id)
    }}
  cancel-in-progress: false

jobs:
  dev-lead:
    uses: petry-projects/.github-private/.github/workflows/dev-lead-reusable.yml@main
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      checks: read
      statuses: read
