# CI pipeline for the .github-private repository.
# Lints markdown, YAML, GitHub Actions, and shell scripts; runs AgentShield; scans for secrets.
# Standard: https://github.com/petry-projects/.github/blob/main/standards/ci-standards.md
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: '**/*.md'

      - name: Lint YAML
        run: |
          pip install --quiet --only-binary :all: "yamllint==1.38.0" # v1.38.0
          shopt -s extglob
          yamllint -c <(cat <<'YAMLLINTRC'
          extends: default
          rules:
            line-length:
              max: 250
            truthy:
              check-keys: false
            document-start: disable
            comments:
              min-spaces-from-content: 1
          YAMLLINTRC
          ) .github/workflows/!(*.lock).yml

      - name: Lint GitHub Actions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Install actionlint via GitHub API download (pinned version + checksum).
          # Uses gh release download rather than direct CDN curl to avoid transient
          # 504s from GitHub's release asset CDN.
          ACTIONLINT_VERSION="1.7.12"
          ACTIONLINT_SHA="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          gh release download "v${ACTIONLINT_VERSION}" -R rhysd/actionlint \
            -p "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output actionlint.tar.gz
          echo "${ACTIONLINT_SHA}  actionlint.tar.gz" | sha256sum -c -
          tar xzf actionlint.tar.gz actionlint
          chmod +x actionlint
          rm actionlint.tar.gz
          shopt -s extglob
          ./actionlint -ignore 'SC2129' .github/workflows/!(*.lock).yml

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run ShellCheck
        run: |
          # Recurse so subdirectories like scripts/lib/ (sourceable libraries)
          # are linted too. -x follows `# shellcheck source=...` directives.
          shopt -s globstar nullglob
          shell_files=(scripts/**/*.sh)
          if [ ${#shell_files[@]} -gt 0 ]; then
            shellcheck --severity=warning -x "${shell_files[@]}"
          else
            echo "No shell scripts found — skipping"
          fi

  agent-security:
    name: Agent Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Run AgentShield
        run: |
          npx --yes --ignore-scripts ecc-agentshield@1.4.0 scan --path . --format json --min-severity high

  aw-compile:
    name: Compile agentic workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install gh aw
        run: gh extension install github/gh-aw --pin v0.74.4
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compile agentic workflows
        run: gh aw compile --no-emit --approve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    # Dependabot PRs run with the Dependabot secret store, not the Actions
    # store, so secrets.GITLEAKS_LICENSE is empty and the org-licensed
    # gitleaks-action hard-fails ("missing gitleaks license"). Dependabot only
    # bumps pinned action SHAs / manifest versions (no secret-introduction
    # surface), and the post-merge push-to-main run re-scans full history with
    # the license present — so skipping the PR scan loses no real coverage.
    # Gate on the PR author (github.event.pull_request.user.login) rather than
    # github.actor: actor changes on workflow re-runs (e.g. a maintainer
    # clicking "Re-run jobs"), while the PR author is immutable. Push runs on
    # main always execute so the post-merge scan is never skipped.
    if: github.event_name == 'push' || github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run gitleaks
        # SHA pinned per Action Pinning Policy (ci-standards.md#action-pinning-policy).
        # Refresh: gh api repos/gitleaks/gitleaks-action/git/refs/tags/v2 --jq '.object.sha'
        # then dereference if it points at an annotated tag.
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

