# CI pipeline for the .github-private repository.
# Lints markdown, YAML, GitHub Actions, and shell scripts; runs AgentShield; scans for secrets.
# Standard: https://github.com/petry-projects/.github/blob/main/standards/ci-standards.md
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@ded1f9488f68a970bc66ea5619e13e9b52e601cd # v23.2.0
        with:
          globs: '**/*.md'

      - name: Lint YAML
        run: |
          pip install --quiet --only-binary :all: "yamllint==1.38.0" # v1.38.0
          shopt -s extglob
          yamllint -c <(cat <<'YAMLLINTRC'
          extends: default
          rules:
            line-length:
              max: 250
            truthy:
              check-keys: false
            document-start: disable
            comments:
              min-spaces-from-content: 1
          YAMLLINTRC
          ) .github/workflows/!(*.lock).yml

      - name: Lint GitHub Actions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Install actionlint via GitHub API download (pinned version + checksum).
          # Uses gh release download rather than direct CDN curl to avoid transient
          # 504s from GitHub's release asset CDN.
          ACTIONLINT_VERSION="1.7.12"
          ACTIONLINT_SHA="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          gh release download "v${ACTIONLINT_VERSION}" -R rhysd/actionlint \
            -p "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output actionlint.tar.gz
          echo "${ACTIONLINT_SHA}  actionlint.tar.gz" | sha256sum -c -
          tar xzf actionlint.tar.gz actionlint
          chmod +x actionlint
          rm actionlint.tar.gz
          shopt -s extglob
          ./actionlint -ignore 'SC2129' .github/workflows/!(*.lock).yml

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Run ShellCheck
        run: |
          # Recurse so subdirectories like scripts/lib/ (sourceable libraries)
          # are linted too. -x follows `# shellcheck source=...` directives.
          shopt -s globstar nullglob
          shell_files=(scripts/**/*.sh)
          if [ ${#shell_files[@]} -gt 0 ]; then
            shellcheck --severity=warning -x "${shell_files[@]}"
          else
            echo "No shell scripts found — skipping"
          fi

  agent-security:
    name: Agent Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'

      - name: Run AgentShield
        run: |
          npx --yes --ignore-scripts ecc-agentshield@1.4.0 scan --path . --format json --min-severity high

  aw-compile:
    name: Compile agentic workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install gh aw
        run: gh extension install github/gh-aw --pin v0.74.4
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compile agentic workflows
        run: gh aw compile --no-emit --approve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Run gitleaks
        # Intentionally uses the gitleaks CLI rather than gitleaks/gitleaks-action (replaced
        # to fix issue #408 — action behavior changes caused spurious workflow failures).
        # If the org push-protection standard's secret_scan_ci_job_present compliance check
        # requires gitleaks/gitleaks-action specifically, update that standard in
        # petry-projects/.github/standards/push-protection.md to also accept the CLI approach.
        run: |
          GITLEAKS_VERSION="8.30.1"
          GITLEAKS_SHA="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          curl --fail --location --retry 3 --retry-delay 5 -so gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA}  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          rm gitleaks.tar.gz
          ./gitleaks detect --source . --redact --verbose --exit-code 1
