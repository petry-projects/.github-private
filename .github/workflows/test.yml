name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Run copilot_chat tests
        run: bash tests/test_copilot_chat.sh

      - name: Run list-prs sort tests
        run: bash tests/test_list_prs_sort.sh

      - name: Install test dependencies
        run: |
          pip install pyyaml
          sudo apt-get update && sudo apt-get install -y yq

      - name: Run sonarcloud workflow tests
        run: bash tests/test_sonarcloud_workflow.sh

      - name: Run sonar S7637 exemption tests
        run: bash tests/test_sonar_s7637_exemption.sh

      - name: Run copilot-setup-steps workflow tests
        run: bash tests/test_copilot_setup_steps.sh
