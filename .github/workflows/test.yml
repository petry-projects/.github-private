name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Run copilot_chat tests
        run: bash tests/test_copilot_chat.sh

      - name: Run list-prs sort tests
        run: bash tests/test_list_prs_sort.sh

  aw-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Install Python dependencies
        run: pip install "pyyaml==6.0.3" --only-binary :all: --quiet

      - name: Compile gh-aw workflow definitions
        run: bash scripts/aw.sh compile --all

      - name: Run aw issue-triage tests
        run: bash tests/aw/issue-triage/test_aw_run.sh
