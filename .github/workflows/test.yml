name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Run copilot_chat tests
        run: bash tests/test_copilot_chat.sh

      - name: Run list-prs sort tests
        run: bash tests/test_list_prs_sort.sh

  aw-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6

      - name: Install Python dependencies
        run: pip install pyyaml --quiet

      - name: Compile gh-aw workflow definitions
        run: bash scripts/aw.sh compile --all
