# ─────────────────────────────────────────────────────────────────────────────
# SOURCE OF TRUTH: petry-projects/.github-private/.github/workflows/budget-poller.yml
#
# AGENTS — READ BEFORE EDITING:
#   • Repo-specific DRY-RUN budget poller for issue #2029 (slice 2 of #1565);
#     there is no org template — see AGENTS.md "Pausing the agent fleet".
#   • DRY-RUN ONLY. This workflow and scripts/budget_poller.sh +
#     scripts/lib/budget-poller.sh must never write, set, or clear any Actions
#     variable (org or repo) — not even behind a flag. Arming is gated on a human
#     sign-off under #1565. tests/dev-lead/unit/test_budget_poller.bats asserts
#     this statically; do NOT widen `permissions:` beyond read.
#   • Logic lives in the scripts (unit-tested). This file is only the schedule,
#     the read-only checkouts, the carry-forward of the previous log artifact, and
#     the upload of the new one.
#   • Fail-open: a failed poll is a DEGRADED record + warning, never a red run.
# ─────────────────────────────────────────────────────────────────────────────
name: Budget Poller (dry-run)
# readme-report: Dry-run Claude budget poller — reads the usage windows hourly, logs what the token-budget breaker would do (never sets a variable), and proves the feed is alive (#2029).

on:
  schedule:
    # Hourly at :17 — off the top of the hour (schedule standard).
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read  # read the previous run's log artifact (carry-forward)

concurrency:
  group: budget-poller
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BUDGET_POLLER_LOG: budget-poller-log.jsonl
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout the shipped public token-budget gates
        # The public library + config the org breaker ships (read-only, public repo).
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: petry-projects/.github
          ref: main
          path: public
          persist-credentials: false
          sparse-checkout: |
            scripts/lib/agent-rate-limit.sh
            standards/agent-rate-limits.json
          sparse-checkout-cone-mode: false

      - name: Restore the previous poll log (burn-rate basis)
        # Best-effort: no previous artifact (first-ever poll / expired) is fine.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # shellcheck source=scripts/lib/budget-poller.sh
          source scripts/lib/budget-poller.sh
          if bp_download_latest_log "$GITHUB_REPOSITORY" "$BUDGET_POLLER_LOG"; then
            echo "restored $(wc -l < "$BUDGET_POLLER_LOG") previous record(s)"
          else
            echo "no previous log — treating as the first-ever poll"
          fi

      - name: Resolve the Claude Code User-Agent version
        # The adapter's User-Agent version is load-bearing (an unversioned UA hits
        # an aggressively rate-limited bucket). No install — just the version.
        env:
          PINNED: ${{ vars.CLAUDE_CODE_VERSION }}
        run: |
          v="${PINNED:-}"
          if [ -z "$v" ] || [ "$v" = "latest" ]; then
            v="$(npm view @anthropic-ai/claude-code version 2>/dev/null || true)"
          fi
          echo "CLAUDE_CODE_VERSION=${v:-unknown}" >> "$GITHUB_ENV"

      - name: Poll the usage windows (dry-run)
        # Fail-open: the script exits 0 on any telemetry failure; continue-on-error
        # is belt-and-braces so a poll can never page.
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          BUDGET_POLLER_PUBLIC_LIB: public/scripts/lib/agent-rate-limit.sh
          AGENT_RATE_LIMITS_CONFIG: public/standards/agent-rate-limits.json
        run: bash scripts/budget_poller.sh

      - name: Upload the poll log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: budget-poller-log
          path: budget-poller-log.jsonl
          if-no-files-found: warn
          retention-days: 14
