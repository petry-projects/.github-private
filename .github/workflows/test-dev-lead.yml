name: Test Dev-Lead Agent
on:
  pull_request:
    paths:
      - 'scripts/dev-lead*'
      - 'scripts/auto-rebase-retry.sh'
      - 'scripts/engine.sh'
      - 'scripts/lib/**'
      - '.github/workflows/dev-lead*.yml'
      - '.github/workflows/test-dev-lead.yml'
      - '.github/workflows/issue-triage-runner.yml'
      - '.github/workflows/dependency-audit.yml'
      - '.github/workflows/auto-rebase.yml'
      - '.github/workflows/auto-rebase-retry.yml'
      - '.github/workflows/pr-review.yml'
      - '.github/workflows/pr-review-trigger.yml'
      - '.github/workflows/pr-auto-review.yml'
      - '.github/workflows/spec-drift.yml'
      - '.github/workflows/*.yml'
      - 'templates/**'
      - 'tests/dev-lead/**'
      - 'prompts/dev-lead/**'
      - '.github/review-mcp.json'
  push:
    branches: [main]
    paths:
      - 'scripts/dev-lead*'
      - 'scripts/auto-rebase-retry.sh'
      - 'scripts/engine.sh'
      - 'scripts/lib/**'
      - 'tests/dev-lead/**'
      - 'prompts/dev-lead/**'
      - '.github/review-mcp.json'
      # Guard the concurrency-config test on workflow changes too — otherwise a
      # dev-lead.yml edit can land on main without ever running this suite
      # (how the per-repo->per-lane mismatch stayed hidden after #450).
      - '.github/workflows/dev-lead*.yml'
      - '.github/workflows/test-dev-lead.yml'
      - '.github/workflows/issue-triage-runner.yml'
      - '.github/workflows/dependency-audit.yml'
      - '.github/workflows/auto-rebase.yml'
      - '.github/workflows/auto-rebase-retry.yml'
      - '.github/workflows/pr-review.yml'
      - '.github/workflows/pr-review-trigger.yml'
      - '.github/workflows/pr-auto-review.yml'
      - '.github/workflows/spec-drift.yml'
      - '.github/workflows/*.yml'
      - 'templates/**'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate-fixtures:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate event fixtures
        run: find tests/dev-lead/fixtures/events -name '*.json' -exec jq empty {} \;

  unit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install bats
        run: |
          # Install bats-core to user-local prefix to avoid root requirement
          mkdir -p "$HOME/.local/bin" "$HOME/.local/lib"
          git clone --depth 1 https://github.com/bats-core/bats-core.git /tmp/bats-core
          bash /tmp/bats-core/install.sh "$HOME/.local"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run unit tests (if exist)
        run: |
          if ls tests/dev-lead/unit/*.bats 2>/dev/null; then
            bats tests/dev-lead/unit/ --formatter tap
          else
            echo "No unit tests yet - harness verified"
          fi

  prompt-coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify prompt variable coverage
        run: |
          if [ -f tests/dev-lead/integration/test_prompt_coverage.sh ]; then
            bash tests/dev-lead/integration/test_prompt_coverage.sh
          else
            echo "Prompt coverage test not yet implemented"
          fi

  concurrency-config:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate concurrency config (per-issue/per-PR lanes)
        run: bash tests/dev-lead/integration/test_concurrency_config.sh

  caller-permissions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml
      - name: Validate caller<->reusable permission contract
        # Reads the public petry-projects/.github caller template; github.token suffices.
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tests/dev-lead/integration/test_caller_permissions.py

  toplevel-permissions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml
      - name: Validate issue-triage-runner.yml top-level permissions declaration
        run: python3 tests/dev-lead/integration/test_workflow_toplevel_permissions.py

  dismiss-stale-bot-reviews-permissions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml
      - name: Validate dismiss-stale-bot-reviews.yml top-level permissions declaration
        run: python3 tests/dev-lead/integration/test_dismiss_stale_bot_reviews_permissions.py

  stub-structure:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate dev-lead.yml is a thin caller stub
        run: bash tests/dev-lead/integration/test_dev_lead_stub.sh

  dependency-audit-stub:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml
      - name: Validate dependency-audit.yml is pinned to the canonical @dependency-audit/next ref
        run: python3 tests/dev-lead/integration/test_dependency_audit_stub.py

  auto-rebase-stub:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml
      - name: Validate auto-rebase.yml uses @auto-rebase/next (not a SHA or frozen tag)
        run: python3 tests/dev-lead/integration/test_auto_rebase_stub.py

  auto-rebase-retry-resilience:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml
      - name: Validate auto-rebase-retry.yml resolves no actions (survives action-resolution outage)
        run: python3 tests/dev-lead/integration/test_auto_rebase_retry_no_action_resolution.py

  reusable-pin-compliance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml
      - name: Reject SHA / off-channel pins on any first-party reusable
        run: python3 tests/dev-lead/integration/test_reusable_pin_compliance.py

  spec-drift-workflow:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml
      - name: Validate spec-drift.yml post-merge advisory contract
        run: python3 tests/dev-lead/integration/test_spec_drift_workflow.py

  pr-auto-review-stub:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml
      - name: Validate pr-auto-review.yml skips Dependabot and pins @pr-auto-review/v1-next
        run: python3 tests/dev-lead/integration/test_pr_auto_review_stub.py
