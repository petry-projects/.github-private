name: PR Review Agent — Trigger
# readme-agent: PR review agent — cascading triage → deep → security review on pull requests.

# Thin trigger stub for .github-private's OWN pr-review duty (ring 0 / self-host).
#
# It fires on the review events and invokes the reusable pinned to
# `pr-review.yml@pr-review/next`, passing `agent_ref: pr-review/next` so the
# agent's scripts (engine.sh, review-one-pr.sh, …) also run at the same channel.
# Per the ring strategy (docs/initiatives/agentic-release-strategy.md §5),
# .github-private is the ring-0 canary: it dogfoods the `next` channel so a new
# pr-review release is exercised on this repo's own PRs before it is promoted to
# `pr-review/stable` (the fleet). The pin is independent of whatever pr-review.yml
# is on the branch under review — which is what breaks the self-hosting circular
# dependency (#497).
#
# pr-review.yml itself is reusable-only; this stub owns the triggering. The
# @mention flow (pr-review-mention.yml -> org reusable -> repository_dispatch)
# still lands on the repository_dispatch trigger below.
#
# Rollout is driven by central tag moves (scripts/cut-release.sh … --channel):
# cut a release and advance `next` to dogfood here, then advance `stable` to
# promote to the fleet once this ring proves healthy. This file only changes when
# the ring-0 channel itself changes (e.g. next <-> stable).

on:
  check_suite:
    types: [completed]
  pull_request_review:
    types: [submitted, dismissed]
  pull_request:
    types: [ready_for_review, reopened, synchronize]
  workflow_dispatch:
    inputs:
      pr_url:
        description: "Optional: review a single PR URL instead of enumerating"
        required: false
        type: string
      dry_run:
        description: "If true, never submit reviews or comments"
        required: false
        default: "false"
        type: string
      force_review:
        description: "If true, bypass idempotency and re-review at the same head SHA"
        required: false
        default: "false"
        type: string
      lsp_pilot_variant:
        # LSP pilot A/B leg (epic #839, story #844, issue #1031). Drives the
        # off-vs-on comparison on this repo's own PRs: dispatch the same PR with
        # 'off' then 'on' to drop two joinable lsp_pilot_run records.
        #   on   → wire the LSP MCP + capture  (lsp-on,  B leg)
        #   off  → capture only, no LSP wiring (lsp-off, A control leg)
        #   none → today's behaviour (defers to vars.LSP_PILOT_ENABLED)
        description: "LSP pilot A/B leg: on | off | none"
        required: false
        default: "none"
        type: choice
        options:
          - none
          - "off"
          - "on"
  repository_dispatch:
    # Triggered by the petry-projects/.github mention-listener (via
    # pr-review-mention.yml). Payload: { pr_url, force_review }.
    types: [pr-review-mention]

# Granted to the called reusable's job (a reusable can be granted no more than
# the calling job has). Mirrors pr-review.yml's own permissions block.
permissions:
  contents: read
  pull-requests: write
  checks: read

jobs:
  review:
    # Ring-0 channel — see the header block for the dogfooding rationale.
    uses: petry-projects/.github-private/.github/workflows/pr-review.yml@pr-review/next
    with:
      # Pin the agent's own script checkout to the same channel (#506).
      agent_ref: pr-review/next
      # Forward manual/dispatch inputs; empty for event triggers (the reusable
      # then derives everything from the inherited github.event context).
      pr_url: ${{ inputs.pr_url || '' }}
      dry_run: ${{ inputs.dry_run || '' }}
      force_review: ${{ inputs.force_review || '' }}
      # Forward the LSP pilot A/B leg (empty for event triggers). 'none'/'' both
      # mean today's behaviour on the reusable side.
      lsp_pilot_variant: ${{ inputs.lsp_pilot_variant || '' }}
    secrets: inherit
