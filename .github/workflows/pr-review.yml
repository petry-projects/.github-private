name: PR Review Agent

on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      GOOGLE_API_KEY:
        required: false
      COPILOT_GITHUB_TOKEN:
        required: false
      DON_PETRY_BOT_GH_PAT:
        required: false
      GH_PAT:
        required: false

  # ── Event-driven triggers ────────────────────────────────────────────────
  # These replace the former time-based schedule. The review engine's own
  # idempotency check (head-SHA marker) prevents duplicate reviews, so
  # firing multiple times on the same PR is always safe.
  #
  # Coverage note: these events are scoped to this repo (.github-private).
  # For org-wide event-driven triggering (broodly, markets, etc.), deploy
  # a thin pr-review-auto-trigger.yml caller stub to each repo (Phase 2).

  check_suite:
    # Fires when a CI check suite completes on any branch in this repo.
    # We only act when the suite succeeded (failing/pending PRs are already
    # skipped by review-one-pr.sh's CI gate, but filtering here avoids
    # spinning up a runner at all). Empty pull_requests arrays (e.g. pushes
    # to main) are dropped in the job condition below.
    types: [completed]

  pull_request_review:
    # Fires when a reviewer submits a review or dismisses one.
    #   submitted  — covers APPROVED (green light) and CHANGES_REQUESTED
    #                (agent will skip via its own gate, but APPROVED is the
    #                common case that unlocks a previously-blocked PR).
    #   dismissed  — a CHANGES_REQUESTED review was dismissed, clearing the
    #                block so the agent can re-engage with the updated code.
    types: [submitted, dismissed]

  pull_request:
    # ready_for_review — draft PR promoted to open (ready for first review).
    # reopened          — closed PR is reopened (e.g. after revision).
    # synchronize       — new commits pushed (author addressed review comments);
    #                     CI will be pending immediately, so review-one-pr.sh
    #                     skips cheaply — the check_suite trigger fires once CI
    #                     settles and is the real wake signal post-push.
    types: [ready_for_review, reopened, synchronize]

  # ── Manual / programmatic triggers ──────────────────────────────────────
  workflow_dispatch:
    inputs:
      pr_url:
        description: "Optional: review a single PR URL instead of enumerating"
        required: false
        type: string
      dry_run:
        description: "If true, never submit reviews or comments"
        required: false
        default: "false"
        type: string
      force_review:
        description: "If true, bypass idempotency check and re-review even if already reviewed at head SHA (use for @mention-triggered reviews)"
        required: false
        default: "false"
        type: string
  repository_dispatch:
    # Triggered by the petry-projects/.github mention-listener workflow.
    # Requires only Contents: write on this repo (not Actions: write).
    # Payload: { pr_url: "https://github.com/...", force_review: "true" }
    types: [pr-review-mention]

permissions:
  contents: read
  pull-requests: write
  checks: read

concurrency:
  # Event-triggered and mention-triggered runs for a specific PR get a per-PR
  # concurrency slot so they never queue behind unrelated PRs.
  # check_suite events carry the associated PR in pull_requests[0]; including
  # that URL here prevents cross-PR cancellation when multiple PRs' CI suites
  # complete simultaneously (each PR competes only with itself, which is safe
  # since same-PR runs are idempotent on the same head SHA).
  # Note: check_suite.pull_requests entries expose the API `url` field, not
  # `html_url` — using `url` here matches the payload shape.
  # Manual batch runs (workflow_dispatch without pr_url) use a shared slot.
  group: >-
    ${{
      (inputs.pr_url
       || github.event.client_payload.pr_url
       || github.event.pull_request.html_url
       || github.event.check_suite.pull_requests[0].url)
      && format('pr-review-pr-{0}',
           inputs.pr_url
           || github.event.client_payload.pr_url
           || github.event.pull_request.html_url
           || github.event.check_suite.pull_requests[0].url)
      || 'pr-review-batch'
    }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Early exit conditions (avoids spinning up the runner for guaranteed no-ops):
    #   check_suite  — only proceed when CI succeeded and there's an associated PR.
    #                  Failing suites are always skipped by review-one-pr.sh; empty
    #                  pull_requests (e.g. direct pushes to main) have nothing to review.
    #   pull_request_review — skip COMMENTED reviews; they don't change merge-readiness.
    #                         CHANGES_REQUESTED reviews are also skipped because the PR
    #                         is now blocked; review-one-pr.sh would skip it anyway.
    if: >-
      (github.event_name != 'check_suite' ||
       (github.event.check_suite.conclusion == 'success' &&
        github.event.check_suite.pull_requests[0] != null))
      &&
      (github.event_name != 'pull_request_review' ||
       github.event.review.state == 'approved' ||
       github.event.review.state == 'dismissed')
    env:
      # Auth for every gh / script call in this job. The PAT must belong to BOT_USER.
      GH_TOKEN: ${{ secrets.DON_PETRY_BOT_GH_PAT }}
      # Single bot identity. DON_PETRY_BOT_GH_PAT authenticates as BOT_USER; that
      # account owns/has-access-to the personal repos scanned by list-prs.sh,
      # signs the cascade's escalation comments, and is filtered out of the
      # candidate queue (it can't approve its own PRs). Human reviewers are
      # routed via CODEOWNERS at escalation time, not pinned via env.
      BOT_USER: ${{ vars.BOT_USER || 'donpetry-bot' }}
      TARGET_ORG: ${{ vars.TARGET_ORG || 'petry-projects' }}
      AGENT_REPO: ${{ github.repository }}
      # Review engine: "claude" or "copilot". Controls which CLI and models are used.
      REVIEW_ENGINE: ${{ vars.REVIEW_ENGINE || 'claude' }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      # Copilot engine reuses GH_PAT (a separate user PAT with Copilot subscription).
      COPILOT_GITHUB_TOKEN: ${{ secrets.GH_PAT }}
      # Gemini engine auth — GOOGLE_API_KEY is the secret name; newer Gemini CLI
      # versions expect GEMINI_API_KEY so we expose the same value under both names.
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      GEMINI_CLI_TRUST_WORKSPACE: "true"
      # Event-triggered runs respect LIVE_MODE (same semantics as the former schedule).
      # repository_dispatch (mention) always runs live.
      # workflow_dispatch respects the dry_run input.
      DRY_RUN: ${{ github.event_name == 'repository_dispatch' && 'false' || inputs.dry_run || (vars.LIVE_MODE == 'true' && 'false' || 'true') }}
      # PR URL to review. Populated from inputs (workflow_dispatch), client_payload
      # (repository_dispatch), or the PR context for event-triggered runs.
      # check_suite events may have multiple PRs; those are handled separately via
      # CHECK_SUITE_PRS in the "Enumerate candidate PRs" step.
      PR_URL_OVERRIDE: >-
        ${{
          inputs.pr_url
          || github.event.client_payload.pr_url
          || github.event.pull_request.html_url
          || ''
        }}
      # JSON array of PRs associated with a check_suite event. Empty for all
      # other event types. Consumed by "Enumerate candidate PRs" to extract URLs.
      CHECK_SUITE_PRS: >-
        ${{
          github.event_name == 'check_suite'
          && toJSON(github.event.check_suite.pull_requests)
          || '[]'
        }}
      DELEGATION_ORGS: ${{ vars.DELEGATION_ORGS || vars.CLAUDE_ORGS || '' }}
      MAX_REVIEW_CYCLES: ${{ vars.MAX_REVIEW_CYCLES || '3' }}
      MAX_PRS: ${{ vars.MAX_PRS || '10' }}
      CANDIDATE_LIMIT: ${{ vars.CANDIDATE_LIMIT || '250' }}
      # Pin via vars.CLAUDE_CODE_VERSION for fully reproducible caching; default
      # 'latest' caches an install indefinitely under that key — flush via the
      # Actions cache UI or bump the variable to pick up new releases.
      CLAUDE_CODE_VERSION: ${{ vars.CLAUDE_CODE_VERSION || 'latest' }}
      # Mention-triggered reviews always force a re-review; all other triggers
      # respect the idempotency check (no double-reviews on the same head SHA).
      TOKEN_LOG_FILE: /tmp/token-usage-${{ github.run_id }}.jsonl
      TOKEN_WORKFLOW: pr-review
      FORCE_REVIEW: ${{ github.event_name == 'repository_dispatch' && 'true' || inputs.force_review || 'false' }}

    steps:
      - name: Generate GitHub App token
        uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: petry-projects
      - name: Checkout agent repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Cache claude-code CLI
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.npm-global
          key: claude-code-${{ env.CLAUDE_CODE_VERSION }}-${{ runner.os }}

      - name: Verify auth scopes
        run: bash scripts/verify-auth-scopes.sh

      - name: Install review engine CLIs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          # Use a per-user prefix so actions/cache (above) can persist the
          # install across runs without needing root. Add the bin dir to PATH
          # for both this step and every subsequent step in the job.
          mkdir -p "$HOME/.npm-global"
          npm config set prefix "$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.npm-global/bin:$PATH"

          npm_install_retry() {
            # npm_install_retry <package> [attempts=3] [delay_seconds=15]
            local package="$1"
            local attempts="${2:-3}"
            local delay="${3:-15}"
            local attempt=1
            while [ "$attempt" -le "$attempts" ]; do
              if npm install -g "$package"; then
                return 0
              fi
              if [ "$attempt" -lt "$attempts" ]; then
                echo "::warning::npm install failed for $package (attempt $attempt/$attempts); retrying in ${delay}s"
                sleep "$delay"
              fi
              attempt=$((attempt + 1))
            done
            return 1
          }

          install_claude() {
            if command -v claude >/dev/null 2>&1; then
              echo "claude-code cache hit: $(claude --version)"
              return 0
            fi
            npm_install_retry "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          }

          case "$REVIEW_ENGINE" in
            claude)
              install_claude
              # Best-effort install of fallbacks for duck/fallback support
              npm_install_retry "@google/gemini-cli" || true
              if ! command -v gemini >/dev/null 2>&1; then
                echo "::warning::gemini CLI unavailable — Gemini rate-limit fallback will be unavailable"
              fi
              if ! env GH_TOKEN="$COPILOT_GITHUB_TOKEN" gh copilot --version > /dev/null 2>&1; then
                echo "::warning::gh copilot built-in unavailable with user token — rate-limit fallback will be unavailable."
              fi
              ;;
            gemini)
              npm_install_retry "@google/gemini-cli"
              install_claude || true
              ;;
            copilot)
              # Best-effort install of copilot if built-in is missing
              if ! gh copilot --version > /dev/null 2>&1; then
                gh extension install github/gh-copilot || true
              fi
              install_claude || true
              npm_install_retry "@google/gemini-cli" || true
              if ! command -v gemini >/dev/null 2>&1; then
                echo "::warning::gemini CLI unavailable — Gemini duck review will be skipped"
              fi
              ;;
            *)
              echo "::error::Unknown REVIEW_ENGINE=$REVIEW_ENGINE"
              exit 1
              ;;
          esac

      - name: Enumerate candidate PRs
        run: |
          set -euo pipefail

          if [ -n "${PR_URL_OVERRIDE}" ]; then
            # Single-PR mode: workflow_dispatch with pr_url, repository_dispatch
            # (mention), or event-triggered run with a direct PR context
            # (pull_request_review / pull_request events).
            printf '%s\n' "${PR_URL_OVERRIDE}" > prs.txt
          elif [ "${CHECK_SUITE_PRS}" != "[]" ] && [ -n "${CHECK_SUITE_PRS}" ]; then
            # check_suite event: one or more PRs share the completed suite.
            # The payload carries API URLs (https://api.github.com/repos/…/pulls/N);
            # convert them to HTML URLs (https://github.com/…/pull/N) for review-one-pr.sh.
            echo "${CHECK_SUITE_PRS}" \
              | jq -r '.[].url' \
              | sed 's|https://api\.github\.com/repos/|https://github.com/|; s|/pulls/|/pull/|' \
              > prs.txt
          else
            bash scripts/list-prs.sh > prs.txt
            TOTAL=$(wc -l < prs.txt | tr -d ' ')
            if [ "$TOTAL" -gt 0 ]; then
              echo "::notice::Candidate pool has $TOTAL PRs. Review loop will process until MAX_PRS actual reviews are completed (no-ops are skipped)."
            fi
          fi

          count=$(grep -c . prs.txt || true)
          echo "::notice::Candidate pool has $count PRs (no-ops will be skipped, MAX_PRS caps actual reviews)"
          echo "--- candidate PRs ---"
          if [ -s prs.txt ]; then
            cat prs.txt
          else
            echo "(empty file)"
          fi

      - name: Review each PR (cascade)
        run: bash scripts/review-batch.sh

      - name: Upload debug log on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        # Collect both current cascade logs and legacy/supplemental log paths.
        with:
          name: pr-review-debug-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            prs.txt
            /tmp/cascade/**
            /tmp/review-*.log
            ${{ runner.temp }}/cascade/**
            ${{ runner.temp }}/review-*.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload token usage log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: token-usage-${{ github.run_id }}
          path: /tmp/token-usage-${{ github.run_id }}.jsonl
          if-no-files-found: ignore
          retention-days: 30
