name: PR Review Agent

on:
  schedule:
    # Every 15 min to ensure at least one run fires per hour
    # (GitHub Actions scheduled runs can be delayed/skipped under load)
    - cron: "7 * * * *"
    - cron: "22 * * * *"
    - cron: "37 * * * *"
    - cron: "52 * * * *"
  workflow_dispatch:
    inputs:
      pr_url:
        description: "Optional: review a single PR URL instead of enumerating"
        required: false
        type: string
      dry_run:
        description: "If true, never submit reviews or comments"
        required: false
        default: "false"
        type: string
      force_review:
        description: "If true, bypass idempotency check and re-review even if already reviewed at head SHA (use for @mention-triggered reviews)"
        required: false
        default: "false"
        type: string
  repository_dispatch:
    # Triggered by the petry-projects/.github mention-listener workflow.
    # Requires only Contents: write on this repo (not Actions: write).
    # Payload: { pr_url: "https://github.com/...", force_review: "true" }
    types: [pr-review-mention]

permissions:
  contents: read
  pull-requests: write
  checks: read

concurrency:
  # Event-triggered and mention-triggered runs for a specific PR get a per-PR
  # concurrency slot so they never queue behind unrelated PRs.
  # check_suite events carry the associated PR in pull_requests[0]; including
  # that URL here prevents cross-PR cancellation when multiple PRs' CI suites
  # complete simultaneously (each PR competes only with itself, which is safe
  # since same-PR runs are idempotent on the same head SHA).
  # Note: check_suite.pull_requests entries expose the API `url` field, not
  # `html_url` — using `url` here matches the payload shape.
  # Manual batch runs (workflow_dispatch without pr_url) use a shared slot.
  group: >-
    ${{
      (inputs.pr_url
       || github.event.client_payload.pr_url
       || github.event.pull_request.html_url
       || github.event.check_suite.pull_requests[0].url)
      && format('pr-review-pr-{0}',
           inputs.pr_url
           || github.event.client_payload.pr_url
           || github.event.pull_request.html_url
           || github.event.check_suite.pull_requests[0].url)
      || 'pr-review-batch'
    }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Early exit conditions (avoids spinning up the runner for guaranteed no-ops):
    #   check_suite  — only proceed when CI succeeded and there's an associated PR.
    #                  Failing suites are always skipped by review-one-pr.sh; empty
    #                  pull_requests (e.g. direct pushes to main) have nothing to review.
    #   pull_request_review — skip COMMENTED reviews; they don't change merge-readiness.
    #                         CHANGES_REQUESTED reviews are also skipped because the PR
    #                         is now blocked; review-one-pr.sh would skip it anyway.
    if: >-
      (github.event_name != 'check_suite' ||
       (github.event.check_suite.conclusion == 'success' &&
        github.event.check_suite.pull_requests[0] != null))
      &&
      (github.event_name != 'pull_request_review' ||
       github.event.review.state == 'approved' ||
       github.event.review.state == 'dismissed')
    env:
      # Auth for every gh / script call in this job. The PAT must belong to BOT_USER.
      # Prefer the CLASSIC PAT (required for `gh pr review --approve` —
      # fine-grained PATs fail addPullRequestReview), falling back to the
      # fine-grained DON_PETRY_BOT_GH_PAT when the classic secret is unset.
      GH_TOKEN: ${{ secrets.DON_PETRY_BOT_GH_PAT_CLASSIC || secrets.DON_PETRY_BOT_GH_PAT }}
      # Single bot identity. DON_PETRY_BOT_GH_PAT authenticates as BOT_USER; that
      # account owns/has-access-to the personal repos scanned by list-prs.sh,
      # signs the cascade's escalation comments, and is filtered out of the
      # candidate queue (it can't approve its own PRs). Human reviewers are
      # routed via CODEOWNERS at escalation time, not pinned via env.
      BOT_USER: ${{ vars.BOT_USER || 'donpetry-bot' }}
      TARGET_ORG: ${{ vars.TARGET_ORG || 'petry-projects' }}
      AGENT_REPO: ${{ github.repository }}
      # Review engine: "claude" or "copilot". Controls which CLI and models are used.
      REVIEW_ENGINE: ${{ vars.REVIEW_ENGINE || 'claude' }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      # Copilot engine reuses GH_PAT (a separate user PAT with Copilot subscription).
      COPILOT_GITHUB_TOKEN: ${{ secrets.GH_PAT }}
      # Gemini engine auth — GOOGLE_API_KEY is the secret name; newer Gemini CLI
      # versions expect GEMINI_API_KEY so we expose the same value under both names.
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      GEMINI_CLI_TRUST_WORKSPACE: "true"
      # Event-triggered runs respect LIVE_MODE (same semantics as the former schedule).
      # repository_dispatch (mention) always runs live.
      # workflow_dispatch respects the dry_run input.
      DRY_RUN: ${{ github.event_name == 'repository_dispatch' && 'false' || inputs.dry_run || (vars.LIVE_MODE == 'true' && 'false' || 'true') }}
      # PR URL to review. Populated from inputs (workflow_dispatch), client_payload
      # (repository_dispatch), or the PR context for event-triggered runs.
      # check_suite events may have multiple PRs; those are handled separately via
      # CHECK_SUITE_PRS in the "Enumerate candidate PRs" step.
      PR_URL_OVERRIDE: >-
        ${{
          inputs.pr_url
          || github.event.client_payload.pr_url
          || github.event.pull_request.html_url
          || ''
        }}
      # JSON array of PRs associated with a check_suite event. Empty for all
      # other event types. Consumed by "Enumerate candidate PRs" to extract URLs.
      CHECK_SUITE_PRS: >-
        ${{
          github.event_name == 'check_suite'
          && toJSON(github.event.check_suite.pull_requests)
          || '[]'
        }}
      DELEGATION_ORGS: ${{ vars.DELEGATION_ORGS || vars.CLAUDE_ORGS || '' }}
      MAX_REVIEW_CYCLES: ${{ vars.MAX_REVIEW_CYCLES || '3' }}
      MAX_PRS: ${{ vars.MAX_PRS || '10' }}
      CANDIDATE_LIMIT: ${{ vars.CANDIDATE_LIMIT || '250' }}
      # Opt-in GitHub MCP review (issue #679 / pilot #681). REVIEW_MCP_CONFIG
      # auto-defaults in engine.sh to the committed .github/review-mcp.json when
      # present (do NOT set it here — an empty value would disable that default).
      # The configured MCP tools must be allow-listed or the CLI connects the
      # server yet blocks the tool calls ("not permitted"); set the repo variable
      # REVIEW_MCP_ALLOWED_TOOLS (e.g. `mcp__github__*`) to permit them.
      REVIEW_MCP_ALLOWED_TOOLS: ${{ vars.REVIEW_MCP_ALLOWED_TOOLS || '' }}
      # Diagnostics opt-in: set repo variable REVIEW_MCP_DEBUG=1 to log the MCP
      # server handshake (`--debug mcp`) and surface a ::notice:: for a healthy
      # connection. Off by default; never changes the review verdict.
      REVIEW_MCP_DEBUG: ${{ vars.REVIEW_MCP_DEBUG || '' }}
      # Downstream-impact pass (epic #748 / discussion #653): annotate a review
      # with the consumer repos that pin a shared surface the PR changes. Enabled
      # by default here; set the repo variable DOWNSTREAM_IMPACT_ENABLED=false to
      # kill-switch it without a code change. Operator guide:
      # docs/pr-review-agent/downstream-impact.md.
      DOWNSTREAM_IMPACT_ENABLED: ${{ vars.DOWNSTREAM_IMPACT_ENABLED || 'true' }}
      # Pin via vars.CLAUDE_CODE_VERSION for fully reproducible caching; default
      # 'latest' caches an install indefinitely under that key — flush via the
      # Actions cache UI or bump the variable to pick up new releases.
      CLAUDE_CODE_VERSION: ${{ vars.CLAUDE_CODE_VERSION || 'latest' }}
      # Mention-triggered reviews always force a re-review; all other triggers
      # respect the idempotency check (no double-reviews on the same head SHA).
      TOKEN_LOG_FILE: /tmp/token-usage-${{ github.run_id }}.jsonl
      TOKEN_WORKFLOW: pr-review
      FORCE_REVIEW: ${{ github.event_name == 'repository_dispatch' && 'true' || inputs.force_review || 'false' }}

    steps:
      - name: Checkout agent repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Cache claude-code CLI
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.npm-global
          key: claude-code-${{ env.CLAUDE_CODE_VERSION }}-${{ runner.os }}

      - name: Install review engine CLIs
        run: |
          set -euo pipefail
          gh auth status

          # Use a per-user prefix so actions/cache (above) can persist the
          # install across runs without needing root. Add the bin dir to PATH
          # for both this step and every subsequent step in the job.
          mkdir -p "$HOME/.npm-global"
          npm config set prefix "$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.npm-global/bin:$PATH"

          install_claude() {
            if command -v claude >/dev/null 2>&1; then
              echo "claude-code cache hit: $(claude --version)"
              return 0
            fi
            npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          }

          case "$REVIEW_ENGINE" in
            claude)
              install_claude
              # Best-effort install of fallbacks for duck/fallback support
              npm install -g @google/gemini-cli || true
              if ! command -v gemini >/dev/null 2>&1; then
                echo "::warning::gemini CLI unavailable — Gemini rate-limit fallback will be unavailable"
              fi
              if ! env GH_TOKEN="$COPILOT_GITHUB_TOKEN" gh copilot --version > /dev/null 2>&1; then
                echo "::warning::gh copilot built-in unavailable with user token — rate-limit fallback will be unavailable."
              fi
              ;;
            gemini)
              npm install -g @google/gemini-cli
              install_claude || true
              ;;
            copilot)
              # Best-effort install of copilot if built-in is missing
              if ! gh copilot --version > /dev/null 2>&1; then
                gh extension install github/gh-copilot || true
              fi
              install_claude || true
              npm install -g @google/gemini-cli || true
              if ! command -v gemini >/dev/null 2>&1; then
                echo "::warning::gemini CLI unavailable — Gemini duck review will be skipped"
              fi
              ;;
            *)
              echo "::error::Unknown REVIEW_ENGINE=$REVIEW_ENGINE"
              exit 1
              ;;
          esac

      - name: Verify auth
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_WORKFLOWS }}
        run: |
          set -euo pipefail

          if auth_status="$(gh auth status 2>&1)"; then
            :
          else
            auth_rc=$?
            printf '%s\n' "$auth_status"
            echo "::error::gh auth status failed"
            exit "$auth_rc"
          fi
          printf '%s\n' "$auth_status"

          # Fine-grained PATs are NOT supported — they fail at addPullRequestReview.
          # Two detection methods: (1) prefix in auth status output; (2) gh auth token
          # for gh versions that mask the prefix in status output (token never logged).
          _fgpat=0
          if grep -qi 'Token:.*github_pat_' <<< "$auth_status"; then
            _fgpat=1
          else
            _tok="$(gh auth token 2>/dev/null || true)"
            if [[ "${_tok:-}" == github_pat_* ]]; then
              _fgpat=1
            fi
            unset _tok
          fi
          if [[ "$_fgpat" -eq 1 ]]; then
            unset _fgpat
            echo "::error::Fine-grained PAT detected — fine-grained PATs are not supported by this workflow."
            echo "::error::Fine-grained PATs fail at addPullRequestReview (GraphQL: Resource not accessible by personal access token)."
            echo "::error::Replace DON_PETRY_BOT_GH_PAT with a classic PAT that has repo, workflow, and read:org scopes."
            echo "::error::See docs/pr-review-agent/setup.md → Troubleshooting for details."
            exit 1
          fi
          unset _fgpat

          scopes_line="$(grep 'Token scopes:' <<< "$auth_status" || true)"
          normalized_scopes="${scopes_line//,/ }"
          normalized_scopes="${normalized_scopes//$'\''/ }"

          if [ -z "$normalized_scopes" ] || grep -qiE '(cannot determine|fine.grained)' <<< "$auth_status"; then
            echo "::warning::Token scopes could not be determined. Skipping scope validation."
            echo "::warning::Ensure the token has: repo + read:org (classic PAT) or contents + pull_requests:write."
            exit 0
          fi

          if grep -qE "(^|[[:space:]])repo([[:space:]]|$)" <<< "$normalized_scopes"; then
            if ! grep -qE "(^|[[:space:]])read:org([[:space:]]|$)" <<< "$normalized_scopes"; then
              echo "::error::GH_TOKEN has 'repo' scope but is missing 'read:org'."
              echo "::error::PRs with team-based reviewers will fail at 'gh pr view --json reviewRequests'."
              echo "::error::Edit the classic PAT and check the 'read:org' box (no regeneration needed)."
              exit 1
            fi
          else
            if ! grep -qE "(^|[[:space:]])contents(:[^[:space:]]+)?([[:space:]]|$)" <<< "$normalized_scopes"; then
              echo "::error::GH_TOKEN is missing required scope: contents"
              echo "::error::Token must have either 'repo' + 'read:org' (classic) or 'contents' + 'pull_requests:write'"
              exit 1
            fi
            if ! grep -qE "(^|[[:space:]])pull_requests(:write)?([[:space:]]|$)" <<< "$normalized_scopes"; then
              echo "::error::GH_TOKEN is missing required scope: pull_requests with write access"
              echo "::error::Token must have either 'repo' + 'read:org' (classic) or 'contents' + 'pull_requests:write'"
              exit 1
            fi
          fi

      - name: Cache claude-code CLI
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.npm-global
          key: claude-code-${{ env.CLAUDE_CODE_VERSION }}-${{ runner.os }}

      - name: Verify auth scopes
        # Inlined from scripts/verify-auth-scopes.sh so this step is self-contained
        # when pr-review.yml is deployed to target repos that do not have the scripts/ dir.
        run: |
          set -euo pipefail

          if auth_status="$(gh auth status 2>&1)"; then
            :
          else
            auth_rc=$?
            printf '%s\n' "$auth_status"
            echo "::error::gh auth status failed"
            exit "$auth_rc"
          fi
          printf '%s\n' "$auth_status"

          # Fine-grained PATs are NOT supported — they fail at addPullRequestReview.
          # Two detection methods: (1) prefix in auth status output; (2) gh auth token
          # for gh versions that mask the prefix in status output (token never logged).
          _fgpat=0
          if grep -qi 'Token:.*github_pat_' <<< "$auth_status"; then
            _fgpat=1
          else
            _tok="$(gh auth token 2>/dev/null || true)"
            if [[ "${_tok:-}" == github_pat_* ]]; then
              _fgpat=1
            fi
            unset _tok
          fi
          if [[ "$_fgpat" -eq 1 ]]; then
            unset _fgpat
            echo "::error::Fine-grained PAT detected — fine-grained PATs are not supported by this workflow."
            echo "::error::Fine-grained PATs fail at addPullRequestReview (GraphQL: Resource not accessible by personal access token)."
            echo "::error::Replace DON_PETRY_BOT_GH_PAT with a classic PAT that has repo, workflow, and read:org scopes."
            echo "::error::See docs/pr-review-agent/setup.md → Troubleshooting for details."
            exit 1
          fi
          unset _fgpat

          scopes_line="$(grep 'Token scopes:' <<< "$auth_status" || true)"
          normalized_scopes="${scopes_line//,/ }"
          normalized_scopes="${normalized_scopes//$'\''/ }"

          if [ -z "$normalized_scopes" ] || grep -qiE '(cannot determine|fine.grained)' <<< "$auth_status"; then
            echo "::warning::Token scopes could not be determined. Skipping scope validation."
            echo "::warning::Ensure the token has: repo + read:org (classic PAT) or contents + pull_requests:write."
            exit 0
          fi

          if grep -qE "(^|[[:space:]])repo([[:space:]]|$)" <<< "$normalized_scopes"; then
            if ! grep -qE "(^|[[:space:]])read:org([[:space:]]|$)" <<< "$normalized_scopes"; then
              echo "::error::GH_TOKEN has 'repo' scope but is missing 'read:org'."
              echo "::error::PRs with team-based reviewers will fail at 'gh pr view --json reviewRequests'."
              echo "::error::Edit the classic PAT and check the 'read:org' box (no regeneration needed)."
              exit 1
            fi
          else
            if ! grep -qE "(^|[[:space:]])contents(:[^[:space:]]+)?([[:space:]]|$)" <<< "$normalized_scopes"; then
              echo "::error::GH_TOKEN is missing required scope: contents"
              echo "::error::Token must have either 'repo' + 'read:org' (classic) or 'contents' + 'pull_requests:write'"
              exit 1
            fi
            if ! grep -qE "(^|[[:space:]])pull_requests(:write)?([[:space:]]|$)" <<< "$normalized_scopes"; then
              echo "::error::GH_TOKEN is missing required scope: pull_requests with write access"
              echo "::error::Token must have either 'repo' + 'read:org' (classic) or 'contents' + 'pull_requests:write'"
              exit 1
            fi
          fi

      - name: Install review engine CLIs
        run: |
          set -euo pipefail

          # Use a per-user prefix so actions/cache (above) can persist the
          # install across runs without needing root. Add the bin dir to PATH
          # for both this step and every subsequent step in the job.
          mkdir -p "$HOME/.npm-global"
          npm config set prefix "$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.npm-global/bin:$PATH"

          npm_install_retry() {
            # npm_install_retry <package> [attempts=3] [delay_seconds=15]
            local package="$1"
            local attempts="${2:-3}"
            local delay="${3:-15}"
            local attempt=1
            while [ "$attempt" -le "$attempts" ]; do
              if npm install -g "$package"; then
                return 0
              fi
              if [ "$attempt" -lt "$attempts" ]; then
                echo "::warning::npm install failed for $package (attempt $attempt/$attempts); retrying in ${delay}s"
                sleep "$delay"
              fi
              attempt=$((attempt + 1))
            done
            return 1
          }

          install_claude() {
            if command -v claude >/dev/null 2>&1; then
              echo "claude-code cache hit: $(claude --version)"
              return 0
            fi
            npm_install_retry "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          }

          case "$REVIEW_ENGINE" in
            claude)
              install_claude
              # Best-effort install of fallbacks for duck/fallback support
              npm_install_retry "@google/gemini-cli" || true
              if ! command -v gemini >/dev/null 2>&1; then
                echo "::warning::gemini CLI unavailable — Gemini rate-limit fallback will be unavailable"
              fi
              if ! env GH_TOKEN="$COPILOT_GITHUB_TOKEN" gh copilot --version > /dev/null 2>&1; then
                echo "::warning::gh copilot built-in unavailable with user token — rate-limit fallback will be unavailable."
              fi
              ;;
            gemini)
              npm_install_retry "@google/gemini-cli"
              install_claude || true
              ;;
            copilot)
              # Best-effort install of copilot if built-in is missing
              if ! gh copilot --version > /dev/null 2>&1; then
                gh extension install github/gh-copilot || true
              fi
              install_claude || true
              npm_install_retry "@google/gemini-cli" || true
              if ! command -v gemini >/dev/null 2>&1; then
                echo "::warning::gemini CLI unavailable — Gemini duck review will be skipped"
              fi
              ;;
            *)
              echo "::error::Unknown REVIEW_ENGINE=$REVIEW_ENGINE"
              exit 1
              ;;
          esac

      # ── LSP-MCP review pilot (epic #839, story #842) ─────────────────────
      # Opt-in ONLY: runs when the repo variable LSP_PILOT_ENABLED == 'true'.
      # When off (the default) this step is skipped entirely, REVIEW_MCP_CONFIG
      # stays unset, and the review behaves byte-for-byte as today (the engine's
      # existing .github/review-mcp.json default is untouched). When on, the
      # script installs the pinned LSP-MCP candidate + bash-language-server and
      # threads the deep/audit-only MCP knobs into $GITHUB_ENV. A missing tool
      # degrades gracefully (::warning:: + skip) — it never fails the workflow.
      # Pins/candidate are overridable via repo variables; see docs/lsp-pilot.md.
      # Cache the LSP toolchain/index across ephemeral runs (story #846) so a warm
      # run restores under the 30s cold-start SLA instead of re-installing. Keyed on
      # OS + candidate + pinned tool versions + a hash of the indexed Shell sources
      # (the "relevant lockfile" for a Shell-only index). SHA-pinned to the same
      # actions/cache the Claude CLI cache above uses. Opt-in behind LSP_PILOT_ENABLED;
      # its cache-hit output is threaded into the setup step for the cold-start metric.
      - name: Cache LSP index
        id: lsp-cache
        if: ${{ vars.LSP_PILOT_ENABLED == 'true' }}
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.local
          key: lsp-pilot-${{ runner.os }}-${{ vars.LSP_CANDIDATE || 'agent-lsp' }}-${{ vars.AGENT_LSP_VERSION || 'v0.15.0' }}-bls${{ vars.BASH_LANGUAGE_SERVER_VERSION || '5.6.0' }}-${{ hashFiles('scripts/**/*.sh', '**/package-lock.json') }}
          restore-keys: |
            lsp-pilot-${{ runner.os }}-${{ vars.LSP_CANDIDATE || 'agent-lsp' }}-${{ vars.AGENT_LSP_VERSION || 'v0.15.0' }}-bls${{ vars.BASH_LANGUAGE_SERVER_VERSION || '5.6.0' }}-

      - name: Set up LSP pilot servers (opt-in)
        if: ${{ vars.LSP_PILOT_ENABLED == 'true' }}
        env:
          LSP_CANDIDATE: ${{ vars.LSP_CANDIDATE || 'agent-lsp' }}
          AGENT_LSP_VERSION: ${{ vars.AGENT_LSP_VERSION || 'v0.15.0' }}
          BASH_LANGUAGE_SERVER_VERSION: ${{ vars.BASH_LANGUAGE_SERVER_VERSION || '5.6.0' }}
          LSP_INDEX_CACHE_HIT: ${{ steps.lsp-cache.outputs.cache-hit }}
        run: bash scripts/setup-lsp-pilot.sh

      - name: Enumerate candidate PRs
        run: |
          set -euo pipefail
          if [ -n "${PR_URL_OVERRIDE}" ]; then
            # Single-PR mode: workflow_dispatch with pr_url, repository_dispatch
            # (mention), or event-triggered run with a direct PR context
            # (pull_request_review / pull_request events).
            printf '%s\n' "${PR_URL_OVERRIDE}" > prs.txt
          elif [ "${CHECK_SUITE_PRS}" != "[]" ] && [ -n "${CHECK_SUITE_PRS}" ]; then
            # check_suite event: one or more PRs share the completed suite.
            # The payload carries API URLs (https://api.github.com/repos/…/pulls/N);
            # convert them to HTML URLs (https://github.com/…/pull/N) for review-one-pr.sh.
            echo "${CHECK_SUITE_PRS}" \
              | jq -r '.[].url' \
              | sed 's|https://api\.github\.com/repos/|https://github.com/|; s|/pulls/|/pull/|' \
              > prs.txt
          else
            bash scripts/list-prs.sh > prs.txt
          fi
          count=$(grep -c . prs.txt || true)
          echo "::notice::Candidate pool has $count PRs (no-ops will be skipped, MAX_PRS caps actual reviews)"
          echo "--- candidate PRs ---"
          cat prs.txt || true

      - name: Review each PR (cascade)
        run: bash scripts/review-batch.sh

      - name: Upload token usage log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: token-usage-${{ github.run_id }}
          path: /tmp/token-usage-${{ github.run_id }}.jsonl
          if-no-files-found: ignore
          retention-days: 30
