name: Dev-Lead Agent (Reusable)

on:
  workflow_call:
    inputs:
      event_name:
        description: "GitHub event name (passed by caller for ci-relay routing)"
        type: string
        required: false
        default: ""
      agent_ref:
        # Ref of petry-projects/.github-private to check out for the dev-lead
        # scripts. A trigger-stub caller passes its pinned channel (dev-lead/stable)
        # so the agent runs at the pinned version, not main — the self-host pin
        # (#535/#506). Defaults to "main" → unchanged behaviour.
        description: "Ref of petry-projects/.github-private to check out for dev-lead scripts"
        type: string
        required: false
        default: "main"
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
      GH_PAT_DON_PETRY:
        # don-petry's write/workflows PAT (the account dev-lead commits/pushes as).
        # Canonical name under the GH_PAT_<ACCOUNT> schema; supersedes GH_PAT_WORKFLOWS,
        # which is kept below as a transition fallback.
        required: false
      GH_PAT_WORKFLOWS:
        # DEPRECATED alias of GH_PAT_DON_PETRY — kept during the rename migration so
        # callers that haven't set the new secret yet still authenticate. Remove once
        # GH_PAT_DON_PETRY is confirmed everywhere.
        # Required for cross-repo callers: the default github.token cannot read
        # petry-projects/.github-private from another repo. Callers must pass a
        # PAT that has read access to petry-projects/.github-private.
        required: false
      GOOGLE_API_KEY:
        required: false
      GH_PAT_DON_PETRY_COPILOT:
        # don-petry's Copilot-subscription PAT (Copilot review engine). Canonical
        # name; supersedes GH_PAT, kept below as a transition fallback.
        required: false
      GH_PAT:
        # DEPRECATED alias of GH_PAT_DON_PETRY_COPILOT — kept during migration.
        required: false

permissions: {}

# ── concurrency ───────────────────────────────────────────────────────────────
# Centralised here (single source of truth) so caller stubs no longer carry —
# and can no longer drift into — their own concurrency group. Separate per-issue
# and per-PR lanes ensure issue pickups are NEVER cancelled by unrelated PR
# follow-up traffic (reviews, comments, ci-relay) — the root cause of issue
# pickups being cancelled before they could open a PR. See petry-projects/.github#402.
#
# Routing (first match wins):
#   check_run                        -> dev-lead-ci-relay-<sha>  (per-SHA relay lane)
#   pull_request / *_review[_comment]-> dev-lead-pr-<n>          (PR lane)
#   issue_comment on a PR            -> dev-lead-pr-<n>           (issue.pull_request set;
#                                                                 avoids issue#/PR# collision)
#   issues / issue_comment on issue  -> dev-lead-issue-<n>       (issue lane)
#   repository_dispatch (ci-failure) -> dev-lead-pr-<n>          (client_payload.pr_number)
#   repository_dispatch (issue-retry)-> dev-lead-issue-<n>       (client_payload.issue_number)
#   anything else                    -> dev-lead-run-<run_id>    (unique; never cancelled)
#
# cancel-in-progress is false: a newer same-lane event queues behind the active
# run rather than killing it, so an in-flight pickup always finishes.
concurrency:
  group: >-
    ${{
      (github.event_name == 'check_run' && format('dev-lead-ci-relay-{0}', github.event.check_run.head_sha))
      || (github.event.pull_request.number && format('dev-lead-pr-{0}', github.event.pull_request.number))
      || (github.event.issue.pull_request && format('dev-lead-pr-{0}', github.event.issue.number))
      || (github.event.issue.number && format('dev-lead-issue-{0}', github.event.issue.number))
      || (github.event.client_payload.pr_number && format('dev-lead-pr-{0}', github.event.client_payload.pr_number))
      || (github.event.client_payload.issue_number && format('dev-lead-issue-{0}', github.event.client_payload.issue_number))
      || format('dev-lead-run-{0}', github.run_id)
    }}
  cancel-in-progress: false

jobs:
  # ── dispatch ────────────────────────────────────────────────────────────────
  # Handles all events except check_run (which is routed by the caller).
  # 1. Checks out .github-private scripts/prompts into .dev-lead/
  # 2. Runs dev-lead-intent.sh to classify the event into an intent.
  # 3. Routes to the appropriate handler based on intent.
  dispatch:
    # Skip Dependabot-triggered events (#864): a Dependabot `pull_request` run has no
    # access to GH_PAT_WORKFLOWS, so the cross-repo dev-lead scripts checkout fails at
    # startup — before dev-lead-intent.sh can classify the event (which already resolves
    # a bot-authored PR to intent=skip, reason=bot-pr; see tests/dev-lead/e2e/scenarios/
    # 01-skip-bot-pr.sh). Guarding at the job level skips cleanly before that checkout.
    # dev-lead is not a required check, and dependabot-automerge handles these PRs.
    if: >-
      github.actor != 'dependabot[bot]' &&
      ((inputs.event_name == '' && github.event_name != 'check_run') ||
       (inputs.event_name != '' && inputs.event_name != 'check_run'))
    runs-on: ubuntu-latest
    # Job backstop for a hung/stuck run — NOT a cost control (#1017, epic #901).
    # 120 min gives legitimately large issues room to finish across all engine
    # tiers before the backstop fires (GitHub's hard cap is 360/job). The
    # effective per-tier defaults live in engine.sh; scripts/dev-lead-timeout-
    # guardrail.sh asserts Σ(per-tier budgets)+overhead ≤ this value so tiers can
    # never silently blow past the backstop. DEEP_TIMEOUT_SEC / ACTION_TIMEOUT_SEC
    # below still pass caller `vars` overrides through; the default is in engine.sh.
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      checks: read
      statuses: read
    env:
      # dev-lead's acting identity is DECLARED in personas/dev-lead/persona.yml
      # (runtime.identity.account) and resolved into BOT_USER by the "Resolve
      # persona identity" step below. This job-level value is the hardcoded
      # fail-safe default (don-petry) used only if that step cannot read the
      # manifest. It does NOT consult vars.BOT_USER — that shared variable is
      # what caused the donpetry-bot regression (#1316); the manifest is now the
      # sole source of truth. See scripts/lib/resolve-persona-identity.sh.
      BOT_USER: 'don-petry'
      TRUSTED_BOTS: ${{ vars.TRUSTED_BOTS || 'copilot-pull-request-reviewer[bot],gemini-code-assist[bot],sonarqubecloud[bot],coderabbitai[bot],chatgpt-codex-connector[bot]' }}
      TRIGGER_PHRASES: ${{ vars.TRIGGER_PHRASES || '@dev-lead' }}
      DEV_LEAD_ENGINE: ${{ vars.DEV_LEAD_ENGINE || 'claude' }}
      DEV_LEAD_DRY_RUN: ${{ vars.DEV_LEAD_DRY_RUN || 'false' }}
      DEEP_TIMEOUT_SEC: ${{ vars.DEEP_TIMEOUT_SEC || '' }}
      ACTION_TIMEOUT_SEC: ${{ vars.ACTION_TIMEOUT_SEC || '' }}
      GH_TOKEN: ${{ secrets.GH_PAT_DON_PETRY || secrets.GH_PAT_WORKFLOWS || github.token }}
      GEMINI_CLI_TRUST_WORKSPACE: "true"
      DEV_LEAD_SCRIPTS: .dev-lead/scripts
      DEV_LEAD_PROMPTS: .dev-lead/prompts/dev-lead
      TOKEN_LOG_FILE: /tmp/token-usage-${{ github.run_id }}.jsonl
      TOKEN_WORKFLOW: dev-lead

    steps:
      - name: Checkout caller repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          token: ${{ secrets.GH_PAT_DON_PETRY || secrets.GH_PAT_WORKFLOWS || github.token }}

      - name: Checkout dev-lead scripts
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: petry-projects/.github-private
          # Pinned channel (e.g. dev-lead/stable) when a trigger stub passes it;
          # defaults to "main" → unchanged behaviour (#535/#506).
          ref: ${{ inputs.agent_ref }}
          path: .dev-lead
          # Cross-repo callers: github.token cannot read a private org repo — ensure
          # GH_PAT_WORKFLOWS is set as an org or repo secret in the calling repo.
          token: ${{ secrets.GH_PAT_DON_PETRY || secrets.GH_PAT_WORKFLOWS || github.token }}
          sparse-checkout: |
            scripts
            prompts/dev-lead
            personas/dev-lead

      - name: Protect dev-lead scripts from accidental git staging
        run: echo ".dev-lead/" >> .gitignore

      - name: Revert .gitignore changes before git operations
        run: |
          git checkout .gitignore || true
          echo ".dev-lead/" >> .git/info/exclude

      - name: Resolve persona identity
        # Source of truth for who dev-lead acts as: personas/dev-lead/persona.yml
        # (runtime.identity.account). Exporting BOT_USER here overrides the job-env
        # fallback for every later step — intent classification, git-identity, and
        # the commit/push. On resolve failure we keep the job default (don-petry)
        # and warn, rather than silently reverting to the shared machine user.
        run: |
          if account="$(bash .dev-lead/scripts/lib/resolve-persona-identity.sh dev-lead .dev-lead/personas account)"; then
            echo "BOT_USER=$account" >> "$GITHUB_ENV"
            echo "resolved dev-lead identity: BOT_USER=$account"
          else
            echo "::warning::could not resolve dev-lead identity from manifest; using fallback BOT_USER=$BOT_USER"
          fi

      - name: Classify event intent
        id: intent
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.GH_PAT_DON_PETRY_COPILOT || secrets.GH_PAT }}
        run: bash .dev-lead/scripts/dev-lead-intent.sh

      - name: Log intent
        run: |
          echo "::notice::intent=$INTENT_TYPE reason=$INTENT_REASON"

      - name: Parse intent context fields
        run: |
          ctx="${INTENT_CONTEXT:-{\}}"
          echo "INTENT_PR_NUMBER=$(echo "$ctx"    | jq -r '.pr_number // ""')"    >> "$GITHUB_ENV"
          echo "INTENT_HEAD_SHA=$(echo "$ctx"     | jq -r '.head_sha // ""')"     >> "$GITHUB_ENV"
          echo "INTENT_CHECKS=$(echo "$ctx"       | jq -c '.checks // []')"       >> "$GITHUB_ENV"
          echo "INTENT_ISSUE_NUMBER=$(echo "$ctx" | jq -r '.issue_number // ""')" >> "$GITHUB_ENV"
          echo "INTENT_ACTOR=$(echo "$ctx"        | jq -r '.actor // ""')"        >> "$GITHUB_ENV"
          # INTENT_BODY is free text (review/comment bodies) and is frequently
          # multiline — e.g. CodeRabbit reviews. A plain `KEY=value` write spills
          # the 2nd+ lines into $GITHUB_ENV as invalid entries and fails the step
          # ("Unable to process file command 'env'"). Use the heredoc form with a
          # RANDOM delimiter so newlines are preserved and a crafted body cannot
          # inject extra env vars by embedding the delimiter (it is unguessable).
          body_delim="INTENT_BODY_EOF_$(openssl rand -hex 16)"
          {
            printf 'INTENT_BODY<<%s\n' "$body_delim"
            echo "$ctx" | jq -r '.body // ""'
            printf '%s\n' "$body_delim"
          } >> "$GITHUB_ENV"

      - name: Skip — log reason
        if: env.INTENT_TYPE == 'skip'
        run: |
          echo "::notice::Skipping event: $INTENT_REASON"

      - name: Pre-flight checks
        if: env.INTENT_TYPE != 'skip' && env.INTENT_TYPE != 'enable-auto-merge'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_PAT_WORKFLOWS: ${{ secrets.GH_PAT_DON_PETRY || secrets.GH_PAT_WORKFLOWS }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT_DON_PETRY_COPILOT || secrets.GH_PAT }}
        run: bash .dev-lead/scripts/dev-lead-preflight.sh

      # ── Install engine CLIs ───────────────────────────────────────────────
      - name: Cache claude-code CLI
        if: env.INTENT_TYPE != 'skip' && env.INTENT_TYPE != 'enable-auto-merge'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.npm-global
          key: claude-code-${{ vars.CLAUDE_CODE_VERSION || 'latest' }}-${{ runner.os }}

      - name: Install engine CLIs
        if: env.INTENT_TYPE != 'skip' && env.INTENT_TYPE != 'enable-auto-merge'
        env:
          CLAUDE_CODE_VERSION: ${{ vars.CLAUDE_CODE_VERSION || 'latest' }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.npm-global"
          npm config set prefix "$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.npm-global/bin:$PATH"

          if ! command -v claude >/dev/null 2>&1; then
            npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          fi

          case "$DEV_LEAD_ENGINE" in
            claude)
              npm install -g @google/gemini-cli || true
              if ! gh copilot --version >/dev/null 2>&1; then
                gh extension install github/gh-copilot || true
              fi ;;
            gemini)
              npm install -g @google/gemini-cli || true
              if ! gh copilot --version >/dev/null 2>&1; then
                gh extension install github/gh-copilot || true
              fi ;;
            copilot)
              npm install -g @google/gemini-cli || true
              if ! gh copilot --version >/dev/null 2>&1; then
                gh extension install github/gh-copilot || true
              fi ;;
          esac

      # ── fix-ci ────────────────────────────────────────────────────────────
      - name: Run fix-ci
        if: env.INTENT_TYPE == 'fix-ci'
        env:
          PR_NUMBER: ${{ env.INTENT_PR_NUMBER }}
          HEAD_SHA: ${{ env.INTENT_HEAD_SHA }}
          CHECKS_JSON: ${{ env.INTENT_CHECKS }}
          REPO: ${{ github.repository }}
          REVIEW_ENGINE: ${{ env.DEV_LEAD_ENGINE }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.GH_PAT_DON_PETRY_COPILOT || secrets.GH_PAT }}
          PROMPTS_DIR: .dev-lead/prompts/dev-lead
        run: |
          bash .dev-lead/scripts/dev-lead-fix-ci.sh || rc=$?
          [ "${rc:-0}" -eq 2 ] && exit 0
          exit "${rc:-0}"

      # ── fix-reviews ───────────────────────────────────────────────────────
      - name: Run fix-reviews
        if: env.INTENT_TYPE == 'fix-reviews'
        env:
          PR_NUMBER: ${{ env.INTENT_PR_NUMBER }}
          HEAD_SHA: ${{ env.INTENT_HEAD_SHA }}
          REPO: ${{ github.repository }}
          REVIEW_ENGINE: ${{ env.DEV_LEAD_ENGINE }}
          TRIGGERING_REVIEWER: ${{ env.INTENT_ACTOR }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.GH_PAT_DON_PETRY_COPILOT || secrets.GH_PAT }}
          PROMPTS_DIR: .dev-lead/prompts/dev-lead
        run: |
          bash .dev-lead/scripts/dev-lead-fix-reviews.sh || rc=$?
          [ "${rc:-0}" -eq 2 ] && exit 0
          exit "${rc:-0}"

      # ── fix-bot-comment ───────────────────────────────────────────────────
      - name: Run fix-bot-comment
        if: env.INTENT_TYPE == 'fix-bot-comment'
        env:
          PR_NUMBER: ${{ env.INTENT_PR_NUMBER }}
          HEAD_SHA: ${{ env.INTENT_HEAD_SHA }}
          REPO: ${{ github.repository }}
          REVIEW_ENGINE: ${{ env.DEV_LEAD_ENGINE }}
          COMMENT_BODY: ${{ env.INTENT_BODY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.GH_PAT_DON_PETRY_COPILOT || secrets.GH_PAT }}
          PROMPTS_DIR: .dev-lead/prompts/dev-lead
        run: |
          bash .dev-lead/scripts/dev-lead-fix-reviews.sh || rc=$?
          [ "${rc:-0}" -eq 2 ] && exit 0
          exit "${rc:-0}"

      # ── on-mention ─────────────────────────────────────────────────────────────
      - name: Run on-mention
        if: env.INTENT_TYPE == 'on-mention'
        env:
          PR_NUMBER: ${{ env.INTENT_PR_NUMBER }}
          HEAD_SHA: ${{ env.INTENT_HEAD_SHA }}
          REPO: ${{ github.repository }}
          REVIEW_ENGINE: ${{ env.DEV_LEAD_ENGINE }}
          USER_INSTRUCTION: ${{ env.INTENT_BODY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.GH_PAT_DON_PETRY_COPILOT || secrets.GH_PAT }}
          PROMPTS_DIR: .dev-lead/prompts/dev-lead
        run: |
          bash .dev-lead/scripts/dev-lead-fix-reviews.sh || rc=$?
          [ "${rc:-0}" -eq 2 ] && exit 0
          exit "${rc:-0}"

      # ── review-changes ──────────────────────────────────────────────────────────
      - name: Run review-changes
        if: env.INTENT_TYPE == 'review-changes'
        env:
          PR_NUMBER: ${{ env.INTENT_PR_NUMBER }}
          HEAD_SHA: ${{ env.INTENT_HEAD_SHA }}
          REPO: ${{ github.repository }}
          REVIEW_ENGINE: ${{ env.DEV_LEAD_ENGINE }}
          ACTOR: ${{ env.INTENT_ACTOR }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.GH_PAT_DON_PETRY_COPILOT || secrets.GH_PAT }}
          PROMPTS_DIR: .dev-lead/prompts/dev-lead
        run: |
          bash .dev-lead/scripts/dev-lead-fix-reviews.sh || rc=$?
          [ "${rc:-0}" -eq 2 ] && exit 0
          exit "${rc:-0}"

      # ── issue ─────────────────────────────────────────────────────────────
      - name: Run issue
        if: env.INTENT_TYPE == 'issue'
        env:
          ISSUE_NUMBER: ${{ env.INTENT_ISSUE_NUMBER }}
          REPO: ${{ github.repository }}
          REVIEW_ENGINE: ${{ env.DEV_LEAD_ENGINE }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.GH_PAT_DON_PETRY_COPILOT || secrets.GH_PAT }}
          PROMPTS_DIR: .dev-lead/prompts/dev-lead
        run: |
          bash .dev-lead/scripts/dev-lead-fix-issue.sh || rc=$?
          [ "${rc:-0}" -eq 2 ] && exit 0
          exit "${rc:-0}"

      # ── rebase ────────────────────────────────────────────────────────────
      - name: Run rebase
        if: env.INTENT_TYPE == 'rebase'
        env:
          PR_NUMBER: ${{ env.INTENT_PR_NUMBER }}
          REPO: ${{ github.repository }}
          REVIEW_ENGINE: ${{ env.DEV_LEAD_ENGINE }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.GH_PAT_DON_PETRY_COPILOT || secrets.GH_PAT }}
          PROMPTS_DIR: .dev-lead/prompts/dev-lead
        run: |
          bash .dev-lead/scripts/dev-lead-fix-reviews.sh || rc=$?
          [ "${rc:-0}" -eq 2 ] && exit 0
          exit "${rc:-0}"

      # ── enable-auto-merge ─────────────────────────────────────────────────
      # Triggered when a trusted bot approves a PR. Skips engine install and
      # pre-flight — just checks reviewDecision and enables auto-merge if APPROVED.
      - name: Enable auto-merge on bot approval
        if: env.INTENT_TYPE == 'enable-auto-merge' && env.INTENT_PR_NUMBER != ''
        env:
          PR_NUMBER: ${{ env.INTENT_PR_NUMBER }}
          HEAD_SHA: ${{ env.INTENT_HEAD_SHA }}
          REPO: ${{ github.repository }}
        run: bash .dev-lead/scripts/dev-lead-fix-reviews.sh

      - name: Upload token usage log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: token-usage-${{ github.run_id }}
          path: /tmp/token-usage-${{ github.run_id }}.jsonl
          if-no-files-found: ignore
          retention-days: 30

  # ── ci-relay ──────────────────────────────────────────────────────────────────
  # Handles check_run completed failure events. No LLM — resolves PR number and
  # fires repository_dispatch dev-lead-ci-failure back to the calling repo.
  ci-relay:
    if: >-
      github.event_name == 'check_run' &&
      github.event.action == 'completed' &&
      github.event.check_run.conclusion == 'failure' &&
      !startsWith(github.event.check_run.name, 'dev-lead / ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Check for associated non-fork PR
        id: check-pr
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_DON_PETRY || secrets.GH_PAT_WORKFLOWS || github.token }}
          CHECK_RUN_PRS: ${{ toJson(github.event.check_run.pull_requests) }}
          CHECK_RUN_HEAD_SHA: ${{ github.event.check_run.head_sha }}
          REPO_FULL_NAME: ${{ github.repository }}
        run: |
          set -euo pipefail
          pr_count=$(echo "$CHECK_RUN_PRS" | jq 'length')
          if [ "$pr_count" -eq 0 ]; then
            # GitHub App check_runs (SonarCloud, external CodeQL gates, etc.) do not
            # populate check_run.pull_requests. Fall back to the commits-to-pulls API.
            echo "::notice::check_run.pull_requests is empty — trying commits-to-pulls API fallback for SHA ${CHECK_RUN_HEAD_SHA}"
            pulls_json=$(gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/${REPO_FULL_NAME}/commits/${CHECK_RUN_HEAD_SHA}/pulls" 2>/dev/null || echo "[]")
            open_pulls=$(echo "$pulls_json" | jq '[.[] | select(.state=="open")]')
            pr_count=$(echo "$open_pulls" | jq 'length')
            if [ "$pr_count" -eq 0 ]; then
              echo "::notice::No open PRs found for commit ${CHECK_RUN_HEAD_SHA} — skipping relay"
              echo "should_relay=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            head_repo_full=$(echo "$open_pulls" | jq -r '.[0].head.repo.full_name // empty')
            if [ -n "$head_repo_full" ] && [ "$head_repo_full" != "$REPO_FULL_NAME" ]; then
              echo "::notice::Commit ${CHECK_RUN_HEAD_SHA} belongs to fork (${head_repo_full}) — skipping relay"
              echo "should_relay=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            pr_number=$(echo "$open_pulls" | jq -r '.[0].number')
            echo "should_relay=true" >> "$GITHUB_OUTPUT"
            echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          head_repo_url=$(echo "$CHECK_RUN_PRS" | jq -r '.[0].head.repo.url // empty')
          expected_url="https://api.github.com/repos/${REPO_FULL_NAME}"
          if [ -n "$head_repo_url" ] && [ "$head_repo_url" != "$expected_url" ]; then
            echo "::notice::check_run is from a fork — skipping relay"
            echo "should_relay=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pr_number=$(echo "$CHECK_RUN_PRS" | jq -r '.[0].number')
          echo "should_relay=true" >> "$GITHUB_OUTPUT"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Emit repository_dispatch dev-lead-ci-failure
        if: steps.check-pr.outputs.should_relay == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_DON_PETRY || secrets.GH_PAT_WORKFLOWS || github.token }}
          RELAY_PR_NUMBER: ${{ steps.check-pr.outputs.pr_number }}
          RELAY_HEAD_SHA: ${{ github.event.check_run.head_sha }}
          RELAY_REPO: ${{ github.repository }}
          RELAY_CHECK_ID: ${{ github.event.check_run.id }}
          RELAY_CHECK_NAME: ${{ github.event.check_run.name }}
          RELAY_CONCLUSION: ${{ github.event.check_run.conclusion }}
          RELAY_DETAILS_URL: ${{ github.event.check_run.details_url }}
          RELAY_APP_SLUG: ${{ github.event.check_run.app.slug }}
        run: |
          set -euo pipefail
          payload=$(jq -n \
            --argjson pr_number "$RELAY_PR_NUMBER" \
            --arg head_sha "$RELAY_HEAD_SHA" \
            --arg repo "$RELAY_REPO" \
            --argjson check_id "$RELAY_CHECK_ID" \
            --arg name "$RELAY_CHECK_NAME" \
            --arg conclusion "$RELAY_CONCLUSION" \
            --arg details_url "$RELAY_DETAILS_URL" \
            --arg app_slug "$RELAY_APP_SLUG" \
            '{event_type:"dev-lead-ci-failure",client_payload:{pr_number:$pr_number,head_sha:$head_sha,repo:$repo,checks:[{id:$check_id,name:$name,conclusion:$conclusion,details_url:$details_url,app_slug:$app_slug}]}}')
          echo "$payload" | gh api \
            --method POST "repos/$RELAY_REPO/dispatches" --input -
          echo "::notice::Relayed CI failure for PR $RELAY_PR_NUMBER"
