name: Test AW Workflows

on:
  pull_request:
    paths:
      - 'tests/aw/**'
      - 'docs/aw/**'
      - 'scripts/aw-*.sh'
      - 'scripts/aw.sh'
      - '.github/workflows/docs-health-check.yml'
      - '.github/workflows/dependency-advisory.yml'
      - '.github/workflows/standards-sync.yml'
      - '.github/workflows/content-twin-audit.yml'
      - '.github/workflows/issue-triage.md'
      - '.github/workflows/issue-triage-runner.yml'
      - '.github/workflows/test-aw.yml'
  push:
    branches: [main]
    paths:
      - 'tests/aw/**'
      - 'docs/aw/**'
      - 'scripts/aw-*.sh'
      - 'scripts/aw.sh'
      - '.github/workflows/issue-triage.md'
      - '.github/workflows/issue-triage-runner.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate-specs:
    name: Validate AW specs, docs, and workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Install PyYAML
        run: pip install "pyyaml==6.0.3" --only-binary=":all:" --quiet

      - name: Run spec validator
        run: bash tests/aw/validate-specs.sh

      - name: Structural tests (test-aw.yml install resilience guard)
        run: bash tests/aw/test_test_aw_yml.sh

  shellcheck-aw-scripts:
    name: shellcheck aw-*.sh scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: shellcheck
        run: |
          # SC2016: single-quoted strings with $vars inside heredocs are intentional
          shellcheck --severity=warning scripts/aw-docs-health-check.sh \
            scripts/aw-dependency-advisory.sh \
            scripts/aw-standards-sync.sh \
            scripts/aw-content-twin-audit.sh

  test-issue-triage:
    name: Test issue-triage (aw.sh unit + runner YAML structure)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Install PyYAML
        run: pip install "pyyaml==6.0.3" --only-binary=":all:" --quiet

      - name: Unit tests (skip guard + safe-output validation)
        run: bash tests/aw/issue-triage/test_aw_run.sh

      - name: Structural tests (runner YAML regression guard)
        run: bash tests/aw/issue-triage/test_runner_yml.sh
