name: Force Deploy pr-review.yml

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        repo: [bmad-bgreat-suite, google-app-scripts]
      max-parallel: 1

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Deploy pr-review.yml to ${{ matrix.repo }} via Actions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ matrix.repo }}
        run: |
          # Clone target repo
          git clone "https://$GITHUB_TOKEN@github.com/petry-projects/$REPO.git" target_repo
          cd target_repo

          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Copy pr-review.yml
          mkdir -p .github/workflows
          cp ../.github/workflows/pr-review.yml .github/workflows/

          # Commit and push
          git add .github/workflows/pr-review.yml
          if git commit -m "deploy: add pr-review.yml workflow [skip ci]"; then
            git push origin HEAD:main && echo "✅ Pushed to main" || echo "⚠️ Push failed"
          else
            echo "ℹ️ Nothing to commit"
          fi
