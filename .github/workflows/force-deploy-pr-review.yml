name: Force Deploy pr-review.yml

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        repo: [bmad-bgreat-suite, google-app-scripts]
      max-parallel: 1

    steps:
      - uses: actions/checkout@v6

      - name: Deploy to ${{ matrix.repo }}
        run: |
          mkdir -p temp_repo
          cd temp_repo

          git clone https://${{ secrets.GITHUB_TOKEN }}@github.com/petry-projects/${{ matrix.repo }}.git
          cd ${{ matrix.repo }}

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Copy pr-review.yml and verify-auth-scopes.sh
          mkdir -p .github/workflows scripts
          cp ../.github/workflows/pr-review.yml .github/workflows/
          cp ../scripts/verify-auth-scopes.sh scripts/

          # Commit and push
          git add .github/workflows/pr-review.yml scripts/verify-auth-scopes.sh
          if git commit -m "deploy: add pr-review.yml workflow and verify-auth-scopes.sh [skip ci]"; then
            git push origin HEAD:main && echo "✅ Pushed to main" || echo "⚠️ Push failed"
          else
            echo "ℹ️ Nothing to commit"
          fi
