# ─────────────────────────────────────────────────────────────────────────────
# Auto-rebase retry — self-heals a FAILED Auto-rebase workflow run.
#
# REPO-SPECIFIC WORKFLOW (no central template). See AGENTS.md
# §"Workflow Files" exception note. Documented gap: the Auto-rebase reusable
# handles merge *conflicts* gracefully (sentinel comment → dev-lead `rebase`
# intent), but a failed *run* (transient API error, rate-limit, infra hiccup)
# posts no sentinel and nothing retries it. This handler re-runs the failed
# jobs, bounded by the run's attempt counter (MAX_ATTEMPTS), and surfaces a
# warning once retries are exhausted.
#
# workflow_run handlers run from the default branch only, so changes here take
# effect after merge to main.
#
# NO actions/checkout: this handler must self-heal a *transient action-resolution
# outage* (#1473: the Auto-rebase run failed in "Set up job" with "Failed to
# resolve action download info. Error: Service Unavailable"). If this job also
# resolved a marketplace action during "Set up job", it would hang on the very
# same outage — which it did, and got cancelled. So it uses zero `uses:` steps
# and self-fetches the retry script with the pre-installed gh CLI (the REST
# contents API is a different service than action resolution).
# ─────────────────────────────────────────────────────────────────────────────
name: Auto-rebase retry

on:
  workflow_run:
    workflows: ["Auto-rebase non-Dependabot PRs"]
    types: [completed]

permissions: {}

concurrency:
  group: auto-rebase-retry-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  retry:
    # Only act on failed runs; the script re-checks but gating here avoids
    # spinning up a runner for every successful/cancelled Auto-rebase run.
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write   # gh run rerun --failed
      contents: read   # fetch the retry script via the gh REST contents API (no actions/checkout)
    steps:
      - name: Retry failed Auto-rebase run
        env:
          # Prefer a PAT: a re-run requested via GITHUB_TOKEN does not re-fire
          # workflow_run events (GitHub's recursion guard), so only GH_PAT_WORKFLOWS
          # lets attempts past the first chain back into this handler toward
          # MAX_ATTEMPTS. With github.token alone, a single retry still fires.
          GH_TOKEN: ${{ secrets.GH_PAT_DON_PETRY || secrets.GH_PAT_WORKFLOWS || github.token }}
          REPO: ${{ github.repository }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          HTML_URL: ${{ github.event.workflow_run.html_url }}
          MAX_ATTEMPTS: "3"
        run: |
          set -euo pipefail
          # Self-fetch the retry script instead of checking out the repo: a
          # handler that heals an action-resolution outage must not itself need
          # to resolve a marketplace action during "Set up job" (#1473).
          # workflow_run handlers run from the default branch, so the default
          # branch copy of the script is exactly what a checkout would give us.
          script="${RUNNER_TEMP}/auto-rebase-retry.sh"
          gh api "repos/${GITHUB_REPOSITORY}/contents/scripts/auto-rebase-retry.sh" \
            -H "Accept: application/vnd.github.raw" > "$script"
          bash "$script"
