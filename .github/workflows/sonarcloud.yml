# ─────────────────────────────────────────────────────────────────────────────
# SOURCE OF TRUTH: petry-projects/.github/standards/workflows/sonarcloud.yml
# Standard:        petry-projects/.github/standards/ci-standards.md#3-sonarcloud-analysis
#
# ADOPTING THIS WORKFLOW:
#   1. This ships verbatim into repos created from petry-projects/repo-template.
#   2. Set sonar.projectKey / sonar.organization in sonar-project.properties to
#      match your repo (see BOOTSTRAP.md), and add the SONAR_TOKEN repo secret.
#   3. The job name `SonarCloud` is the required status check — keep it.
#   4. The scan is guarded on SONAR_TOKEN, so the job is a green no-op until the
#      secret is set — a fresh repo is not blocked on day 0.
#
# CONVENTIONS (enforced by the standard):
#   • permissions: {} at top, least-privilege per job (contents + pull-requests: read)
#   • triggers: push + pull_request + merge_group to main; checkout with fetch-depth: 0
#   • first scan is continue-on-error with a single retry (SonarCloud's analysis
#     endpoint is occasionally flaky)
#   • SHA-pin every third-party action (never a tag/branch)
# ─────────────────────────────────────────────────────────────────────────────
name: SonarCloud Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Required status check: must report on the merge queue's gh-readonly-queue/*
  # ref, or the queue wedges (#1871, prerequisite for #1864).
  merge_group:

permissions: {}

jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up JDK 21
        id: setup_java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      # merge_group.base_ref is the full ref (refs/heads/main); SonarCloud needs
      # the short branch name or it creates a spurious branch.
      - name: Resolve Sonar branch name
        id: branch
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.merge_group.base_ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          case "${EVENT_NAME}" in
            merge_group) echo "name=${BASE_REF#refs/heads/}" >> "$GITHUB_OUTPUT" ;;
            push) echo "name=${REF_NAME}" >> "$GITHUB_OUTPUT" ;;
            *) echo "name=" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: SonarCloud Scan
        id: sonar
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        with:
          args: >-
            -Dsonar.scanner.skipJreProvisioning=true
            -Dsonar.scanner.javaExePath=${{ steps.setup_java.outputs.path }}/bin/java
            ${{ steps.branch.outputs.name != '' &&
            format('-Dsonar.branch.name={0}', steps.branch.outputs.name)
            || '' }}
        continue-on-error: true
      - name: SonarCloud Scan (retry)
        if: env.SONAR_TOKEN != '' && steps.sonar.outcome == 'failure'
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        with:
          args: >-
            -Dsonar.scanner.skipJreProvisioning=true
            -Dsonar.scanner.javaExePath=${{ steps.setup_java.outputs.path }}/bin/java
            ${{ steps.branch.outputs.name != '' &&
            format('-Dsonar.branch.name={0}', steps.branch.outputs.name)
            || '' }}
        continue-on-error: true
