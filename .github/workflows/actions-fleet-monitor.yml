# ─────────────────────────────────────────────────────────────────────────────
# SOURCE OF TRUTH: petry-projects/.github-private/.github/workflows/actions-fleet-monitor.yml
# Standard:        petry-projects/.github/standards/ci-standards.md
#
# AGENTS — READ BEFORE EDITING:
#   • This is the canonical fleet-monitor implementation; there is no external
#     reusable. The scanning logic lives in scripts/fleet_monitor.sh and
#     scripts/fleet_report.sh.
#   • The "Migrate misaligned fleet-tracker issues" and "Track high-failure
#     workflows as Issues" steps both use GH_PAT_WORKFLOWS (not github.token)
#     because they need cross-repo issues:write on target repos.
#     github.token only has issues:write on .github-private itself.
#     Dev-Lead Agent is woken via repository_dispatch using GH_PAT_WORKFLOWS.
#   • Do NOT change checkout ref from 'main' — the github.ref_name variant is
#     for feature-branch testing only and must never reach production.
# ─────────────────────────────────────────────────────────────────────────────
name: Actions Fleet Monitor
# readme-report: Actions fleet monitor — org-wide workflow token usage and run anomalies.

on:
  schedule:
    # Daily at 06:27 UTC — covers same-day run history before US work hours
    - cron: '27 6 * * *'
  workflow_dispatch:
    inputs:
      org:
        description: "GitHub org to scan"
        required: false
        default: "petry-projects"
        type: string
      lookback_days:
        description: "Days of run history to inspect"
        required: false
        default: "1"
        type: string
      remediate:
        # Opt-in stub-drift remediation (#1152, epic #1148). Defaults to dry-run;
        # `live` is the explicit human go for the pilot repo. Only ever honored on
        # this workflow_dispatch path AND gated by the pilot scope + credential —
        # scheduled/workflow_call runs can never go live (see the remediation step).
        description: "Stub-drift remediation: dry-run (default) or live (pilot-only opt-in)"
        required: false
        default: "dry-run"
        type: choice
        options:
          - dry-run
          - live
  workflow_call:
    inputs:
      org:
        description: "GitHub org to scan"
        required: false
        default: "petry-projects"
        type: string
      lookback_days:
        description: "Days of run history to inspect"
        required: false
        default: "1"
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: actions-fleet-monitor-${{ inputs.org || 'petry-projects' }}
  cancel-in-progress: true

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ORG: ${{ inputs.org || 'petry-projects' }}
      LOOKBACK_DAYS: ${{ inputs.lookback_days || '1' }}

    steps:
      - name: Checkout agent repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: petry-projects/.github-private
          ref: main  # Always checkout .github-private@main; workflow_call callers target @main per docs
          token: ${{ secrets.GH_PAT_DON_PETRY || secrets.GH_PAT_WORKFLOWS }}

      - name: Run fleet monitor
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_DON_PETRY || secrets.GH_PAT_WORKFLOWS }}
        run: bash scripts/fleet_monitor.sh

      - name: Summarize token usage by workflow
        # Best-effort observability only — it fetches/unzips every token-usage
        # artifact, so a transient API rate-limit (HTTP 403) here must NOT abort
        # the whole monitor and starve the later, load-bearing steps (issue
        # tracking + the fleet-tracker auto-close). Let it fail soft.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_DON_PETRY || secrets.GH_PAT_WORKFLOWS }}
          REPO: petry-projects/.github-private
          LOOKBACK_DAYS: ${{ env.LOOKBACK_DAYS }}
        run: |
          set -euo pipefail

          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          jsonl_dir="$workdir/jsonl"
          artifacts_file="$workdir/token-artifacts.base64"
          mkdir -p "$jsonl_dir"

          cutoff_epoch="$(date -u -d "-${LOOKBACK_DAYS} days" +%s)"
          artifact_count=0

          gh api "repos/$REPO/actions/artifacts" --paginate \
            --jq '.artifacts[] | select(.name | startswith("token-usage-")) | @base64' \
            > "$artifacts_file"

          while IFS= read -r encoded; do
            [ -n "$encoded" ] || continue
            item="$(printf '%s' "$encoded" | base64 -d)"
            id="$(printf '%s' "$item" | jq -r '.id')"
            created_at="$(printf '%s' "$item" | jq -r '.created_at')"
            expired="$(printf '%s' "$item" | jq -r '.expired')"
            created_epoch="$(date -u -d "$created_at" +%s)"

            if [ "$expired" = "true" ] || [ "$created_epoch" -lt "$cutoff_epoch" ]; then
              continue
            fi

            zip_file="$workdir/artifact-$id.zip"
            unzip_dir="$workdir/unzip-$id"
            mkdir -p "$unzip_dir"
            gh api "repos/$REPO/actions/artifacts/$id/zip" > "$zip_file"
            unzip -q -o "$zip_file" -d "$unzip_dir"

            found_any=false
            while IFS= read -r f; do
              found_any=true
              cp "$f" "$jsonl_dir/${id}-$(basename "$f")"
            done < <(find "$unzip_dir" -type f -name '*.jsonl' -print)

            if [ "$found_any" = true ]; then
              artifact_count=$((artifact_count + 1))
            fi
          done < "$artifacts_file"

          if ! find "$jsonl_dir" -type f -name '*.jsonl' | grep -q .; then
            {
              echo "## Token usage (${LOOKBACK_DAYS} day lookback)"
              echo
              echo "No token-usage artifacts found in the lookback window."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          aggregate="$workdir/token-usage-summary.json"
          jq -s '
            sort_by(.workflow) |
            group_by(.workflow) |
            map({
              workflow: (.[0].workflow // "unknown"),
              calls: length,
              input_tokens: (map(.input_tokens // 0) | add),
              cache_read_tokens: (map(.cache_read_tokens // 0) | add),
              output_tokens: (map(.output_tokens // 0) | add),
              et: (map(.et // 0) | add)
            }) |
            sort_by(.et) | reverse
          ' "$jsonl_dir"/*.jsonl > "$aggregate"

          {
            echo "## Token usage (${LOOKBACK_DAYS} day lookback)"
            echo
            echo "Processed ${artifact_count} token-usage artifact(s)."
            echo
            echo "| Workflow | Calls | Input Tokens | Cache Read Tokens | Output Tokens | Total ET |"
            echo "|---|---:|---:|---:|---:|---:|"
            jq -r '.[] | "| \(.workflow) | \(.calls) | \(.input_tokens) | \(.cache_read_tokens) | \(.output_tokens) | \(.et | tostring) |"' "$aggregate"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create issue with findings
        if: env.HAS_FAILURES == 'true' && hashFiles('fleet_monitor_report.md') != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const MAX = 65000;
            let report = fs.readFileSync('fleet_monitor_report.md', 'utf8');
            if (!report.trim()) { core.setFailed('Report file is empty'); return; }
            if (report.length > MAX) {
              report = report.slice(0, MAX) +
                '\n\n---\n_Report truncated — view the full output in the [workflow run summary](' +
                `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID})._ `;
            }
            const today = new Date().toISOString().split('T')[0];
            const titlePrefix = `${process.env.ORG} — workflow failures detected`;

            // This daily digest embeds the date in its title, so a fresh issue is
            // created every run — 42 had accumulated open. Close the prior digests
            // before opening today's so only the current snapshot stays open (the
            // digest is a point-in-time report; history lives in closed issues).
            const priors = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'health-check', per_page: 100,
            });
            for (const p of priors) {
              if (!p.pull_request && p.title.startsWith(titlePrefix)) {
                try {
                  await github.rest.issues.update({
                    owner: context.repo.owner, repo: context.repo.repo,
                    issue_number: p.number, state: 'closed', state_reason: 'completed',
                  });
                } catch (err) { core.warning(`could not close prior digest #${p.number}: ${err.message}`); }
              }
            }

            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `${titlePrefix} ${today}`,
              body: report,
              labels: ['health-check', 'automated-report'],
            });
            core.notice(`Issue created: ${issue.data.html_url}`);


      - name: Migrate misaligned fleet-tracker issues
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          GH_PAT_WORKFLOWS: ${{ secrets.GH_PAT_DON_PETRY || secrets.GH_PAT_WORKFLOWS }}
        with:
          github-token: ${{ env.GH_PAT_WORKFLOWS }}
          script: |
            // Find open fleet-tracker issues in .github-private that belong to other repos
            const allIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'fleet-tracker',
              state: 'open',
              per_page: 100,
            });

            let migrated = 0;
            for (const issue of allIssues) {
              if (!issue.title.startsWith('[Fleet Monitor] ')) continue;

              // Parse: "[Fleet Monitor] owner/repo — workflow.yml"
              const match = issue.title.match(/^\[Fleet Monitor\] ([^/]+\/\S+) — (.+)$/);
              if (!match) continue;

              const [, targetFullRepo] = match;
              const [targetOwner, targetRepoName] = targetFullRepo.split('/');

              // Already in the right repo — skip
              if (targetRepoName === context.repo.repo && targetOwner === context.repo.owner) continue;

              core.info(`Migrating #${issue.number} "${issue.title}" → ${targetOwner}/${targetRepoName}`);
              try {
                const { repository } = await github.graphql(`
                  query($owner: String!, $name: String!) {
                    repository(owner: $owner, name: $name) { id }
                  }
                `, { owner: targetOwner, name: targetRepoName });

                const result = await github.graphql(`
                  mutation($issueId: ID!, $repoId: ID!) {
                    transferIssue(input: {
                      issueId: $issueId,
                      repositoryId: $repoId,
                      createLabelsIfMissing: true
                    }) {
                      issue { url number }
                    }
                  }
                `, { issueId: issue.node_id, repoId: repository.id });

                core.notice(`Transferred #${issue.number} → ${result.transferIssue.issue.url}`);
                migrated++;
              } catch (err) {
                core.warning(`Failed to migrate #${issue.number}: ${err.message}`);
              }
            }
            core.info(`Migration complete: ${migrated} issue(s) transferred.`);

      - name: Track high-failure workflows as Issues
        if: hashFiles('fleet_high_failure.json') != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          ORG: ${{ env.ORG }}
          GH_PAT_WORKFLOWS: ${{ secrets.GH_PAT_DON_PETRY || secrets.GH_PAT_WORKFLOWS }}
        with:
          # Use GH_PAT_WORKFLOWS for cross-repo issues:write on target repos
          github-token: ${{ env.GH_PAT_WORKFLOWS }}
          script: |
            const fs = require('fs');

            const raw = fs.readFileSync('fleet_high_failure.json', 'utf8').trim();
            const items = JSON.parse(raw || '[]');
            if (!items.length) {
              core.info('No workflows with >10% failure rate — nothing to track.');
              return;
            }

            const labelEmoji = { CRITICAL: '🔴', DEGRADED: '🟠', WARNING: '🟡', ERROR: '⚫' };
            const today = new Date().toISOString().split('T')[0];
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;

            // Track repos where we have already ensured labels exist
            const labelledRepos = new Set();

            for (const item of items) {
              // Issues are created in the repo they pertain to, not in .github-private
              const [targetOwner, targetRepo] = item.repo.split('/');
              try {
                // Ensure required labels exist in the target repo (once per repo)
                if (!labelledRepos.has(item.repo)) {
                  for (const [name, color, desc] of [
                    ['dev-lead',      'd93f0b', 'Requires dev-lead attention'],
                    ['fleet-tracker', '0075ca', 'Tracked by the Actions Fleet Monitor'],
                    ['health-check',  '0e8a16', 'Automated health check result'],
                  ]) {
                    try {
                      await github.rest.issues.createLabel({
                        owner: targetOwner, repo: targetRepo,
                        name, color, description: desc,
                      });
                    } catch (e) {
                      if (e.status === 422) { /* already exists — ok */ }
                      else if (e.status === 403 || e.status === 410) {
                        // 403: no write access; 410: issues disabled on this repo
                        core.warning(`Cannot create label '${name}' in ${targetOwner}/${targetRepo} (${e.status}) — skipping`);
                      } else {
                        throw e;  // propagate to outer catch for unexpected errors
                      }
                    }
                  }
                  labelledRepos.add(item.repo);
                }

                const emoji   = labelEmoji[item.label] ?? '🔴';
                const title   = `[Fleet Monitor] ${item.repo} — ${item.workflow}`;
                const body    = [
                  `## ${emoji} ${item.label}: \`${item.repo}\` / \`${item.workflow}\``,
                  '',
                  `| Metric | Value |`,
                  `|---|---|`,
                  `| **Failure Rate** | ${item.rate} (${item.failed} / ${item.total} runs) |`,
                  `| **Status** | ${item.label} |`,
                  `| **p50 Duration** | ${item.p50}s |`,
                  `| **p95 Duration** | ${item.p95}s |`,
                  `| **Successful Runs** | ${item.success} |`,
                  `| **Cancelled Runs** | ${item.cancelled} |`,
                  '',
                  `**Workflow:** [\`${item.workflow}\`](https://github.com/${item.repo}/actions)`,
                  '',
                  `> _Last updated by [Fleet Monitor run](${runUrl}) on ${today}._`,
                  `> _Threshold: failure rate > 10% over the monitored window._`,
                ].join('\n');

                // Search for an existing open issue in the target repo
                const { data: results } = await github.rest.search.issuesAndPullRequests({
                  q: [
                    `repo:${targetOwner}/${targetRepo}`,
                    'is:issue',
                    'is:open',
                    `in:title`,
                    `"${title}"`,
                  ].join(' '),
                });
                const existing = results.items.find(i => i.title === title);

                if (existing) {
                  await github.rest.issues.update({
                    owner: targetOwner, repo: targetRepo,
                    issue_number: existing.number,
                    body,
                  });
                  await github.rest.issues.addLabels({
                    owner: targetOwner, repo: targetRepo,
                    issue_number: existing.number,
                    labels: ['dev-lead', 'fleet-tracker', 'health-check'],
                  });
                  core.notice(`Updated issue #${existing.number}: ${existing.html_url}`);
                } else {
                  const created = await github.rest.issues.create({
                    owner: targetOwner, repo: targetRepo,
                    title,
                    body,
                    labels: ['dev-lead', 'fleet-tracker', 'health-check'],
                  });
                  core.notice(`Created issue #${created.data.number}: ${created.data.html_url}`);
                }
              } catch (err) {
                core.warning(`Failed to track ${item.repo}/${item.workflow}: ${err.message}`);
              }
            }


      - name: Close resolved fleet-tracker issues
        # The tracking step stamps "Last updated ... on <today>" on an issue every
        # run its workflow is still above threshold. A workflow that recovers (≤10%)
        # or is deleted stops being updated, so its stamp goes stale — but nothing
        # closed the issue, so fleet-tracker issues accumulated forever (#711-class
        # bot backlog). Close any fleet-tracker issue whose stamp is older than
        # STALE_DAYS daily runs. Gated on fleet_high_failure.json existing so a
        # failed scan cannot mass-close; staleness (per-issue stamp, not the current
        # run) means a single bad-scan day never false-closes.
        if: hashFiles('fleet_high_failure.json') != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          ORG: ${{ env.ORG }}
          STALE_DAYS: '3'
          GH_PAT_WORKFLOWS: ${{ secrets.GH_PAT_DON_PETRY || secrets.GH_PAT_WORKFLOWS }}
        with:
          # Use GH_PAT_WORKFLOWS for cross-repo issues:write on target repos
          github-token: ${{ env.GH_PAT_WORKFLOWS }}
          script: |
            const org = process.env.ORG;
            const staleDays = parseInt(process.env.STALE_DAYS, 10);
            const cutoffMs = staleDays * 24 * 60 * 60 * 1000;
            const now = Date.now();

            // octokit's paginate already flattens search results to their `.items`;
            // a `response => response.data.items` mapFn on top produced `undefined`
            // entries and crashed the step (TypeError reading 'repository_url'),
            // failing the whole daily monitor. Drop the mapFn and defensively filter.
            const found = (await github.paginate(github.rest.search.issuesAndPullRequests, {
              q: `org:${org} is:issue is:open label:fleet-tracker`,
              per_page: 100,
            })).filter(Boolean);

            let closed = 0, kept = 0, skipped = 0;
            for (const issue of found) {
              const rm = (issue.repository_url || '').match(/repos\/([^/]+)\/([^/]+)$/);
              const dm = (issue.body || '').match(/updated by \[Fleet Monitor run\]\([^)]*\) on (\d{4}-\d{2}-\d{2})/);
              // No repo match or no stamp → not a monitor-managed body; leave it alone.
              if (!rm || !dm) { skipped++; continue; }
              const [ , owner, repo ] = rm;
              const ageMs = now - Date.parse(`${dm[1]}T00:00:00Z`);
              if (ageMs <= cutoffMs) { kept++; continue; }   // still fresh → workflow still failing
              const days = Math.floor(ageMs / 86400000);
              const body = [
                `✅ **Auto-resolved by Fleet Monitor.** This workflow's failure rate has`,
                `been below the 10% threshold (or the workflow was removed) since ${dm[1]}`,
                `(${days} days) — the monitor stopped flagging it. Closing. It will reopen`,
                `automatically if the workflow crosses the threshold again.`,
              ].join(' ');
              try {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: issue.number, body,
                });
              } catch (err) {
                core.warning(`comment failed on ${owner}/${repo}#${issue.number}: ${err.message}`);
              }
              try {
                await github.rest.issues.update({
                  owner, repo, issue_number: issue.number,
                  state: 'closed', state_reason: 'completed',
                });
                closed++;
              } catch (err) {
                core.warning(`close failed on ${owner}/${repo}#${issue.number}: ${err.message}`);
              }
            }
            core.notice(`fleet-tracker auto-close: closed=${closed} kept=${kept} skipped=${skipped} (stale>${staleDays}d)`);


      - name: Dispatch dev-lead for critical items
        if: env.HIGH_FAILURE_COUNT != '' && env.HIGH_FAILURE_COUNT != '0'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_DON_PETRY || secrets.GH_PAT_WORKFLOWS }}
        run: |
          # github.token events do not trigger issues:labeled workflows; use the
          # PAT to fire repository_dispatch so Dev-Lead Agent is explicitly woken.
          # Use --input so client_payload is sent as a JSON object, not a string.
          gh api "repos/${{ github.repository }}/dispatches" \
            -X POST \
            --input - <<EOF
          {"event_type":"dev-lead-ci-failure","client_payload":{"source":"fleet-monitor","count":"${{ env.HIGH_FAILURE_COUNT }}"}}
          EOF

      - name: Track stub drift
        # #822 AC#3 (planner) + #886 AC#3 (driver) — a per-repo stub that no longer
        # matches its canonical template SHA is exactly the silent-revert class of
        # failure (#655). Each stub kind is tracked in its own issue so adding the
        # driver stub does not drop or merge the load-bearing planner issue.
        if: env.HAS_STUB_DRIFT == 'true' && hashFiles('fleet_stub_drift.json') != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const items = JSON.parse(fs.readFileSync('fleet_stub_drift.json', 'utf8').trim() || '[]');
            if (!items.length) { core.info('No drifted stubs to track.'); return; }

            const today = new Date().toISOString().split('T')[0];
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;

            const LABEL = 'fleet-stub-drift';
            for (const [name, color, description] of [
              [LABEL,         'b60205', 'Per-repo workflow stub drifted from the canonical template'],
              ['dev-lead',     'd93f0b', 'Requires dev-lead attention'],
              ['health-check', '0e8a16', 'Automated health check result'],
            ]) {
              try {
                await github.rest.issues.createLabel({ owner: context.repo.owner, repo: context.repo.repo, name, color, description });
              } catch (e) { if (e.status !== 422) throw e; }
            }

            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner, repo: context.repo.repo,
              labels: LABEL, state: 'open', per_page: 100,
            });

            // Group drifted repos by stub kind so each renders its own issue.
            const byStub = new Map();
            for (const i of items) {
              const stub = i.stub || 'Initiative-planner';
              if (!byStub.has(stub)) byStub.set(stub, []);
              byStub.get(stub).push(i);
            }

            for (const [stub, group] of byStub) {
              const stubFile = (group.find(i => i.stub_file) || {}).stub_file || `${stub.toLowerCase()}.yml`;
              const rows = group.map(i =>
                `| \`${i.repo}\` | \`${(i.repo_sha || '').slice(0,7)}\` | \`${(i.canonical_sha || '').slice(0,7)}\` |`).join('\n');
              const body = [
                `## 🔴 ${stub} stub drift — ${group.length} repo(s)`,
                '',
                `These enrolled repos have a \`${stubFile}\` stub whose blob SHA no longer`,
                'matches the canonical org template. Re-sync them from the template:',
                '',
                '| Repo | Stub SHA | Canonical SHA |',
                '|---|---|---|',
                rows,
                '',
                `> _Detected by [Fleet Monitor run](${runUrl}) on ${today}._`,
              ].join('\n');

              const TITLE = `[Fleet Monitor] ${stub} stub drift`;
              const issue = existing.find(i => i.title === TITLE);
              if (issue) {
                await github.rest.issues.update({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: issue.number, body,
                });
                core.notice(`Updated stub-drift issue #${issue.number}: ${issue.html_url}`);
              } else {
                const created = await github.rest.issues.create({
                  owner: context.repo.owner, repo: context.repo.repo,
                  title: TITLE, body, labels: [LABEL, 'dev-lead', 'health-check'],
                });
                core.notice(`Created stub-drift issue #${created.data.number}: ${created.data.html_url}`);
              }
            }

      - name: Dispatch dev-lead for stub drift
        if: env.HAS_STUB_DRIFT == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_DON_PETRY || secrets.GH_PAT_WORKFLOWS }}
        run: |
          # github.token events do not trigger issues:labeled workflows; use the
          # PAT to fire repository_dispatch so Dev-Lead Agent is explicitly woken.
          gh api "repos/${{ github.repository }}/dispatches" \
            -X POST \
            --input - <<EOF
          {"event_type":"dev-lead-ci-failure","client_payload":{"source":"fleet-monitor-stub-drift","count":"${{ env.STUB_DRIFT_COUNT }}"}}
          EOF

      - name: Remediate drifted stubs (opt-in, dry-run by default)
        # #1152 (epic #1148, Phase 4) — wire the stub-drift remediation loop onto
        # the SAME cadence as detection: run scripts/fleet_stub_remediate.sh here,
        # AFTER fleet_monitor.sh wrote fleet_stub_drift.json and the report/dispatch
        # steps above consumed it. This step never goes live by accident:
        #   • DRY_RUN defaults to true; live requires an explicit workflow_dispatch
        #     with remediate=live (scheduled/workflow_call runs stay dry-run).
        #   • Live additionally requires the pilot scope (FLEET_REMEDIATE_PILOT_REPO)
        #     and the cross-repo write credential (GH_PAT_WORKFLOWS); a missing one
        #     degrades to dry-run with a ::warning:: (fleet_remediate_gate.sh).
        #   • continue-on-error keeps remediation strictly non-blocking — it can
        #     never fail the daily monitor (AC #3).
        # The go/no-go decision to flip a run to live is recorded on the tracking
        # issue per the repo's go/no-go pattern; the pilot repo + per-run cap are
        # configured via repo variables, so enabling the pilot needs no code change.
        continue-on-error: true
        env:
          EVENT_NAME: ${{ github.event_name }}
          REMEDIATE_MODE: ${{ inputs.remediate || 'dry-run' }}
          REMEDIATE_TOKEN: ${{ secrets.GH_PAT_DON_PETRY || secrets.GH_PAT_WORKFLOWS }}
          REMEDIATE_PILOT_REPO: ${{ vars.FLEET_REMEDIATE_PILOT_REPO }}
          REMEDIATE_MAX_REPOS: ${{ vars.FLEET_REMEDIATE_MAX_REPOS || '1' }}
        run: |
          set -euo pipefail

          if [ ! -f fleet_stub_drift.json ]; then
            echo "::warning::fleet_stub_drift.json not found — skipping remediation (no drift artifact to consume)."
            exit 0
          fi

          token_present=false; [ -n "${REMEDIATE_TOKEN}" ] && token_present=true
          pilot_present=false; [ -n "${REMEDIATE_PILOT_REPO}" ] && pilot_present=true

          # Pure go/no-go gate: decides DRY_RUN vs live and emits the
          # degrade-to-dry-run ::warning:: when a live precondition is missing.
          DRY_RUN="$(bash scripts/fleet_remediate_gate.sh \
            "${EVENT_NAME}" "${REMEDIATE_MODE}" "${token_present}" "${pilot_present}")"
          export DRY_RUN
          export GH_TOKEN="${REMEDIATE_TOKEN:-${GITHUB_TOKEN:-}}"
          export REMEDIATE_PILOT_REPO REMEDIATE_MAX_REPOS
          export REMEDIATE_SUMMARY_FILE="fleet_stub_remediate_summary.json"

          echo "Fleet stub-drift remediation: DRY_RUN=${DRY_RUN} (event=${EVENT_NAME}, mode=${REMEDIATE_MODE}, pilot_set=${pilot_present})"
          bash scripts/fleet_stub_remediate.sh fleet_stub_drift.json

      - name: Summarize token usage (org-wide)
        # Runs after all alerting steps so a token-report failure or timeout does
        # not prevent monitoring findings from being created or dispatched.
        # continue-on-error keeps this informational step non-blocking.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_DON_PETRY || secrets.GH_PAT_WORKFLOWS }}
          ORG: ${{ env.ORG }}
          LOOKBACK_DAYS: ${{ env.LOOKBACK_DAYS }}
        run: bash scripts/token_report.sh >> "$GITHUB_STEP_SUMMARY"

      - name: Annotate clean run
        if: env.HAS_FAILURES != 'true' && env.HAS_STUB_DRIFT != 'true'
        run: |
          echo "::notice::Fleet monitor passed — all workflows in ${ORG} are healthy and every tracked workflow stub (initiative-planner, initiative-driver) matches the canonical template over the last ${LOOKBACK_DAYS} day(s)."
