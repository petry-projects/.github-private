name: Stale Manager
# readme-agent: Stale manager agent — warns and closes stale issues/PRs across the org.

on:
  schedule:
    - cron: '29 9 * * 1'   # Every Monday at 09:29 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "If true, log intended actions only — no writes"
        required: false
        default: "true"
        type: string
      target_org:
        description: "GitHub org to scan (default: petry-projects)"
        required: false
        type: string

# Staged: read-only permissions until DRY_RUN=false is set and permissions are updated.
# Live mode requires: issues: write, pull-requests: write
permissions:
  issues: read
  pull-requests: read

concurrency:
  group: stale-manager
  cancel-in-progress: false

jobs:
  stale:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.DON_PETRY_BOT_GH_PAT }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      TARGET_ORG: ${{ inputs.target_org || vars.TARGET_ORG || 'petry-projects' }}
      STALE_DAYS_ISSUE: ${{ vars.STALE_DAYS_ISSUE || '60' }}
      STALE_DAYS_PR: ${{ vars.STALE_DAYS_PR || '30' }}
      GRACE_DAYS: ${{ vars.GRACE_DAYS || '7' }}
      # Staged by default: set LIVE_MODE=true repo variable to enable writes.
      # LIVE_MODE is the authoritative gate — dispatch input cannot bypass it.
      DRY_RUN: ${{ vars.LIVE_MODE == 'true' && 'false' || 'true' }}
      REVIEW_ENGINE: ${{ vars.REVIEW_ENGINE || 'claude' }}
      ACTION_TIMEOUT_SEC: ${{ vars.ACTION_TIMEOUT_SEC || '120' }}
      CLAUDE_CODE_VERSION: ${{ vars.CLAUDE_CODE_VERSION || '2.1.138' }}

    steps:
      - name: Checkout agent repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Cache claude-code CLI
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm-global
          key: claude-code-${{ env.CLAUDE_CODE_VERSION }}-${{ runner.os }}

      - name: Install claude-code CLI
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.npm-global"
          npm config set prefix "$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.npm-global/bin:$PATH"
          if ! command -v claude >/dev/null 2>&1; then
            npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          fi

      - name: Run stale manager
        run: bash scripts/stale-manager.sh
