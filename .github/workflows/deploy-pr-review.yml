# SOURCE OF TRUTH: petry-projects/.github-private/.github/workflows/deploy-pr-review.yml
# Bespoke deployment utility — no org template equivalent in standards/workflows/.
# Exception: this is a repo-specific operational tool, not a reusable org workflow.
name: Deploy pr-review.yml

on:
  workflow_dispatch:

concurrency:
  group: deploy-pr-review
  cancel-in-progress: false

permissions:
  contents: read  # checkout only; writes to target repos use GH_PAT_WORKFLOWS

jobs:
  deploy:
    name: Deploy to ${{ matrix.repo }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        repo: [bmad-bgreat-suite, google-app-scripts, markets, ContentTwin]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Deploy pr-review.yml to ${{ matrix.repo }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_WORKFLOWS }}
          REPO: ${{ matrix.repo }}
        run: |
          set -euo pipefail

          CONTENT_B64=$(base64 -w0 < .github/workflows/pr-review.yml)

          GH_ERR=$(mktemp)
          if ! CURRENT_SHA=$(gh api "repos/petry-projects/$REPO/contents/.github/workflows/pr-review.yml" \
            --jq '.sha' 2>"$GH_ERR"); then
            if grep -q 'HTTP 404' "$GH_ERR"; then
              CURRENT_SHA=""
            else
              cat "$GH_ERR" >&2
              rm -f "$GH_ERR"
              exit 1
            fi
          fi
          rm -f "$GH_ERR"

          SHA_ARGS=()
          if [ -n "$CURRENT_SHA" ]; then
            SHA_ARGS=(-f "sha=$CURRENT_SHA")
          fi

          gh api "repos/petry-projects/$REPO/contents/.github/workflows/pr-review.yml" \
            -X PUT \
            -f message="deploy: add pr-review.yml workflow" \
            -f content="$CONTENT_B64" \
            "${SHA_ARGS[@]}"

          echo "Deployed to $REPO"
