name: Deploy pr-review.yml

on:
  workflow_dispatch:
    inputs:
      repos:
        description: 'Repos to deploy to (comma-separated)'
        required: true
        default: 'bmad-bgreat-suite,google-app-scripts,markets,ContentTwin'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo: [bmad-bgreat-suite, google-app-scripts, markets, ContentTwin]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Deploy pr-review.yml to ${{ matrix.repo }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_WORKFLOWS }}
        run: |
          deploy_file() {
            local src_path="$1"
            local dest_path="$2"
            local content_b64
            content_b64=$(base64 -w0 < "$src_path")
            gh api "repos/petry-projects/${{ matrix.repo }}/contents/${dest_path}" \
              -X PUT \
              -f "message=deploy: update ${dest_path}" \
              -f "content=${content_b64}" 2>&1 | tee deploy.log
            if grep -q '"commit"' deploy.log; then
              echo "✅ Deployed ${dest_path} to ${{ matrix.repo }}"
            else
              echo "⚠️ Deployment of ${dest_path} to ${{ matrix.repo }} may have failed"
              cat deploy.log
            fi
          }

          deploy_file .github/workflows/pr-review.yml .github/workflows/pr-review.yml
          deploy_file scripts/verify-auth-scopes.sh scripts/verify-auth-scopes.sh
