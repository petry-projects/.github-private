# Persona Runtime — Reusable (dispatch side of the mention framework).
# This file is the source of truth. Caller: .github/workflows/persona-runner.yml.
# Standard: https://github.com/petry-projects/.github/blob/main/standards/persona-standards.md (§4.1)
#
# The router (petry-projects/.github persona-mention-reusable.yml) resolves an
# `@petry-projects/<role>` mention and fires a `persona-mention`
# repository_dispatch at this repo. This workflow receives it and runs the
# addressed persona's advisory prompt (prompts/<id>/advisory.md), posting exactly
# one advisory comment that carries the '<!-- persona:<id> -->' recursion marker.
#
# ONE runner for EVERY persona — manifest/convention driven, not one workflow per
# persona (§4.1).
#
# Read/write split (the recursion guarantee):
#   The AGENT gathers context and PRINTS the advisory between sentinels — it runs
#   with github.token, which reads the (public) source repo but CANNOT post to
#   it (that token is scoped to THIS repo). The WORKFLOW then enforces the marker
#   and posts, using the persona's declared posting PAT. So an agent that forgets
#   the marker cannot post an unmarked comment, because it cannot post at all.
#   Prompt-only marker enforcement is how .github-private#860 happened (1,481 acks
#   in 4.5h).
#
# Posting identity (per persona, from the manifest — NOT a repo-wide default):
#   Which account a persona's advisory posts as is read from that persona's
#   personas/<id>/persona.yml runtime.identity (account + credential), the
#   #1316/#1317 pattern. Advisory personas post as the OWNER account don-petry
#   (GH_PAT_DON_PETRY) — the identity ADR-0005 already sanctioned and
#   docs/architecture/adr/0008-personas-post-as-the-owner-account.md restores
#   fleet-wide, reversing #1650. GH_PAT_DON_PETRY is known-good (dev-lead posts
#   with it continuously); donpetry-bot's PAT lacked comment-write here and
#   silently discarded advisories (#1734). Trade-off ADR-0008 records honestly: a
#   don-petry byline is a human account the router's ACTOR axis cannot exclude
#   (it must stay invocable by the maintainer who invokes it most), so the
#   `<!-- persona: -->` MARKER axis becomes the SOLE mechanical recursion guard —
#   acceptable because that marker is workflow-enforced in the post step below
#   (pr_ensure_marker), not prompt-enforced (the #860 failure mode). The runner
#   holds only the PATs for the sanctioned posting identities and fails loudly on
#   any other declared credential.
#
# Requires:
#   CLAUDE_CODE_OAUTH_TOKEN — org secret, the engine credential
#   GH_PAT_DON_PETRY        — org PAT: the WORKFLOW uses it to post the comment as
#                             the owner don-petry on the cross-repo item. The
#                             agent never sees it. (ADR-0008)
#   DON_PETRY_BOT_GH_PAT    — org PAT for donpetry-bot, retained: other paths
#                             still post as the bot (pr-review's approver identity),
#                             and the resolution logic accepting both is what makes
#                             the ADR-0008 change a one-line manifest edit.
name: Persona Runtime — Reusable

on:
  workflow_call:
    inputs:
      persona:
        required: true
        type: string
      source_repo:
        required: true
        type: string
      item_number:
        required: false
        type: string
        default: ''
      comment_url:
        required: false
        type: string
        default: ''
      requested_by:
        required: false
        type: string
        default: ''
      mode:
        required: false
        type: string
        default: 'advisory'
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
      DON_PETRY_BOT_GH_PAT:
        # donpetry-bot's PAT — retained though advisory personas no longer post as
        # the bot (ADR-0008). Still referenced by other paths (pr-review's approver
        # identity), and keeping the resolution logic accepting both credentials is
        # what makes the ADR-0008 change a one-line manifest edit. Which PAT is used
        # is chosen per persona from runtime.identity.credential, not a repo-wide
        # default (.github-private#1650). Grandfathered credential name.
        required: false
      GH_PAT_DON_PETRY:
        # don-petry's PAT — the owner account advisory personas post as (ADR-0008,
        # restoring the ADR-0005 position; reverses #1650, fixes #1734). Chosen per
        # persona from runtime.identity.credential, never a repo-wide default.
        required: false
      # GH_PAT_WORKFLOWS removed (#1650): the broadly-scoped workflows PAT is no
      # longer a posting fallback here — least privilege, and posting under it
      # attributed advisories to a human owner account.

permissions: {}

concurrency:
  # One run per (persona, item). item_number is empty for discussions, so key on
  # comment_url too — otherwise every discussion mention for one persona+repo
  # would collapse into a single group and drop concurrent advisories.
  group: persona-runner-${{ inputs.persona }}-${{ inputs.source_repo }}-${{ inputs.item_number }}-${{ inputs.comment_url }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read   # checkout THIS repo's tooling + prompts. The agent reads
                       # the public source repo with github.token; the comment is
                       # posted by the workflow with the persona's manifest PAT.
    steps:
      - name: Checkout persona tooling + prompts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve the persona's advisory prompt
        id: resolve
        env:
          PERSONA: ${{ inputs.persona }}
        run: |
          set -euo pipefail
          # shellcheck source=scripts/lib/persona-runner.sh
          source scripts/lib/persona-runner.sh

          # This runner is a SEPARATE trust boundary from the router: a
          # repository_dispatch can be sent by anything holding a token, so the
          # payload is re-validated here. Distinguish the two failure modes:
          #   rc 2 = malformed id (a bad/hostile payload) — FAIL loudly, do not
          #          mask it as a benign skip.
          #   rc 3 = no advisory prompt for a well-formed id — benign ("persona
          #          has no runtime wired yet"), skip quietly.
          rc=0
          prompt_path="$(pr_require_advisory "$PERSONA" .)" || rc=$?
          case "$rc" in
            0)
              echo "skip=false" >> "$GITHUB_OUTPUT"
              echo "prompt_path=${prompt_path}" >> "$GITHUB_OUTPUT"
              echo "marker=$(pr_agent_marker "$PERSONA")" >> "$GITHUB_OUTPUT"
              ;;
            3)
              echo "::notice::persona '${PERSONA}' has no advisory runtime — nothing to do"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::rejecting persona-mention dispatch for malformed persona id '${PERSONA}'"
              exit 1
              ;;
          esac

      - name: Resolve the persona's posting identity from its manifest
        # Source of truth for who a persona posts as: personas/<id>/persona.yml
        # runtime.identity (the #1316/#1317 pattern). The runner honors the
        # manifest rather than a repo-wide default — a persona posting under a
        # human maintainer's PAT is exactly what #1650 removes. The runner holds
        # PATs only for the sanctioned posting identities; any other declared
        # credential fails loudly rather than silently borrowing a default.
        id: identity
        if: steps.resolve.outputs.skip == 'false'
        env:
          PERSONA: ${{ inputs.persona }}
        run: |
          set -euo pipefail
          account="$(bash scripts/lib/resolve-persona-identity.sh "$PERSONA" personas account)"
          credential="$(bash scripts/lib/resolve-persona-identity.sh "$PERSONA" personas credential)"
          case "$credential" in
            DON_PETRY_BOT_GH_PAT | GH_PAT_DON_PETRY) ;;
            *)
              echo "::error::persona '${PERSONA}' declares posting credential '${credential}', which this runner holds no PAT for. Add it to the reusable's secrets: block and the token map in the post step."
              exit 1
              ;;
          esac
          echo "account=${account}" >> "$GITHUB_OUTPUT"
          echo "credential=${credential}" >> "$GITHUB_OUTPUT"
          echo "resolved posting identity for '${PERSONA}': ${account} (${credential})"

      - name: Install Claude Code
        if: steps.resolve.outputs.skip == 'false'
        env:
          CLAUDE_CODE_VERSION: ${{ vars.CLAUDE_CODE_VERSION || 'latest' }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.npm-global"
          npm config set prefix "$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
          npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      - name: Produce the advisory (agent — read only, no post)
        if: steps.resolve.outputs.skip == 'false'
        id: advise
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # github.token: reads the PUBLIC source repo, cannot post to it (scoped
          # to THIS repo). The agent deliberately never receives a posting PAT.
          GH_TOKEN: ${{ github.token }}
          PERSONA: ${{ inputs.persona }}
          SOURCE_REPO: ${{ inputs.source_repo }}
          ITEM_NUMBER: ${{ inputs.item_number }}
          COMMENT_URL: ${{ inputs.comment_url }}
          REQUESTED_BY: ${{ inputs.requested_by }}
          AGENT_MARKER: ${{ steps.resolve.outputs.marker }}
          PROMPT_PATH: ${{ steps.resolve.outputs.prompt_path }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.npm-global/bin:$PATH"

          {
            echo "You are running headless for persona '${PERSONA}'. The work item details and summoner are provided in the environment variables SOURCE_REPO, ITEM_NUMBER, COMMENT_URL, and REQUESTED_BY."
            echo "Follow your instructions exactly. PRINT the advisory between the"
            echo "sentinels; do not attempt to post it (you cannot)."
            echo
            cat "$PROMPT_PATH"
          } > /tmp/persona-prompt.txt

          _out=$(mktemp); _rc=0
          claude --print \
            --permission-mode bypassPermissions \
            --allowedTools Bash \
            --fallback-model opus \
            -p "$(cat /tmp/persona-prompt.txt)" > "$_out" 2>&1 || _rc=$?

          if [ "$_rc" -ne 0 ]; then
            if grep -qiE "hit your.*(session )?limit|rate.?limit|usage limit|quota exceeded|too many requests" "$_out"; then
              echo "::notice::engine rate-limited — leaving ${SOURCE_REPO}#${ITEM_NUMBER} un-answered (a future mention retries)"
              echo "skip_post=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            cat "$_out"
            echo "::error::persona agent failed (rc=$_rc)"
            exit "$_rc"
          fi

          # Stash raw agent output for the post step to parse (multi-line, so a
          # file, not a step output).
          cp "$_out" "$RUNNER_TEMP/agent-out.txt"
          echo "skip_post=false" >> "$GITHUB_OUTPUT"

      - name: Enforce marker and post the comment (workflow — the only writer)
        if: steps.resolve.outputs.skip == 'false' && steps.advise.outputs.skip_post == 'false'
        env:
          # The PAT lives ONLY here. The agent step above never had it. WHICH
          # PAT is used is driven by the persona manifest
          # (runtime.identity.credential), resolved in the "identity" step —
          # never a repo-wide default. The resolve step already constrained
          # credential to this known set.
          BOT_PAT: ${{ secrets.DON_PETRY_BOT_GH_PAT }}
          OWNER_PAT: ${{ secrets.GH_PAT_DON_PETRY }}
          PERSONA: ${{ inputs.persona }}
          POSTING_ACCOUNT: ${{ steps.identity.outputs.account }}
          POSTING_CREDENTIAL: ${{ steps.identity.outputs.credential }}
          SOURCE_REPO: ${{ inputs.source_repo }}
          ITEM_NUMBER: ${{ inputs.item_number }}
        run: |
          set -euo pipefail
          # shellcheck source=scripts/lib/persona-runner.sh
          source scripts/lib/persona-runner.sh

          # Select the appropriate PAT based on the persona's manifest identity
          if [ "$POSTING_CREDENTIAL" = "DON_PETRY_BOT_GH_PAT" ]; then
            GH_TOKEN="${BOT_PAT}"
          else
            GH_TOKEN="${OWNER_PAT}"
          fi
          export GH_TOKEN

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::no PAT available to post as '${POSTING_ACCOUNT}' (credential '${POSTING_CREDENTIAL}') — is that secret set on this repo/org?"
            exit 1
          fi

          # Defense in depth: the selected token MUST authenticate as the
          # manifest-declared account. If the chosen secret is unset, we
          # could silently post under the wrong identity — the exact #1650
          # regression. Fail closed (a future mention retries) rather than
          # post under the wrong identity.
          actual_login="$(gh api user -q .login 2>/dev/null || true)"
          if [ "$actual_login" != "$POSTING_ACCOUNT" ]; then
            msg="posting token authenticates as '${actual_login:-<unknown>}', "
            msg="${msg}not the manifest identity '${POSTING_ACCOUNT}' "
            msg="${msg}(credential '${POSTING_CREDENTIAL}') — refusing to post"
            echo "::error::${msg} under the wrong identity"
            exit 1
          fi

          raw="$(cat "$RUNNER_TEMP/agent-out.txt")"
          body="$(pr_extract_advisory "$raw")"
          if [ -z "${body//[[:space:]]/}" ]; then
            echo "::warning::agent produced no advisory between the sentinels for ${SOURCE_REPO}#${ITEM_NUMBER} — nothing to post"
            exit 0
          fi

          # Mechanically guarantee the recursion marker — the agent could not post
          # unmarked (no write token), and now cannot post unmarked via us either.
          # LOAD-BEARING under ADR-0008: personas now post as the owner account
          # don-petry, which the router's actor axis cannot exclude, so THIS marker
          # is the SOLE mechanical recursion guard for persona output. Enforcing it
          # here in the post step — the only writer — is what keeps it workflow-
          # enforced, not prompt-enforced (the #860 runaway failure mode). The
          # forgot-the-marker path is covered by tests/persona_runner.bats
          # ("pr_ensure_marker PREPENDS the marker when the agent forgot it"); keep
          # that coverage green — do not weaken this call.
          body="$(pr_ensure_marker "$PERSONA" "$body")"

          if [ -z "${ITEM_NUMBER}" ]; then
            echo "::notice::discussion advisory not yet supported by the runner post-path — skipping post for ${SOURCE_REPO}"
            exit 0
          fi

          # Issue-comments endpoint serves PRs too.
          gh api "repos/${SOURCE_REPO}/issues/${ITEM_NUMBER}/comments" -f body="$body" >/dev/null
          echo "Posted ${PERSONA} advisory on ${SOURCE_REPO}#${ITEM_NUMBER}."
