name: Issue Triage

on:
  issues:
    types: [opened]

# Two-job pattern: triage runs with read-only issue access and produces a
# staged JSON artifact; apply runs with write access and calls safe-output.
jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    outputs:
      result: ${{ steps.run.outputs.result }}
      skip: ${{ steps.run.outputs.skip }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install claude CLI
        uses: anthropics/claude-code-action/setup@24492741e0ccfdef4c1d19da8e11e0f373d07494  # main
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      - name: Install Python dependencies
        run: pip install pyyaml --quiet

      - name: Run issue-triage (staged)
        id: run
        env:
          ISSUE_NUMBER:    ${{ github.event.issue.number }}
          ISSUE_TITLE:     ${{ github.event.issue.title }}
          ISSUE_BODY:      ${{ github.event.issue.body }}
          ISSUE_LABELS:    ${{ join(github.event.issue.labels.*.name, ',') }}
          ISSUE_URL:       ${{ github.event.issue.html_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          result=$(bash scripts/aw.sh run issue-triage --staged)
          skip=$(echo "$result" | python3 -c "import json,sys; d=json.load(sys.stdin); print('true' if d.get('skip') else 'false')")
          # Store encoded to survive multi-line JSON in GITHUB_OUTPUT
          echo "result=$(echo "$result" | base64 -w0)" >> "$GITHUB_OUTPUT"
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  apply:
    needs: triage
    if: needs.triage.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install Python dependencies
        run: pip install pyyaml --quiet

      - name: Apply triage output (safe-output)
        env:
          GITHUB_TOKEN:      ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER:      ${{ github.event.issue.number }}
          TRIAGE_RESULT:     ${{ needs.triage.outputs.result }}
        run: |
          echo "$TRIAGE_RESULT" | base64 -d > /tmp/triage-result.json
          bash scripts/aw.sh safe-output apply issue-triage /tmp/triage-result.json
