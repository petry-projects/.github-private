# ─────────────────────────────────────────────────────────────────────────────
# SOURCE OF TRUTH: petry-projects/.github/standards/workflows/feature-ideation.yml
# Standard:        petry-projects/.github/standards/ci-standards.md#8-feature-ideation-feature-ideationyml--bmad-method-repos
# Reusable:        petry-projects/.github/.github/workflows/feature-ideation-reusable.yml
#
# AGENTS — READ BEFORE EDITING:
#   • This file is a THIN CALLER STUB. The 5-phase ideation pipeline, the
#     Opus 4.6 model selection, the github_token override, and the
#     ANTHROPIC_MODEL env var all live in the reusable workflow above.
#   • You MAY change: the `project_context` value (the only required edit
#     per repo), and optionally the cron schedule.
#   • You MUST NOT change: trigger event shape, the `uses:` line, the
#     job-level `permissions:` block, or the `secrets:` block — these are
#     required for the reusable to work.
#   • If you need different behaviour, open a PR against the reusable in
#     the central repo. The change will propagate everywhere on next run.
# ─────────────────────────────────────────────────────────────────────────────
#
# Feature Ideation workflow stub — for BMAD Method-enabled repos.
#
# This is a thin caller for the org-wide reusable workflow at
# petry-projects/.github/.github/workflows/feature-ideation-reusable.yml
# All ideation logic, the multi-skill pipeline, the Opus 4.6 model
# selection, and the github_token override live in the reusable workflow.
#
# To adopt:
#   1. Copy this file to .github/workflows/feature-ideation.yml in your repo.
#   2. Replace the `project_context` value with a 3-5 sentence description
#      of your project, its target users, and the competitive landscape Mary
#      should research. This is the only required customisation.
#   3. (Optional) Copy standards/feature-ideation-sources.md from
#      petry-projects/.github to .github/feature-ideation-sources.md in your
#      repo and trim/extend it for your project. Mary uses YOUR copy — not the
#      central template — so each repo controls its own source list.
#      Pass `sources_file: path/to/your-list.md` to the reusable workflow if
#      you prefer a different location.
#   4. (Optional) Adjust the schedule cron if Friday morning UTC doesn't suit.
#   5. Ensure GitHub Discussions is enabled with an "Ideas" category.
#   6. Confirm the org-level secret CLAUDE_CODE_OAUTH_TOKEN is accessible.
#
# Standard: https://github.com/petry-projects/.github/blob/main/standards/ci-standards.md#8-feature-ideation-feature-ideationyml--bmad-method-repos
name: Feature Research & Ideation (BMAD Analyst)

on:
  schedule:
    - cron: '0 7 * * 5' # Friday 07:00 UTC (3 AM EDT / 2 AM EST)
  workflow_dispatch:
    inputs:
      target_discussion:
        description: >-
          Ideas Discussion number to enhance in single-idea mode. Set by the
          `redispatch` job when bridging a `discussion: created` event to this
          workflow_dispatch (claude-code-action aborts on `discussion` contexts).
          Empty on schedule/manual dispatch → normal scan.
        required: false
        default: ''
        type: string
      focus_area:
        description: 'Optional focus area (e.g., "accessibility", "performance")'
        required: false
        type: string
      research_depth:
        description: 'Research depth'
        required: false
        default: 'standard'
        type: choice
        options:
          - quick
          - standard
          - deep
      dry_run:
        description: 'Skip Discussion mutations and log them to a JSONL artifact instead. Use this on a fork to smoke-test before going live.'
        required: false
        default: false
        type: boolean
      enhance_backlog:
        description: >-
          Backfill: sweep this repo's open, human-authored, not-yet-enhanced Ideas and
          post exactly one structured enhancement comment each (idempotent via the
          enhancement marker). Operator-triggered; pair with dry_run=true to preview
          without posting.
        required: false
        default: false
        type: boolean
  # Auto-enhance a freshly-created idea: when a new Discussion is opened in the
  # Ideas category, the analyst researches and refines it in single-idea mode.
  discussion:
    types: [created]

permissions: {}

concurrency:
  group: feature-ideation
  cancel-in-progress: false

jobs:
  # ── discussion [created] bridge ───────────────────────────────────────────────
  # claude-code-action aborts on `discussion` event contexts ("Unsupported event
  # type: discussion"), so we never enhance inline on a discussion event. When a
  # new idea is opened we resolve its number and re-invoke THIS workflow via
  # workflow_dispatch — under which the action runs cleanly — passing the number
  # as target_discussion so the reusable runs single-idea enhancement mode. This
  # mirrors initiative-planner.yml's `redispatch` job (#618).
  #
  # The guard keeps this to new ideas in the Ideas category and skips the bot's
  # own creations (enhancement posts a comment, which does not re-fire
  # `discussion: created`); only a real human Idea triggers the bridge.
  #
  # The logic is kept INLINE in this stub (not a repo-local script) so it stays
  # drift-free with the org template at
  # petry-projects/.github/standards/workflows/feature-ideation.yml — a copied
  # stub carries no scripts/ tree.
  redispatch:
    if: >-
      github.event_name == 'discussion' &&
      github.event.discussion.category.slug == 'ideas' &&
      github.event.discussion.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Guard — PAT present
        # PAT required: a workflow_dispatch fired with GITHUB_TOKEN is accepted but
        # NEVER starts a run (loop prevention) — the enhancement would silently
        # no-op. Same constraint as scripts/initiative-planner/redispatch.sh.
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_WORKFLOWS }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::GH_PAT_WORKFLOWS is required — a workflow_dispatch fired with GITHUB_TOKEN will not start a run."
            exit 1
          fi

      - name: Re-dispatch under workflow_dispatch
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_WORKFLOWS }}
          REPO: ${{ github.repository }}
          # Discussion numbers are always positive integers, so this is safe to
          # forward directly to the dispatch input.
          DISCUSSION_NUMBER: ${{ github.event.discussion.number }}
        run: |
          echo "Discussion #${DISCUSSION_NUMBER} created → re-dispatching feature-ideation.yml for single-idea enhancement."
          gh workflow run feature-ideation.yml --repo "${REPO}" \
            -f target_discussion="${DISCUSSION_NUMBER}"

  # ── #571 input resolution — keep `inputs` out of the reusable `with:` ────────
  # A reusable-workflow call graph (its `uses:` + `with:`) is validated at
  # WORKFLOW SETUP, before — and regardless of — the calling job's `if:`. The
  # `inputs` context is only populated for workflow_dispatch/workflow_call, so a
  # `with:` that references `${{ inputs.* }}` trips a zero-job startup failure on
  # the `discussion` event even though `ideate` is gated off it. We resolve the
  # dispatch inputs in this ordinary job (whose step expressions run at run time
  # and are skipped on `discussion`) and hand them to `ideate` via
  # `needs.prep.outputs.*` — an always-valid context that defers the `with:`
  # evaluation to run time. Do not reference `inputs` in `ideate.with`.
  prep:
    if: github.event_name != 'discussion'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      target_discussion: ${{ steps.resolve.outputs.target_discussion }}
      focus_area: ${{ steps.resolve.outputs.focus_area }}
      research_depth: ${{ steps.resolve.outputs.research_depth }}
      dry_run: ${{ steps.resolve.outputs.dry_run }}
      enhance_backlog: ${{ steps.resolve.outputs.enhance_backlog }}
    steps:
      - name: Resolve dispatch inputs
        id: resolve
        # `github.event.inputs.*` (not the `inputs` context) so this reads
        # cleanly on schedule too, where it is simply null → the defaults below.
        env:
          TARGET_DISCUSSION: ${{ github.event.inputs.target_discussion }}
          FOCUS_AREA: ${{ github.event.inputs.focus_area }}
          RESEARCH_DEPTH: ${{ github.event.inputs.research_depth }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          ENHANCE_BACKLOG: ${{ github.event.inputs.enhance_backlog }}
        run: |
          {
            echo "target_discussion=${TARGET_DISCUSSION:-}"
            echo "focus_area=${FOCUS_AREA:-}"
            echo "research_depth=${RESEARCH_DEPTH:-standard}"
            echo "dry_run=${DRY_RUN:-false}"
            echo "enhance_backlog=${ENHANCE_BACKLOG:-false}"
          } >> "$GITHUB_OUTPUT"

  ideate:
    # Runs on workflow_dispatch (incl. the redispatch bridge above) and schedule
    # only — never inline on a discussion event, where claude-code-action aborts.
    needs: [prep]
    if: github.event_name != 'discussion'
    # Permissions cascade from the calling job to the reusable workflow.
    # The reusable workflow's two jobs (gather-signals + analyze) need:
    #   - contents:      read   (checkout, file reads)
    #   - issues:        read   (signal collection)
    #   - pull-requests: read   (signal collection)
    #   - discussions:   write  (CRITICAL — create/update Discussion threads)
    #   - id-token:      write  (claude-code-action OIDC for GitHub App token)
    #   - actions:       read   (feed checkpoint — last successful run query)
    permissions:
      contents: read
      issues: read
      pull-requests: read
      discussions: write
      id-token: write
      actions: read
    # SANCTIONED RING-RELEASE PIN — documented exception to the stub header's
    # "You MUST NOT change … the uses: line" rule. This repo is feature-ideation's
    # `next` ring (host-relative canary / dogfood-first), so it pins ONCE to the
    # moving `feature-ideation/next` channel tag and rides each promotion in place
    # — exercising the candidate (folded-enhancement) reusable ahead of every other
    # ring. The channel tag is a first-party mutable ref bounded by the
    # feature-ideation/** ruleset on petry-projects/.github, NOT an unpinned action;
    # a compliance pass must not "fix" it back to a frozen @vX.Y.Z / @<sha>.
    # See AGENTS.md "Release channel tags & the mutable-ref exception" and
    # docs/release/versioning.md (ring channels; Cross-repo: feature-ideation).
    # Precedent: auto-rebase.yml intentionally pins its reusable @v2 ahead of canon.
    uses: petry-projects/.github/.github/workflows/feature-ideation-reusable.yml@feature-ideation/v1-next
    with:
      # All values below come from `needs.prep.outputs.*` (resolved in the `prep`
      # job) — NOT the `inputs` context — so this reusable `with:` compiles on the
      # `discussion` event without a zero-job startup failure (#571).
      # Carries the Idea's Discussion number → the reusable runs single-idea
      # enhancement mode. Forwarded by the `redispatch` bridge on
      # `discussion: created`; empty on schedule/manual dispatch → normal scan.
      target_discussion: ${{ needs.prep.outputs.target_discussion }}
      # === CUSTOMISE THIS PER REPO — the only required edit ===
      project_context: |
        petry-projects/.github-private is the org-level private automation
        repository for the petry-projects GitHub organisation. It owns the org's
        agentic CI/CD operations: the dev-lead autonomous engineering agent, the
        multi-stage PR-review pipeline, scheduled health and actions-fleet
        monitors, dependency-audit and release-notes automation, Copilot custom
        agent profiles (agents/), prompt libraries (prompts/), and the shell
        orchestration (scripts/) executed by GitHub Actions. It complements the
        public petry-projects/.github standards repo by hosting the private
        execution logic and the self-hosting agent harness — engine.sh tier
        routing and channel-tag release rings. Downstream consumers are internal
        product repos (Broodly, TalkTerm, markets) plus the org's own agent
        fleet. Key trends Mary should research: agentic software-engineering
        automation (autonomous PR fix/review bots, multi-agent orchestration),
        LLM model and cost routing for agent harnesses (capability-vs-price tier
        selection, adaptive thinking, new Claude/Gemini tiers), GitHub Actions
        platform advances (reusable-workflow versioning, OIDC, larger runners,
        merge queues), prompt-injection and least-privilege hardening for
        agent workflows (agent-shield threat models, supply-chain pinning), and
        safe self-hosting release strategies (canary and ring rollouts for
        agents that modify their own infrastructure). No public users — this is
        internal DevX and agent-operations infrastructure.
      # === OPTIONAL: repo-local reputable source list ===
      # This repo ships .github/feature-ideation-sources.md, which is the
      # reusable workflow's default path — so no sources_file override is needed.
      focus_area: ${{ needs.prep.outputs.focus_area }}
      research_depth: ${{ needs.prep.outputs.research_depth }}
      # prep emits the string 'true'/'false'; fromJSON casts it to the boolean
      # the reusable's typed inputs require.
      dry_run: ${{ fromJSON(needs.prep.outputs.dry_run) }}
      # Operator-triggered backlog sweep (#934). Empty on schedule/discussion
      # triggers → false → normal scan/single-idea enhancement. Pair with
      # dry_run=true to preview the intended comments without posting.
      enhance_backlog: ${{ fromJSON(needs.prep.outputs.enhance_backlog) }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}