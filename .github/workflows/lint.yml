  actionlint:
    # General workflow linting (#1256, epic #1052 Part D): actionlint validates
    # syntax, expression usage, shellcheck-in-run, and (for reusable callers) the
    # inputs of LOCAL `./…` reusable refs. Install matches ci.yml's Lint GitHub
    # Actions step — pinned version + sha256 checksum via `gh release download`
    # (no CDN curl, no unpinned marketplace action).
    #
    # NOTE — this does NOT cover the pinned-remote-ref channel skew. actionlint
    # only input-checks a reusable referenced by a LOCAL path (`./.github/…`); it
    # does not resolve a remote pin like `…/pr-review.yml@pr-review/next` and so
    # cannot detect a caller stub forwarding an input the pinned channel lacks
    # (the #1034 defect). That gap is closed by validate-caller-inputs (Part A,
    # #1253) and caller-stub-freeze (Part B, #1255) above — do not mistake this
    # job for that coverage.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Lint GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Install actionlint via GitHub API download (pinned version + checksum).
          # Uses gh release download rather than direct CDN curl to avoid transient
          # 504s from GitHub's release asset CDN. Keep in lockstep with ci.yml.
          ACTIONLINT_VERSION="1.7.12"
          ACTIONLINT_SHA="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          gh release download "v${ACTIONLINT_VERSION}" -R rhysd/actionlint \
            -p "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output actionlint.tar.gz
          echo "${ACTIONLINT_SHA}  actionlint.tar.gz" | sha256sum -c -
          tar xzf actionlint.tar.gz actionlint
          chmod +x actionlint
          rm actionlint.tar.gz
          shopt -s extglob
          ./actionlint -ignore 'SC2129' .github/workflows/!(*.lock).yml

  validate-workflow-schedules:
    # Off-peak scheduling compliance (#724, epic #722): fail any PR that
    # introduces a minute-0 (`0 * * * *`) schedule.cron in this repo's own
    # workflow/agentic sources. Enforces the AGENTS.md "Scheduled workflows"
    # standard. PR-triggered on the existing Lint workflow — no new cron.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Check for minute-0 scheduled crons
        run: bash scripts/validate-workflow-schedules.sh

  validate-caller-inputs:
    # Channel-skew guard (#1253, epic #1052; regression for #1034): for every
    # reusable-workflow caller stub with a `with:` block, resolve the reusable at
    # its PINNED ref and assert forwarded inputs ⊆ declared workflow_call inputs
    # (and that required inputs are forwarded). `pull_request` CI runs the base
    # stub and GitHub validates reusable inputs only at startup against the pinned
    # ref, so an input-forwarding change to a channel-pinned caller is exercised
    # by nothing in PR CI and only breaks post-merge — this closes that gap.
    # Same-repo channel tags are resolved via `git fetch` of the tag; an
    # unresolvable ref soft-passes with a logged ::warning:: (never silently).
    # PR-triggered on the existing Lint workflow — no new cron/scheduled workload.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        # NOTE: persist-credentials is intentionally left at the default (true) —
        # vci_resolve_reusable needs `git fetch origin` to authenticate against this
        # private repo when resolving same-repo channel tags. Setting
        # persist-credentials: false would silently push every such caller into the
        # "unresolved ref" soft-pass/warning path, defeating the guard entirely.

      - name: Validate caller inputs ⊆ reusable inputs at the pinned ref
        run: bash scripts/validate-caller-inputs.sh

  caller-stub-freeze:
    # Stub-freeze drift guard (#1255, epic #1052 Part B): backstops
    # validate-caller-inputs (#1253) for the ring-0 / self-host caller stubs
    # (dev-lead.yml, pr-review-trigger.yml, ci-failure-analyst.lock.yml) whose
    # reusable lives in THIS repo and is pinned to a canary channel tag. A
    # trigger/`with:` forwarding change to a channel-pinned self-host stub is
    # exercised by nothing in PR CI and only breaks post-merge (#1034), so each
    # stub's `on:` + `uses:`/`with:` block is frozen byte-for-byte against a
    # committed baseline (tests/fixtures/caller-stub-freeze/*.block). Any edit
    # fails here unless the baseline is intentionally regenerated in the same
    # reviewed diff. Reuses the byte-identity model from scripts/fleet_stub_drift.sh.
    # PR-triggered on the existing Lint workflow — no new cron/scheduled workload.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Check ring-0 caller stubs match their frozen forwarding baselines
        run: bash scripts/caller_stub_freeze.sh

  template-drift:
    # Drift guard (#969): fail when a file committed in petry-projects/repo-template
    # has diverged from its standards-derived baseline, so the template stays a thin
    # distribution layer of standards/ and never becomes a competing fork. Reuses the
    # byte-identity (blob-SHA) model from scripts/fleet_stub_drift.sh. PR-triggered via
    # this existing Lint workflow — no new scheduled/cron workload is added.
    #
    # Excluded from the main-push trigger (#1486, AC4): this job is known-red under
    # #1448, so it must not fail every merge until that is resolved. It still runs
    # on pull_request and workflow_dispatch exactly as before.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Check repo-template stubs have not drifted from standards/
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/template_stub_drift.sh

  validate-agent-profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install PyYAML
        run: pip3 install --quiet pyyaml

      - name: Validate agent profile frontmatter
        run: |
          set -euo pipefail
          fail=0
          for f in agents/*.md; do
            [ -e "$f" ] || continue
            name_from_file=$(basename "$f" .md)
            if ! awk 'NR==1 && $0!="---"{exit 1} /^---/{n++; if(n==2) exit} END{exit (n<2)}' "$f"; then
              echo "FAIL: $f — frontmatter missing or does not begin on line 1"
              fail=1
              continue
            fi
            frontmatter=$(awk 'BEGIN{found=0} /^---/{found++; if(found==2) exit; next} found==1{print}' "$f")
            if ! printf '%s\n' "$frontmatter" | python3 -c "import sys, yaml; yaml.safe_load(sys.stdin)" 2>/dev/null; then
              echo "FAIL: $f — invalid YAML in frontmatter"
              fail=1
              continue
            fi
            name_from_front=$(printf '%s\n' "$frontmatter" | grep '^name:' | sed 's/^name:[[:space:]]*//' | sed "s/^['\"]//;s/['\"]$//" | head -1)
            if [ -z "$name_from_front" ]; then
              echo "FAIL: $f — missing 'name' field in frontmatter"
              fail=1
            elif [ "$name_from_front" != "$name_from_file" ]; then
              echo "FAIL: $f — name '$name_from_front' does not match filename '$name_from_file'"
              fail=1
            elif ! printf '%s\n' "$name_from_file" | grep -qE '^[a-z0-9]+(-[a-z0-9]+)*$'; then
              echo "FAIL: $f — name '$name_from_file' is not kebab-case (only lowercase letters, digits, and hyphens)"
              fail=1
            fi
            for field in description tools; do
              if ! printf '%s\n' "$frontmatter" | grep -q "^${field}:"; then
                echo "FAIL: $f — missing '${field}' field in frontmatter"
                fail=1
              fi
            done
            echo "OK: $f"
          done
          [ "$fail" -eq 0 ] || exit 1

  validate-personas:
    # Validate every personas/<id>/persona.yml against the canonical persona
    # manifest schema (owned by petry-projects/.github, read the same way any
    # consumer reads a published standard) plus the cross-invariants the schema
    # can't express (id==dir==canary.agent, layer paths exist, vendor_pin ↔
    # VENDOR.md, evals splits present, non-draft ⇒ canary-rings entry).
    # NOTE: the schema is fetched from petry-projects/.github @ main, so this job
    # only goes green once that repo's persona schema is on main (PR #670).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Python deps
        run: pip3 install --quiet 'jsonschema>=4' pyyaml

      - name: Validate persona manifests
        # Read the canonical schema from petry-projects/.github. Prefer a
        # same-named branch there (so companion PRs developed on a shared branch
        # validate against each other before either merges); the validator falls
        # back to main automatically, which is the steady state.
        env:
          PERSONA_SCHEMA_REF: ${{ github.head_ref || github.ref_name }}
        run: python3 personas/validate-personas.py personas

  validate-interaction-contracts:
    # Interaction-contract well-formedness gate (Story 2 / #1404, AC #5). Parses
    # every machine-readable interaction contract — the co-located persona lenses
    # (personas/<id>/interaction.yml) and the standalone runtime lenses
    # (interaction-contracts/*.yml) — and asserts the §8.1 shape plus the
    # invariants the shape alone can't express: kind/budget enums, timer role ∈
    # {backstop,safety-net,self-heal} with justification + stop_condition +
    # event_fast_path present, every declared workflow file exists, and the narrow
    # §7 rule-1 self-trigger check (an emit must not name an event the same
    # contract subscribes to). Fully HERMETIC — no schema fetch, no network — so
    # unlike validate-personas it needs no cross-repo ref; keep it that way. Deep
    # semantic self-trigger analysis is deferred to Story 4 / #1406.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install PyYAML
        run: pip3 install --quiet "pyyaml==6.0.3" --only-binary=":all:"

      - name: Validate interaction contracts
        run: python3 interaction-contracts/validate-interaction-contracts.py .

  validate-interaction-model:
    # Mechanical enforcement (§10) of the agentic interaction model (Story 4 /
    # #1406, epic #1402). docs/agentic-interaction-model.md is a NORMATIVE
    # repo-local standard: the three trigger classes (§2/§3), the timer contract
    # (§6), the GITHUB_TOKEN event-boundary rule + its sanctioned bridges (§5),
    # and a machine-checkable §4 classification table. This job cross-checks the
    # §4 table against the real workflow on: blocks (both misclassification
    # directions + dangling rows + bidirectional completeness), that every
    # Class-2 backstop declares a valid timer_role, and that each role's
    # interaction contract (personas/<id>/interaction.yml,
    # interaction-contracts/*.yml) mirrors its workflows' triggers and declares an
    # idempotency_key + concurrency_lane — surfacing drift and unsafe agent→agent
    # chains at PR time instead of as post-merge runaways. Fully HERMETIC (reads
    # in-repo files only, no schema fetch / no network), like
    # validate-interaction-contracts. PR-triggered on the existing Lint workflow —
    # no new cron/scheduled workload.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Validate the agentic interaction model
        run: bash scripts/validate-interaction-model.sh

  verify-persona-teams:
    # LIVE persona addressing-team check (#1280). The hermetic validate-personas.py
    # (and its hermetic bats suite) verifies the handle SHAPE — the team slug ==
    # id — but deliberately cannot reach the network. This separate job is the
    # network-touching half: for every personas/<id>/persona.yml that declares an
    # `address` block, it verifies the LIVE team named by address.handle EXISTS, is
    # `privacy: closed` (secret teams are unmentionable), and is
    # `notification_setting: notifications_disabled` (the handle routes a webhook,
    # it must not page the team's members). Reading org teams needs an ORG-scoped
    # token (GH_PAT_WORKFLOWS) — github.token cannot read teams. It FAILS CLOSED: an
    # API error is never read as "the team is fine" (#755). Personas with no
    # `address` block pass. It must not be folded back into validate-personas.py,
    # whose hermeticity is the whole reason this was split out.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install PyYAML
        run: pip3 install --quiet pyyaml

      - name: Verify live persona addressing teams
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_DON_PETRY || secrets.GH_PAT_WORKFLOWS }}
        run: bash scripts/verify-persona-teams.sh personas

  verify-persona-identity:
    # Drift check (.github-private#1316) that ties each persona's declared
    # runtime.identity to the workflows that consume it: the credential follows the
    # GH_PAT_<ACCOUNT> naming convention, the secret is actually referenced by a
    # workflow, and every persona shipping a write workflow resolves BOT_USER from
    # the manifest (not the shared vars.BOT_USER that let dev-lead regress to
    # committing as donpetry-bot). No GitHub API calls / no gh — pure
    # manifest↔workflow consistency (PyYAML installed via pip below).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install PyYAML
        run: pip3 install --quiet pyyaml

      - name: Verify persona identity ↔ workflow wiring
        run: bash scripts/verify-persona-identity.sh personas

  gh-aw-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Check for agentic workflow files
        id: check-aw-files
        run: |
          if find .github/workflows \( -name '*.md' -o -name '*.lock.yml' \) -print -quit 2>/dev/null | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No .github/workflows/*.md or *.lock.yml files found — skipping compile."
          fi

      - name: Install gh-aw
        if: steps.check-aw-files.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-aw --pin v0.74.4

      - name: Compile agentic workflows
        if: steps.check-aw-files.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh aw compile --no-emit

      - name: Detect orphaned lock files
        if: steps.check-aw-files.outputs.found == 'true'
        run: |
          orphan=0
          while IFS= read -r lock; do
            md="${lock%.lock.yml}.md"
            if [ ! -f "$md" ]; then
              echo "FAIL: orphaned lock file $lock — no corresponding source $md"
              orphan=1
            fi
          done < <(find .github/workflows -name '*.lock.yml')
          [ "$orphan" -eq 0 ] || exit 1
