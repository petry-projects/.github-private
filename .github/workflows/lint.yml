name: Lint

on:
  pull_request:
    paths:
      - 'scripts/**'
      - '.github/workflows/**'
      - 'tests/**'
      - 'agents/**'
      - 'personas/**'
      - 'interaction-contracts/**'
      - 'evals/**'
      - 'release/**'
      - '.gitleaks.toml'
  # Post-merge coverage parity with `unit` (#1486, epic #1402): re-run the bats
  # suite against actual trunk state after every merge so shell-script behavioral
  # regressions surface on `main`, not just on PRs. Paths are scoped to the
  # bats-relevant surface. `template-drift` opts OUT of push runs (see its `if:`)
  # while it is known-red under #1448.
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: shellcheck
        # --severity=warning: SC2016 (info) fires on printf '`%s`' where backticks
        # are literal markdown, not shell expressions — suppress info-level noise.
        # -x: follow source directives (scripts use # shellcheck source= annotations).
        run: find scripts -name "*.sh" -exec shellcheck --severity=warning -x {} +

  bats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install bats
        run: sudo apt-get install -y bats

      - name: Install Python deps (validator tests)
        run: pip3 install --quiet 'jsonschema>=4' pyyaml

      - name: Install markdownlint-cli2 (behavioral regression test)
        run: npm install -g markdownlint-cli2@0.23.2

