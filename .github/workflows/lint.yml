name: Lint

on:
  pull_request:
    paths:
      - 'scripts/**'
      - '.github/workflows/**'
      - 'tests/**'
      - 'agents/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: shellcheck
        # --severity=warning: SC2016 (info) fires on printf '`%s`' where backticks
        # are literal markdown, not shell expressions — suppress info-level noise.
        run: shellcheck --severity=warning scripts/fleet_monitor.sh scripts/fleet_report.sh

  bats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install bats
        run: sudo apt-get install -y bats

      - name: Run tests
        run: bats tests/fleet_report.bats

  gh-aw-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Check for agentic workflow files
        id: check-aw-files
        run: |
          if find .github/workflows -name '*.md' -print -quit 2>/dev/null | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No .github/workflows/*.md files found — skipping compile."
          fi

      - name: Install gh-aw
        if: steps.check-aw-files.outputs.found == 'true'
        # TODO: pin to a specific release tag/SHA — see https://github.com/github/gh-aw/releases
        run: curl -sSfL https://raw.githubusercontent.com/github/gh-aw/main/install-gh-aw.sh | bash

      - name: Compile agentic workflows
        if: steps.check-aw-files.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh aw compile --no-emit
