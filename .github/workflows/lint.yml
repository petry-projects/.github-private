name: Lint

on:
  pull_request:
    paths:
      - 'scripts/**'
      - '.github/workflows/**'
      - 'tests/**'
      - 'agents/**'
      - 'evals/**'
      - '.gitleaks.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: shellcheck
        # --severity=warning: SC2016 (info) fires on printf '`%s`' where backticks
        # are literal markdown, not shell expressions — suppress info-level noise.
        # -x: follow source directives (scripts use # shellcheck source= annotations).
        run: find scripts -name "*.sh" -exec shellcheck --severity=warning -x {} +

  bats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Install bats
        run: sudo apt-get install -y bats

      - name: Install Python jsonschema (initiative-planner validator tests)
        run: pip3 install --quiet 'jsonschema>=4'

      - name: Run tests
        run: |
          scripts/run-bats.sh \
            tests/fleet_report.bats \
            tests/fleet_stub_drift.bats \
            tests/template_stub_drift.bats \
            tests/canary_rollout.bats \
            tests/test_initiative_canary.bats \
            tests/test_initiative_driver_canary.bats \
            tests/test_mcp_connectivity_check.bats \
            tests/token_report.bats \
            tests/lsp_pilot_compare.bats \
            tests/lsp_pilot_report.bats \
            tests/auto_rebase_health.bats \
            tests/model_pricing.bats \
            tests/test_review_cycle.bats \
            tests/test_pr_automation_budget.bats \
            tests/test_pr_runaway_regression.bats \
            tests/test_ci_status.bats \
            tests/test_push_protection.bats \
            tests/test_verify_auth_scopes.bats \
            tests/test_initiative_driver.bats \
            tests/test_cut_release.bats \
            tests/test_gitleaks_config.bats \
            tests/test_initiative_planner.bats \
            tests/test_initiative_planner_redispatch.bats \
            tests/test_idea_triage.bats \
            tests/test_oversized_pr.bats \
            tests/test_dependabot.bats \
            tests/test_feature_ideation.bats \
            tests/test_apply_repo_settings.bats \
            tests/test_apply_rulesets.bats \
            tests/test_bootstrap_new_repo.bats \
            tests/test_seed_repo_template.bats \
            tests/test_sweep_stuck_reviews.bats \
            tests/test_validate_cases.bats \
            tests/test_review_registry.bats \
            tests/test_pr_diff_dispatch.bats \
            tests/test_plan_review.bats \
            tests/test_plan_critic.bats \
            tests/test_skill_review.bats \
            tests/test_skill_evals.bats \
            tests/test_triage_prompt.bats \
            tests/test_holdout_guard.bats \
            tests/test_skill_eval_report.bats \
            tests/test_eval_health_notify.bats \
            tests/test_consumer_manifest.bats \
            tests/test_downstream_impact_map.bats \
            tests/test_downstream_impact_assemble.bats \
            tests/test_downstream_impact_triage_inline.bats \
            tests/test_downstream_impact_regression.bats \
            tests/test_safety_checks.bats \
            tests/test_safety_checks_triage_inline.bats \
            tests/test_engine_unavailable_notice.bats \
            tests/test_batch_skip_reporting.bats \
            tests/test_review_one_pr_ci_pending.bats

  template-drift:
    # Drift guard (#969): fail when a file committed in petry-projects/repo-template
    # has diverged from its standards-derived baseline, so the template stays a thin
    # distribution layer of standards/ and never becomes a competing fork. Reuses the
    # byte-identity (blob-SHA) model from scripts/fleet_stub_drift.sh. PR-triggered via
    # this existing Lint workflow — no new scheduled/cron workload is added.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Check repo-template stubs have not drifted from standards/
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/template_stub_drift.sh

  validate-agent-profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Install PyYAML
        run: pip3 install --quiet pyyaml

      - name: Validate agent profile frontmatter
        run: |
          set -euo pipefail
          fail=0
          for f in agents/*.md; do
            [ -e "$f" ] || continue
            name_from_file=$(basename "$f" .md)
            if ! awk 'NR==1 && $0!="---"{exit 1} /^---/{n++; if(n==2) exit} END{exit (n<2)}' "$f"; then
              echo "FAIL: $f — frontmatter missing or does not begin on line 1"
              fail=1
              continue
            fi
            frontmatter=$(awk 'BEGIN{found=0} /^---/{found++; if(found==2) exit; next} found==1{print}' "$f")
            if ! printf '%s\n' "$frontmatter" | python3 -c "import sys, yaml; yaml.safe_load(sys.stdin)" 2>/dev/null; then
              echo "FAIL: $f — invalid YAML in frontmatter"
              fail=1
              continue
            fi
            name_from_front=$(printf '%s\n' "$frontmatter" | grep '^name:' | sed 's/^name:[[:space:]]*//' | sed "s/^['\"]//;s/['\"]$//" | head -1)
            if [ -z "$name_from_front" ]; then
              echo "FAIL: $f — missing 'name' field in frontmatter"
              fail=1
            elif [ "$name_from_front" != "$name_from_file" ]; then
              echo "FAIL: $f — name '$name_from_front' does not match filename '$name_from_file'"
              fail=1
            elif ! printf '%s\n' "$name_from_file" | grep -qE '^[a-z0-9]+(-[a-z0-9]+)*$'; then
              echo "FAIL: $f — name '$name_from_file' is not kebab-case (only lowercase letters, digits, and hyphens)"
              fail=1
            fi
            for field in description tools; do
              if ! printf '%s\n' "$frontmatter" | grep -q "^${field}:"; then
                echo "FAIL: $f — missing '${field}' field in frontmatter"
                fail=1
              fi
            done
            echo "OK: $f"
          done
          [ "$fail" -eq 0 ] || exit 1

  gh-aw-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Check for agentic workflow files
        id: check-aw-files
        run: |
          if find .github/workflows \( -name '*.md' -o -name '*.lock.yml' \) -print -quit 2>/dev/null | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No .github/workflows/*.md or *.lock.yml files found — skipping compile."
          fi

      - name: Install gh-aw
        if: steps.check-aw-files.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-aw --pin v0.74.4

      - name: Compile agentic workflows
        if: steps.check-aw-files.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh aw compile --no-emit

      - name: Detect orphaned lock files
        if: steps.check-aw-files.outputs.found == 'true'
        run: |
          orphan=0
          while IFS= read -r lock; do
            md="${lock%.lock.yml}.md"
            if [ ! -f "$md" ]; then
              echo "FAIL: orphaned lock file $lock — no corresponding source $md"
              orphan=1
            fi
          done < <(find .github/workflows -name '*.lock.yml')
          [ "$orphan" -eq 0 ] || exit 1
